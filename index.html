  ['comex', 'COMEX'], ['etf', 'صناديق ETF'], ['physical', 'السوق الفعلي'],
];
TABS().forEach(([id]) => { state.mode[id] = 'stock'; state.period[id] = 'm'; });
state.aboutClosed = {};

function renderTop(){
  const tb = document.getElementById('theme'), dark = state.theme !== 'light';
  tb.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';
  tb.title = dark ? 'الوضع النهاري' : 'الوضع الليلي'; tb.setAttribute('aria-label', tb.title);
  document.getElementById('title').textContent = 'تدفقات الذهب';
  document.getElementById('tagline').textContent = 'تتبّع حركة الذهب العالمية: الدول والبنوك والمؤسسات والأسواق';
  document.title = 'تدفقات الذهب';
  document.getElementById('foot').innerHTML = `<b>${'تنبيه'}:</b> ${'محتوى تعليمي وليس نصيحة استثمارية.'} ` + 'المصادر: IMF IRFCL، وCFTC COT (Legacy وDisaggregated)، وCME (مخزون COMEX وتقرير Issues and Stops)، وSPDR وiShares، وSEC Form 13F، وLBMA، وبورصة شنغهاي للذهب، وYahoo Finance، وFrankfurter. يُحدَّث سعر الذهب كل ساعة، ويُفحص كل مصدر قرب موعد تقريره ويُعرض بتاريخ نشره الحقيقي، ويُكتب التقرير الذكي (Claude Fable 5.1 من Anthropic) فقط عند صدور تقرير كبير جديد.';
}

/* "live" pill: green pulsing dot + time since the last automatic check (amber after 3 hours, red after 6) */
function liveHTML(){
  const chk = STATUS && STATUS.checked_utc;
  if (!chk) return '';
  const mins = Math.max(0, Math.round((Date.now() - new Date(chk).getTime()) / 6e4));
  let rel;
  try { const rtf = new Intl.RelativeTimeFormat(DATE_LOCALE[state.lang], {numeric:'auto'});
    rel = mins < 60 ? rtf.format(-mins, 'minute') : rtf.format(-Math.round(mins / 60), 'hour'); } catch (e) { rel = `${mins} min`; }
  const st = mins > 360 ? 'late' : mins > 180 ? 'slow' : 'ok';
  return `<span class="live ${st}" dir="auto" title="${'البيانات تُحدَّث تلقائيًا'}"><i aria-hidden="true"></i><b>${'مباشر'}</b><span>· ${'آخر تحديث'} ${rel}</span></span>`;
}
setInterval(() => { if (STATUS) renderMast(); }, 60000);

function renderMast(){
  if (!DATA) return;
  const k = [];
  const pl = PRICES && PRICES.last, dly = (PRICES && PRICES.daily) || [];
  if (pl && pl.price){
    const prev = pl.prev_close || (dly.length > 1 ? dly[dly.length - 2][1] : null), ch = prev ? (pl.price / prev - 1) * 100 : null;
    k.push(['سعر الذهب (COMEX GC)', USD(pl.price), `${ch == null ? '' : `<span class="${cls(ch)}">${sPCT(ch)}</span> `}${pl.time ? fStamp.format(new Date(pl.time)) : ''}`]);
  }
  const rl = ((DATA.macro || {}).real10) || [];
  if (rl.length > 5){ const a = last(rl), d = a[1] - rl[rl.length - 6][1];
    k.push(['العائد الحقيقي 10 سنوات', bd(nf2.format(a[1]) + '%'), `<span class="${cls(-d)}">${bd(sg(d) + nf0.format(Math.abs(d * 100)) + ' bp')}</span> ${'أسبوع'}`]); }
  const gx = DATA.gex;
  if (gx && gx.spot){ const qq = QUAD()[gexQuad(gx)];
    k.push(['GEX على GLD', `<em class="${cls(gx.total_m)}">${bd(sg(gx.total_m) + '$' + nf0.format(Math.abs(gx.total_m)) + 'M')}</em>`, qq[0]]); }
  const cbs = (DATA.central_banks || {}).series || [];
  if (cbs.length > 1){ const a = cbs[cbs.length - 1], b = cbs[cbs.length - 2];
    k.push(['البنوك المركزية المُبلِّغة', TN0(a[1]), `<span class="${cls(a[1] - b[1])}">${sTN(a[1] - b[1])}</span> ${'آخر شهر'}`]); }
  const tot = (DATA.comex || {}).total || [];
  if (tot.length){ const a = last(tot), d = tot.length > 1 ? a[1] - tot[tot.length - 2][1] : 0;
    k.push(['مخزون COMEX', TN0(a[1]), `<span class="${cls(d)}">${sTN(d)}</span> ${'آخر يوم'}`]); }
  const gld = (DATA.etf || {}).GLD || [];
  if (gld.length > 1){ const a = last(gld), d = a[1] - gld[gld.length - 2][1];
    k.push(['الذهب في GLD', TN0(a[1]), `<span class="${cls(d)}">${sKG(d)}</span> ${'آخر يوم'}`]); }
  const mm = (DATA.cot_disagg || {}).mm || [];
  if (mm.length > 26){ const v = cotIndexAt(mm, mm.length - 1, 156).idx, t = sigText('spec', v);
    k.push(['مؤشر COT لصناديق التحوط', `${bd(nf0.format(v))}<small style="color:var(--muted)"> / 100</small>`, `<span class="${t[1]}">${t[0]}</span>`]); }
  const efp = (DATA.physical || {}).efp || [];
  if (efp.length && k.length < 6){ const a = last(efp), d = efp.length > 1 ? a[1] - efp[efp.length - 2][1] : 0;
    k.push(['فرق COMEX عن لندن', sUSD(a[1]), `<span class="${cls(d)}">${sUSD(d)}</span> ${'آخر يوم'}`]); }
  document.getElementById('assay').innerHTML = k.slice(0, 6).map(([l, v, s2]) => `<div class="kpi"><span>${l}</span><b>${v}</b><small>${s2}</small></div>`).join('');
  let up = liveHTML();
  const chk = STATUS && STATUS.checked_utc;
  if (chk){
    const g = new Date(chk), age = (Date.now() - g.getTime()) / 36e5;
    up += `<span dir="auto">${'آخر فحص تلقائي'}: ${fStamp.format(g)}</span>`;
    up += age > 6 ? ` <span class="fresh stale">${`التحديث متوقف منذ ${Math.floor(age)} ساعة`}</span>`
      : ` <span class="fresh ok">${'يُفحص كل ساعة ✓'}</span>`;
  }
  document.getElementById('updated').innerHTML = up;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS().map(([id, t]) => id === 'ai'
    ? `<button class="tab tab-ai" role="tab" data-act="tab" data-v="ai" aria-selected="${state.tab === 'ai'}">${t}<span class="ai-badge">AI</span></button>`
    : `<button class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${id === state.tab}">${t}</button>`).join('');
}

function render(){
  renderTabs();
  document.getElementById('view').innerHTML = DATA ? R[state.tab]() : '';
  markWide();
}
/* الجداول الأعرض من الشاشة: عمود أول ثابت وتنبيه بالسحب، كي لا تبدو فارغة على الجوال */
function markWide(){
  // أعمدة ثانوية تُخفى على الجوال: <table data-hm="3,7"> (أرقام الأعمدة من 0)
  document.querySelectorAll('#view table[data-hm]:not([data-hmd])').forEach(t => {
    const ix = t.dataset.hm.split(',').map(Number);
    t.querySelectorAll('tr').forEach(r => ix.forEach(i => r.children[i] && r.children[i].classList.add('hm')));
    t.dataset.hmd = '1';
  });
  document.querySelectorAll('#view .tablebox').forEach(tb => {
    const wide = tb.scrollWidth > tb.clientWidth + 2, hint = tb.previousElementSibling && tb.previousElementSibling.classList.contains('swipe');
    tb.classList.toggle('wide', wide);
    if (wide && !hint) tb.insertAdjacentHTML('beforebegin', `<div class="swipe">${isAr() ? '⇠' : '⇢'} ${'اسحب الجدول لرؤية بقية الأعمدة'}</div>`);
    if (!wide && hint) tb.previousElementSibling.remove();
  });
}
let wideT; addEventListener('resize', () => { clearTimeout(wideT); wideT = setTimeout(markWide, 200); });
document.addEventListener('toggle', () => markWide(), true);

/* weekend panel: Saturday and Sunday by Vienna time; ?weekend=1 previews it, "Open the page" hides it for this visit */
const isWeekend = () => {
  const q = new URLSearchParams(location.search).get('weekend');
  if (q === '1') return true;
  if (q === '0') return false;
  const d = new Intl.DateTimeFormat('en-US', {weekday: 'short', timeZone: 'Europe/Vienna'}).format(new Date());
  return d === 'Sat' || d === 'Sun';
};
let weekendOpen = false;
try { weekendOpen = sessionStorage.getItem('gold-weekend-open') === '1'; } catch (e) {}
function renderWeekend(){
  const w = document.getElementById('weekend');
  if (!isWeekend() || weekendOpen){ w.hidden = true; document.body.style.overflow = ''; return; }
  w.innerHTML = `<div class="wk-top"></div><div class="wk-card">
      <div class="wk-emoji" aria-hidden="true">🏖️<span>😎</span></div>
      <h2 id="wk-title">${'المنصة مغلقة يومي السبت والأحد'}</h2>
      <p>${'استرخِ واستمتع بحياتك'}</p>
      <small>${'الأسواق مغلقة، والبيانات المعروضة حتى إغلاق الجمعة. نعود صباح الإثنين.'}</small>
    </div>
    <button class="wk-open" type="button" data-act="weekend-open">${'فتح الصفحة'}</button>`;
  w.hidden = false;
  document.body.style.overflow = 'hidden';
  w.querySelector('.wk-open').focus({preventScroll: true});
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('weekend').hidden){
    weekendOpen = true;
    try { sessionStorage.setItem('gold-weekend-open', '1'); } catch (err) {}
    renderWeekend();
  }
});

function applyLang(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = isAr() ? 'rtl' : 'ltr';
  try { regionNames = new Intl.DisplayNames([state.lang], {type:'region'}); } catch (e) { regionNames = null; }
  setFormatters();
  renderTop();
  renderFab();
  renderMast();
  render();
  renderWeekend();
}

const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'theme'){
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('gold-theme', state.theme); } catch (err) {}
    applyTheme(); renderTop();
    return;
  }
  if (act === 'weekend-open'){
    weekendOpen = true;
    try { sessionStorage.setItem('gold-weekend-open', '1'); } catch (e) {}
    renderWeekend();
    return;
  }
  if (!DATA) return;
  if (act === 'tab'){ state.tab = v; state.all = false; history.replaceState(null, '', location.pathname + location.search + '#' + v); render();
    document.querySelector('.tabs-bar').scrollIntoView({block:'nearest'}); return; }
  if (act === 'mode') state.mode[state.tab] = v;
  else if (act === 'period') state.period[state.tab] = v;
  else if (act === 'all') state.all = !state.all;
  else if (act === 'sel') state.sel[b.dataset.rv] = +b.dataset.i;
  else if (act === 'country-go') state.country = v;
  else if (act === 'bankview') state.bankView = v;
  else if (act === 'cotcat') state.cotCat = v;
  else if (act === 'bank'){ state.bank = v; state.bankView = 'deliv'; }
  else if (act === 'vault') state.vault = v;
  else if (act === 'mgr') state.mgr = v;
  else if (act === 'sig') state.sig = v;
  else if (act === 'etffund') state.etfFund = v;
  else if (act === 'phys') state.phys = v;
  else if (act === 'aidate') state.aiDate = v;
  else if (act === 'macrop') state.macroP = v;
  rerender();
  if (act === 'country-go'){ const el = document.getElementById('country-pick'); if (el) el.scrollIntoView({block:'center'}); }
  if (act === 'mgr'){ const el = document.getElementById('mgr-anchor'); if (el) el.scrollIntoView({block:'start'}); }
});

document.addEventListener('click', e => {
  const r = e.target.closest('rect.hit');
  if (!r || !DATA) return;
  state.sel[r.dataset.rv] = +r.dataset.i;
  rerender();
  showTip(document.querySelector(`rect.hit[data-rv="${CSS.escape(r.dataset.rv)}"][data-i="${r.dataset.i}"]`));
});

document.addEventListener('change', e => {
  const a = e.target.dataset.act;
  if (a === 'mgr-pick'){ state.mgr = e.target.value; rerender(); }
  if (a === 'country'){ state.country = e.target.value; rerender(); }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.about')) state.aboutClosed[d.dataset.about] = !d.open;
}, true);

function showTip(r){
  if (!r) return;
  const plot = r.closest('.rv-plot'), tt = plot && plot.querySelector('.tt');
  if (!tt) return;
  tt.innerHTML = panelHTML(r.dataset.rv, +r.dataset.i);
  tt.hidden = false;
  const pb = plot.getBoundingClientRect(), rb = r.getBoundingClientRect();
  const cx = rb.left + rb.width / 2 - pb.left, tw = tt.offsetWidth;
  let left = cx + 12;
  if (left + tw > pb.width) left = cx - tw - 12;
  tt.style.left = Math.max(0, left) + 'px';
  plot.querySelectorAll('rect.hover').forEach(x => x.classList.remove('hover'));
  r.classList.add('hover');
}
document.addEventListener('mouseover', e => { const r = e.target.closest && e.target.closest('rect.hit'); if (r) showTip(r); });
document.addEventListener('mouseout', e => {
  const plot = e.target.closest && e.target.closest('.rv-plot');
  if (plot && !plot.contains(e.relatedTarget)){ const tt = plot.querySelector('.tt'); if (tt) tt.hidden = true; }
});

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (TABS().some(([id]) => id === h) && h !== state.tab){ state.tab = h; render(); }
});

(async () => {
  const fromHash = location.hash.slice(1);
  if (TABS().some(([id]) => id === fromHash)) state.tab = fromHash;
  applyLang();
  try {
    const get = f => fetch(f + '?t=' + Date.now(), {cache:'no-store'}).then(x => x.ok ? x.json() : null).catch(() => null);
    const [d, p, s2] = await Promise.all([get('data.json'), get('prices.json'), get('status.json')]);
    if (!d) throw new Error('data.json');
    DATA = d; PRICES = p; STATUS = s2 || {checked_utc: d.generated_utc, sources: d.sources || {}};
    renderMast();
    render();
  } catch (err){
    document.getElementById('assay').textContent = 'لم يُعثر على البيانات';
    document.getElementById('view').innerHTML = `<p class="warn">${'تعذّر قراءة الملف data.json'} (${esc(err.message)}). ${'إذا كان هذا أول تشغيل، افتح تبويب Actions في GitHub، شغّل «تحديث بيانات الذهب»، وانتظر حتى ينتهي ثم أعد تحميل الصفحة.'}</p>`;
  }
})();

</script>
</body>
</html>

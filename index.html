    'Positive GEX: dealers sell rallies and buy dips, so moves are dampened. Negative GEX: they chase moves, so moves are amplified. Where price sits against the two zero-gamma levels sets one of the four quadrants above. The call wall acts as resistance and the put wall as support unless strong flow breaks them.',
    'GEX positivo: i dealer vendono i rialzi e comprano i ribassi, quindi i movimenti si smorzano. GEX negativo: inseguono il movimento, che si amplifica. La posizione del prezzo rispetto ai due livelli di zero gamma determina uno dei quattro quadranti sopra. La call wall fa da resistenza e la put wall da supporto, salvo rotture con flussi forti.',
    'GEX positivo: los dealers venden las subidas y compran las caídas, así que los movimientos se amortiguan. GEX negativo: persiguen el movimiento, que se amplifica. La posición del precio frente a los dos niveles de zero gamma fija uno de los cuatro cuadrantes de arriba. La call wall actúa como resistencia y la put wall como soporte, salvo que un flujo fuerte las rompa.')],
  [L('الحدود', 'Limits', 'Limiti', 'Limitaciones'), L('Open Interest يتحدث مرة يوميًا، فلا يرى هذا القسم تدفقات الحجم خلال الجلسة ولا 0DTE لحظيًا كما في الاشتراكات المدفوعة. افتراض مراكز المتعاملين قد يكون خاطئًا. GLD يتبع الذهب الفوري، والمعادل على GC تقريبي. نعرض المستويات المحسوبة فقط لا بيانات Cboe الخام. التحديث كل 3 ساعات تقريبًا في أيام العمل.',
    'Open interest updates once a day, so this section cannot see intraday volume flows or real-time 0DTE the way paid services do. The dealer-positioning assumption can be wrong. GLD tracks spot gold, so the GC equivalent is approximate. Only the derived levels are shown, not Cboe’s raw data. Updated about every 3 hours on business days.',
    'L’open interest si aggiorna una volta al giorno, quindi questa sezione non vede i flussi di volume intraday né lo 0DTE in tempo reale come i servizi a pagamento. L’ipotesi sul posizionamento dei dealer può essere sbagliata. GLD segue l’oro spot, quindi l’equivalente GC è approssimativo. Sono mostrati solo i livelli calcolati, non i dati grezzi di Cboe. Aggiornamento circa ogni 3 ore nei giorni lavorativi.',
    'El open interest se actualiza una vez al día, así que esta sección no ve los flujos de volumen intradía ni el 0DTE en tiempo real como los servicios de pago. La hipótesis sobre el posicionamiento de los dealers puede ser errónea. GLD sigue al oro al contado, así que el equivalente en GC es aproximado. Solo se muestran los niveles calculados, no los datos brutos de Cboe. Se actualiza cada 3 horas aproximadamente en días hábiles.')],
];
R.gex = () => {
  const g = DATA.gex;
  let h = head(L('GEX على GLD: مستويات Gamma', 'GEX on GLD: gamma levels', 'GEX su GLD: livelli di gamma', 'GEX en GLD: niveles de gamma'),
    L('أين يكبح المتعاملون حركة الذهب وأين يضخّمونها.', 'Where dealers dampen gold’s moves and where they amplify them.', 'Dove i dealer smorzano i movimenti dell’oro e dove li amplificano.', 'Dónde los dealers amortiguan los movimientos del oro y dónde los amplifican.'),
    [L('Cboe، مؤجل 15 دقيقة', 'Cboe, 15-min delayed', 'Cboe, ritardo 15 min', 'Cboe, 15 min de retraso'), g && g.asof ? `${L('آخر تحديث', 'Updated', 'Aggiornato', 'Actualizado')}: ${fStamp.format(new Date(g.asof))}` : ''], 'gex', g && g.asof ? fresh(g.asof.slice(0, 10), 4) : '');
  h += about('gex', ABOUT.gex());
  if (!g || !g.spot) return h + noData();
  const r = g.gc_ratio, lvl = v => v == null ? '—' : `${r ? USD(v * r) : USD(v)}`, gld = v => v == null ? '' : `GLD ${bd(nf2.format(v))}`;
  const q = QUAD()[gexQuad(g)], mUSD = v => bd(sg(v) + '$' + nf0.format(Math.abs(v)) + 'M');
  h += `<div class="brief gex-quad"><h3><span class="bias ${q[1]}">${q[0]}</span></h3><p>${q[2]}</p></div>`;
  const fig = (label, v, sub, c = '') => `<div class="fig"><h3>${label}</h3><div class="v ${c}">${v}</div><div class="sub">${sub}</div></div>`;
  h += `<div class="figs">
    ${fig(L('Net GEX (لكل حركة 1٪)', 'Net GEX (per 1% move)', 'Net GEX (per movimento dell’1%)', 'Net GEX (por movimiento del 1 %)'), mUSD(g.total_m), g.total_m >= 0 ? L('موجب: تخميد', 'Positive: dampening', 'Positivo: smorzamento', 'Positivo: amortiguación') : L('سالب: تضخيم', 'Negative: amplifying', 'Negativo: amplificazione', 'Negativo: amplificación'), cls(g.total_m))}
    ${fig(L('السعر الحالي ≈ GC', 'Price now ≈ GC', 'Prezzo attuale ≈ GC', 'Precio actual ≈ GC'), lvl(g.spot), gld(g.spot))}
    ${fig(L('Zero Gamma (كل الاستحقاقات)', 'Zero gamma (all expiries)', 'Zero gamma (tutte le scadenze)', 'Zero gamma (todos los vencimientos)'), lvl(g.zero_all), g.zero_all == null ? L('لا يوجد انقلاب قريب', 'No flip nearby', 'Nessun cambio vicino', 'Sin cambio cercano') : gld(g.zero_all))}
    ${fig(`${L('Zero Gamma (أقرب استحقاق)', 'Zero gamma (nearest expiry)', 'Zero gamma (scadenza più vicina)', 'Zero gamma (vencimiento más cercano)')}`, lvl(g.zero_near), `${g.zero_near == null ? L('لا يوجد انقلاب قريب', 'No flip nearby', 'Nessun cambio vicino', 'Sin cambio cercano') : gld(g.zero_near)} · ${fDay.format(toDate(g.near_exp))}`)}
    ${fig('Call Wall', lvl(g.call_wall), `${gld(g.call_wall)} · ${L('مقاومة', 'resistance', 'resistenza', 'resistencia')}`, 'up')}
    ${fig('Put Wall', lvl(g.put_wall), `${gld(g.put_wall)} · ${L('دعم', 'support', 'supporto', 'soporte')}`, 'down')}</div>`;
  const st = g.strikes || [];
  if (st.length > 2){
    const W = 640, H = 240, T = 10, B = 10, n = st.length, cw = W / n;
    const nets = st.map(s => s[1] + s[2]), mx = Math.max(1e-9, ...nets.map(Math.abs)), zy = T + (H - T - B) / 2, sc = (H - T - B) / 2 / mx;
    /* bars sit one per strike (strike spacing widens away from the money), so lines are placed between the same bars */
    const xOf = K => { let i = 0; while (i < n - 2 && st[i + 1][0] < K) i++;
      const f = Math.max(0, Math.min(1, (K - st[i][0]) / ((st[i + 1][0] - st[i][0]) || 1))); return ((i + f) * cw + cw / 2).toFixed(1); };
    let svg = `<svg class="rvc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Net GEX by strike">`;
    st.forEach((s, i) => { const v = nets[i], x = (i * cw + cw * .15).toFixed(1), w = (cw * .7).toFixed(1), hh = Math.max(1, Math.abs(v) * sc);
      svg += `<rect class="${v >= 0 ? 'b-up' : 'b-down'}" x="${x}" y="${(v >= 0 ? zy - hh : zy).toFixed(1)}" width="${w}" height="${hh.toFixed(1)}"><title>GLD ${s[0]}${r ? ` ≈ GC ${nf0.format(s[0] * r)}` : ''}: ${sg(v)}$${nf1.format(Math.abs(v))}M</title></rect>`; });
    svg += `<line x1="0" x2="${W}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" stroke="var(--muted)" stroke-width="1" opacity=".6" vector-effect="non-scaling-stroke"/>`;
    svg += `<line x1="${xOf(g.spot)}" x2="${xOf(g.spot)}" y1="0" y2="${H}" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    if (g.zero_all != null && g.zero_all >= st[0][0] && g.zero_all <= st[n - 1][0]) svg += `<line x1="${xOf(g.zero_all)}" x2="${xOf(g.zero_all)}" y1="0" y2="${H}" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`;
    svg += '</svg>';
    const tk = [0, .25, .5, .75, 1].map(f => { const s = st[Math.round(f * (n - 1))]; return `<span>${r ? nf0.format(s[0] * r) : s[0]}<small class="muted"> · ${s[0]}</small></span>`; }).join('');
    h += `<div class="rv"><h3 class="rv-title">${L('Net GEX حسب سعر التنفيذ', 'Net GEX by strike', 'Net GEX per strike', 'Net GEX por strike')}</h3>
      <div class="legend"><span><i style="background:var(--buy)"></i>${L('موجب (Calls أغلب)', 'Positive (calls dominate)', 'Positivo (prevalgono le call)', 'Positivo (dominan las calls)')}</span><span><i style="background:var(--sell)"></i>${L('سالب (Puts أغلب)', 'Negative (puts dominate)', 'Negativo (prevalgono le put)', 'Negativo (dominan las puts)')}</span>
        <span><i style="background:var(--gold)"></i>${L('السعر الحالي', 'Current price', 'Prezzo attuale', 'Precio actual')}</span><span><i class="lg-dash"></i>Zero Gamma</span></div>
      <div class="rv-plot">${svg}<div class="ticks spread">${tk}</div></div>
      <p class="explain">${L('المحور السفلي: ما يعادل GC، ثم سعر تنفيذ GLD. مرّر المؤشر على أي عمود لرؤية قيمته.', 'Bottom axis: the GC equivalent, then the GLD strike. Hover over any bar to see its value.', 'Asse inferiore: equivalente GC, poi lo strike di GLD. Passa sopra una barra per vederne il valore.', 'Eje inferior: el equivalente en GC y luego el strike de GLD. Pasa el cursor por una barra para ver su valor.')}</p></div>`;
  }
  const hist = (g.history || []).slice().reverse();
  if (hist.length) h += `<h3 class="rv-title">${L('سجل المستويات اليومي', 'Daily level history', 'Storico giornaliero dei livelli', 'Historial diario de niveles')}</h3>
    <div class="tablebox"><table><thead><tr><th>${L('التاريخ', 'Date', 'Data', 'Fecha')}</th><th class="n">${L('السعر ≈ GC', 'Price ≈ GC', 'Prezzo ≈ GC', 'Precio ≈ GC')}</th><th class="n">Zero Gamma</th><th class="n">${L('Zero Gamma قريب', 'Near zero gamma', 'Zero gamma vicino', 'Zero gamma cercano')}</th><th class="n">Put Wall</th><th class="n">Call Wall</th><th class="n">Net GEX</th><th>${L('الربع', 'Quadrant', 'Quadrante', 'Cuadrante')}</th></tr></thead><tbody>
    ${hist.map(x => { const rr = x.gc_ratio || r, f = v => v == null ? '—' : bd(nf0.format(v * (rr || 1))), qq = QUAD()[gexQuad({...x, near_total_m: x.total_m})];
      return `<tr><td>${fDay.format(toDate(x.d))}</td><td class="n">${f(x.spot)}</td><td class="n">${f(x.zero_all)}</td><td class="n">${f(x.zero_near)}</td><td class="n">${f(x.put_wall)}</td><td class="n">${f(x.call_wall)}</td><td class="n ${cls(x.total_m)}">${mUSD(x.total_m)}</td><td><span class="badge" style="background:color-mix(in srgb,var(--muted) 18%,transparent)">${qq[0]}</span></td></tr>`; }).join('')}</tbody></table></div>`;
  return h;
};

/* ---------- bias track record ---------- */
const DIRS = () => ({up: ['↑', L('صعود', 'Up', 'Rialzo', 'Subida'), 'up'], flat: ['→', L('عرضي', 'Flat', 'Laterale', 'Lateral'), 'flat'], down: ['↓', L('هبوط', 'Down', 'Ribasso', 'Bajada'), 'down']});
function trackHTML(){
  const t = DATA.outlook_track, rows = t ? t.rows.slice().reverse() : [];
  const D = DIRS(), B = BIAS();
  let h = `<section class="ai-card track"><h3>${L('سجل أداء الانحياز', 'Bias track record', 'Storico del bias', 'Historial del sesgo')}</h3>
    <p class="explain">${L('كل انحياز يُقارن بعد 14 يومًا بإغلاق الذهب (GC): صعود إن زاد أكثر من 2٪، وهبوط إن نقص أكثر من 2٪، وإلا عرضي. مقياس Brier من 0 (مثالي) إلى 2؛ من يعطي كل اتجاه الثلث يحصل على 0.667، فالأقل منه أفضل من التخمين.',
      'Each bias is checked 14 days later against the gold close (GC): up if it rose more than 2%, down if it fell more than 2%, flat otherwise. The Brier score runs from 0 (perfect) to 2; giving each direction a third scores 0.667, so lower than that beats guessing.',
      'Ogni bias viene verificato dopo 14 giorni con la chiusura dell’oro (GC): rialzo se è salito più del 2%, ribasso se è sceso più del 2%, altrimenti laterale. Il punteggio di Brier va da 0 (perfetto) a 2; assegnare un terzo a ogni direzione vale 0,667, quindi un valore più basso batte il caso.',
      'Cada sesgo se comprueba 14 días después con el cierre del oro (GC): subida si avanzó más de un 2 %, bajada si cayó más de un 2 % y lateral en otro caso. La puntuación de Brier va de 0 (perfecta) a 2; dar un tercio a cada dirección puntúa 0,667, así que un valor menor supera al azar.')}</p>`;
  if (!rows.length) return h + `<p class="empty">${L('يبدأ السجل مع أول تقرير جديد، ويظهر أول تقييم بعد 14 يومًا منه.', 'The record starts with the next report, and the first score appears 14 days after it.', 'Lo storico parte dal prossimo report e il primo punteggio arriva 14 giorni dopo.', 'El historial empieza con el próximo informe y la primera puntuación llega 14 días después.')}</p></section>`;
  const s = t.summary;
  if (s.n) h += `<div class="figs">
    <div class="fig"><h3>${L('توقعات مُقيَّمة', 'Calls scored', 'Previsioni valutate', 'Previsiones evaluadas')}</h3><div class="v">${bd(nf0.format(s.n))}</div><div class="sub">${L('بانتظار التقييم', 'Pending', 'In attesa', 'Pendientes')}: ${bd(nf0.format(s.pending))}</div></div>
    <div class="fig"><h3>${L('الانحياز أصاب', 'Bias right', 'Bias corretto', 'Sesgo acertado')}</h3><div class="v">${bd(nf0.format(s.hit) + '%')}</div><div class="sub">${L('التخمين ≈ 33٪', 'Guessing ≈ 33%', 'A caso ≈ 33%', 'Al azar ≈ 33 %')}</div></div>
    <div class="fig"><h3>${L('متوسط Brier', 'Average Brier', 'Brier medio', 'Brier medio')}</h3><div class="v ${s.brier < s.brier_naive ? 'up' : 'down'}">${bd(nf2.format(s.brier))}</div><div class="sub">${L('التخمين', 'Guessing', 'A caso', 'Al azar')}: ${bd(nf2.format(s.brier_naive))}</div></div>
    <div class="fig"><h3>${L('احتمال النتيجة الفعلية', 'Probability given to the outcome', 'Probabilità data all’esito', 'Probabilidad dada al resultado')}</h3><div class="v">${bd(nf0.format(s.p_outcome) + '%')}</div><div class="sub">${L('التخمين ≈ 33٪', 'Guessing ≈ 33%', 'A caso ≈ 33%', 'Al azar ≈ 33 %')}</div></div></div>`;
  h += `<div class="tablebox"><table><thead><tr><th>${L('التاريخ', 'Date', 'Data', 'Fecha')}</th><th>${L('الانحياز', 'Bias', 'Bias', 'Sesgo')}</th><th>${bd(`${D.up[0]} / ${D.flat[0]} / ${D.down[0]}`)}</th><th class="n">${L('سعر البداية', 'Start price', 'Prezzo iniziale', 'Precio inicial')}</th><th class="n">${L('بعد 14 يومًا', 'After 14 days', 'Dopo 14 giorni', 'Tras 14 días')}</th><th>${L('النتيجة', 'Outcome', 'Esito', 'Resultado')}</th><th class="n">Brier</th></tr></thead><tbody>
    ${rows.map(e => { const p = Object.fromEntries(e.dirs.map((d, i) => [d, e.p[i]])), r = e.result;
      const due = new Date(toDate(e.base.date).getTime() + t.days * 864e5);
      return `<tr><td>${fDay.format(toDate(e.date))}</td><td><span class="bias ${B[e.bias][0]} sm">${B[e.bias][1]}</span></td><td>${bd(`${p.up}% / ${p.flat}% / ${p.down}%`)}</td><td class="n">${USD(e.base.price)}</td>
        ${r ? `<td class="n">${USD(r.price)} <span class="${cls(r.ret)}">${sPCT(r.ret)}</span></td><td><span class="${D[r.outcome][2]}">${D[r.outcome][0]} ${D[r.outcome][1]}</span> ${r.bias_hit ? '✓' : '✗'}</td><td class="n">${bd(nf2.format(r.brier))}</td>`

  return h;
}

/* ---------- forced-selling (margin liquidation) monitor ---------- */

    [t.met.vix, L(`VIX فوق ${nf0.format(p.vix)} أو ارتفع ${nf0.format(p.vix3d)}٪`, `VIX above ${nf0.format(p.vix)} or up ${nf0.format(p.vix3d)}%`, `VIX sopra ${nf0.format(p.vix)} o in aumento del ${nf0.format(p.vix3d)}%`, `VIX por encima de ${nf0.format(p.vix)} o subida del ${nf0.format(p.vix3d)} %`), `${t.vix == null ? '—' : bd(nf1.format(t.vix))} (${pc(t.vix3d)})`],
    [t.met.real, L('العائد الحقيقي لم يرتفع (الهبوط لا يفسّره المحرّك المعتاد)', 'The real yield did not rise (the usual driver does not explain the drop)', 'Il rendimento reale non è salito (il solito motore non spiega il calo)', 'La rentabilidad real no subió (el motor habitual no explica la caída)'), t.real3d == null ? '—' : bd(sg(t.real3d) + nf0.format(Math.abs(t.real3d * 100)) + ' bp')],
  ];
  const verdict = t.score === 4 ? ['neg', L('إشارة بيع قسري نشطة', 'Forced-selling signal active', 'Segnale di vendite forzate attivo', 'Señal de venta forzada activa')]
    : t.score >= 2 && t.met.gold ? ['mix', L(`إشارة جزئية (${t.score} من 4)`, `Partial signal (${t.score} of 4)`, `Segnale parziale (${t.score} su 4)`, `Señal parcial (${t.score} de 4)`)]
    : ['neu', L('لا توجد إشارة بيع قسري', 'No forced-selling signal', 'Nessun segnale di vendite forzate', 'Sin señal de venta forzada')];
  let h = `<section class="ai-card liq"><h3>${L('مراقب البيع القسري: هل الهبوط مؤقت بسبب تغطية Margin؟', 'Forced-selling monitor: is a drop temporary margin-driven selling?', 'Monitor delle vendite forzate: il calo è temporaneo e legato ai margini?', 'Monitor de ventas forzadas: ¿la caída es temporal por márgenes?')}</h3>
    <p class="explain">${L('حين يحتاج المستثمرون سيولة لتغطية خسائر أو طلبات Margin في الأسهم، يبيعون الذهب لأنه سهل التسييل، فيهبط مع الأسهم رغم أن أسبابه الأساسية لم تتغير. الجدول أدناه يقيس ما فعله الذهب بعد كل حالة مشابهة منذ 2008؛ وهو نمط تاريخي لا ضمان.',
      'When investors need cash to cover losses or margin calls in stocks, they sell gold because it is easy to liquidate, so it falls with stocks even though its fundamentals have not changed. The table below measures what gold did after each similar episode since 2008; it is a historical pattern, not a guarantee.',
      'Quando gli investitori hanno bisogno di liquidità per coprire perdite o margin call sulle azioni, vendono oro perché è facile da liquidare, e così scende con le azioni anche se i suoi fondamentali non sono cambiati. La tabella qui sotto misura cosa ha fatto l’oro dopo ogni episodio simile dal 2008; è un modello storico, non una garanzia.',

    <div class="ol-bias"><span class="bias ${verdict[0]}">${verdict[1]}</span><p>${L('آخر 3 جلسات حتى', 'Last 3 sessions to', 'Ultime 3 sedute fino al', 'Últimas 3 sesiones hasta el')} ${fDay.format(toDate(t.date))}</p></div>

function kindTable(M, pi){
  const agg = {};
  Object.entries(M).forEach(([cik, m]) => {
    const k = kindOf(cik); if (!k) return;
    const s = m.s[pi] || [], v = s[1], prev = pi ? (m.s.slice(0, pi).reverse().find(x => x[1] != null) || [])[1] : null;
    if (v == null) return;
    const a = agg[k] = agg[k] || {n: 0, hold: 0, net: 0};
    a.n++; a.hold += v; if (prev != null) a.net += v - prev;
  });
  const rows = Object.entries(agg).sort((x, y) => y[1].net - x[1].net);
  if (!rows.length) return '';
  const K = KIND();
  return `<h3 class="rv-title">${L('صافي الشراء حسب نوع المؤسسة', 'Net buying by type of institution', 'Acquisti netti per tipo di istituzione', 'Compras netas por tipo de institución')}</h3>

    ${rows.map(([k, a]) => `<tr><td><span class="kind" style="--k:${K[k][1]}">${K[k][0]}</span></td><td class="n">${bd(nf0.format(a.n))}</td><td class="n">${TN(a.hold)}</td><td class="n ${cls(a.net)}">${sTN(a.net)}</td></tr>`).join('')}</tbody></table></div>
    <p class="explain">${L(`بين أكبر ${nf0.format(Object.keys(M).length)} مؤسسة يتابعها هذا القسم. نوع كل مؤسسة يصنّفه Claude من اسمها ومعرفته العامة، وهو تصنيف تقريبي قد يخطئ في الشركات الصغيرة أو متعددة الأنشطة.`,

      `Tra le ${nf0.format(Object.keys(M).length)} maggiori istituzioni seguite da questa sezione. Il tipo di ogni istituzione è classificato da Claude in base al nome e alle conoscenze generali; è approssimativo e può sbagliare per società piccole o con più attività.`,

}

/* the model's bias and its three scenarios, shown under the summary */
const BIAS = () => ({bullish:['pos', L('صاعد', 'Bullish', 'Rialzista', 'Alcista')], bearish:['neg', L('هابط', 'Bearish', 'Ribassista', 'Bajista')],
  neutral:['neu', L('محايد', 'Neutral', 'Neutrale', 'Neutral')]});
/* lean = P(up) − P(down): shows the tilt that a "neutral" label can hide */
function leanHTML(o){
  if (!o.dirs) return '';
  const P = Object.fromEntries(o.dirs.map((d, i) => [d, +o.p[i] || 0])), x = (P.up || 0) - (P.down || 0);
  const t = x >= 10 ? ['pos', L('ميل صعودي واضح', 'Clear upward lean', 'Inclinazione rialzista netta', 'Inclinación alcista clara')]
    : x >= 4 ? ['pos', L('ميل صعودي طفيف', 'Slight upward lean', 'Lieve inclinazione rialzista', 'Ligera inclinación alcista')]
    : x <= -10 ? ['neg', L('ميل هبوطي واضح', 'Clear downward lean', 'Inclinazione ribassista netta', 'Inclinación bajista clara')]
    : x <= -4 ? ['neg', L('ميل هبوطي طفيف', 'Slight downward lean', 'Lieve inclinazione ribassista', 'Ligera inclinación bajista')]
    : ['neu', L('بلا ميل', 'No lean', 'Nessuna inclinazione', 'Sin inclinación')];
  return `<span class="bias sm ${t[0]}">${t[1]}</span><small class="muted">${bd(`↑ ${P.up}% / ↓ ${P.down}%`)}</small>`;
}
function outlookHTML(r, rep){
  const o = r.outlook, ro = rep.outlook, sc = (ro && ro.scenarios) || [];
  if (!o || !BIAS()[o.bias] || !Array.isArray(o.p) || sc.length < 3) return '';

  return `<section class="ai-outlook">

        : L('الأفق: حتى التقرير الكبير القادم (أسبوع إلى أسبوعين)', 'Horizon: until the next major report (1–2 weeks)', 'Orizzonte: fino al prossimo report importante (1–2 settimane)', 'Horizonte: hasta el próximo informe importante (1–2 semanas)')}</small></div>

    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';

    'Sources: IMF IRFCL, CFTC COT (Legacy and Disaggregated), CME (COMEX vault stocks and the Issues and Stops report), SPDR and iShares, SEC Form 13F, LBMA, the Shanghai Gold Exchange, Yahoo Finance and Frankfurter. The gold price updates every hour, each source is checked around its release time and shown with its real release date, and the AI report (Claude Opus 5.5 from Anthropic) is written only when a major new report comes out.', 'Fonti: IMF IRFCL, CFTC COT (Legacy e Disaggregated), CME (scorte dei caveau COMEX e report Issues and Stops), SPDR e iShares, SEC Form 13F, LBMA, Shanghai Gold Exchange, Yahoo Finance e Frankfurter. Il prezzo dell’oro si aggiorna ogni ora, ogni fonte viene controllata in prossimità del suo orario di pubblicazione ed è mostrata con la sua data di pubblicazione reale, e il report AI (Claude Opus 5.5 di Anthropic) viene scritto solo quando esce un nuovo report importante.', 'Fuentes: IMF IRFCL, CFTC COT (Legacy y Disaggregated), CME (existencias en las bóvedas de COMEX e informe Issues and Stops), SPDR e iShares, SEC Form 13F, LBMA, la Bolsa de Oro de Shanghái, Yahoo Finance y Frankfurter. El precio del oro se actualiza cada hora, cada fuente se revisa en torno a su hora de publicación y se muestra con su fecha de publicación real, y el informe de IA (Claude Opus 5.5, de Anthropic) solo se escribe cuando sale un nuevo informe importante.');
}

function renderMast(){
  if (!DATA) return;
  const k = [];
  const pl = PRICES && PRICES.last, dly = (PRICES && PRICES.daily) || [];
  if (pl && pl.price){
    const prev = pl.prev_close || (dly.length > 1 ? dly[dly.length - 2][1] : null), ch = prev ? (pl.price / prev - 1) * 100 : null;
    k.push([L('سعر الذهب (COMEX GC)', 'Gold price (COMEX GC)', 'Prezzo dell’oro (COMEX GC)', 'Precio del oro (COMEX GC)'), USD(pl.price), `${ch == null ? '' : `<span class="${cls(ch)}">${sPCT(ch)}</span> `}${pl.time ? fStamp.format(new Date(pl.time)) : ''}`]);
  }
  const rl = ((DATA.macro || {}).real10) || [];
  if (rl.length > 5){ const a = last(rl), d = a[1] - rl[rl.length - 6][1];
    k.push([L('العائد الحقيقي 10 سنوات', '10-year real yield', 'Rendimento reale a 10 anni', 'Rentabilidad real a 10 años'), bd(nf2.format(a[1]) + '%'), `<span class="${cls(-d)}">${bd(sg(d) + nf0.format(Math.abs(d * 100)) + ' bp')}</span> ${L('أسبوع', '1 week', '1 settimana', '1 semana')}`]); }
  const gx = DATA.gex;
  if (gx && gx.spot){ const qq = QUAD()[gexQuad(gx)];
    k.push([L('GEX على GLD', 'GLD GEX', 'GEX su GLD', 'GEX en GLD'), `<em class="${cls(gx.total_m)}">${bd(sg(gx.total_m) + '$' + nf0.format(Math.abs(gx.total_m)) + 'M')}</em>`, qq[0]]); }
  const cbs = (DATA.central_banks || {}).series || [];
  if (cbs.length > 1){ const a = cbs[cbs.length - 1], b = cbs[cbs.length - 2];
    k.push([L('البنوك المركزية المُبلِّغة', 'Reporting central banks', 'Banche centrali segnalanti', 'Bancos centrales declarantes'), TN0(a[1]), `<span class="${cls(a[1] - b[1])}">${sTN(a[1] - b[1])}</span> ${L('آخر شهر', 'last month', 'ultimo mese', 'último mes')}`]); }
  const tot = (DATA.comex || {}).total || [];
  if (tot.length){ const a = last(tot), d = tot.length > 1 ? a[1] - tot[tot.length - 2][1] : 0;
    k.push([L('مخزون COMEX', 'COMEX vaults', 'Caveau COMEX', 'Bóvedas de COMEX'), TN0(a[1]), `<span class="${cls(d)}">${sTN(d)}</span> ${L('آخر يوم', 'last day', 'ultimo giorno', 'último día')}`]); }
  const gld = (DATA.etf || {}).GLD || [];
  if (gld.length > 1){ const a = last(gld), d = a[1] - gld[gld.length - 2][1];
    k.push([L('الذهب في GLD', 'Gold in GLD', 'Oro in GLD', 'Oro en GLD'), TN0(a[1]), `<span class="${cls(d)}">${sKG(d)}</span> ${L('آخر يوم', 'last day', 'ultimo giorno', 'último día')}`]); }
  const mm = (DATA.cot_disagg || {}).mm || [];
  if (mm.length > 26){ const v = cotIndexAt(mm, mm.length - 1, 156).idx, t = sigText('spec', v);
    k.push([L('مؤشر COT لصناديق التحوط', 'Hedge-fund COT index', 'Indice COT degli hedge fund', 'Índice COT de los hedge funds'), `${bd(nf0.format(v))}<small style="color:var(--muted)"> / 100</small>`, `<span class="${t[1]}">${t[0]}</span>`]); }
  const efp = (DATA.physical || {}).efp || [];
  if (efp.length && k.length < 6){ const a = last(efp), d = efp.length > 1 ? a[1] - efp[efp.length - 2][1] : 0;
    k.push([L('فرق COMEX عن لندن', 'COMEX vs London', 'COMEX rispetto a Londra', 'COMEX frente a Londres'), sUSD(a[1]), `<span class="${cls(d)}">${sUSD(d)}</span> ${L('آخر يوم', 'last day', 'ultimo giorno', 'último día')}`]); }
  document.getElementById('assay').innerHTML = k.slice(0, 6).map(([l, v, s2]) => `<div class="kpi"><span>${l}</span><b>${v}</b><small>${s2}</small></div>`).join('');
  let up = '';
  const chk = STATUS && STATUS.checked_utc;
  if (chk){
    const g = new Date(chk), age = (Date.now() - g.getTime()) / 36e5;
    up = `<span dir="auto">${L('آخر فحص تلقائي', 'Last automatic check', 'Ultimo controllo automatico', 'Última revisión automática')}: ${fStamp.format(g)}</span>`;
    up += age > 6 ? ` <span class="fresh stale">${L(`التحديث متوقف منذ ${Math.floor(age)} ساعة`, `No check for ${Math.floor(age)} hours`, `Nessun controllo da ${Math.floor(age)} ore`, `Sin revisión desde hace ${Math.floor(age)} horas`)}</span>`
      : ` <span class="fresh ok">${L('يُفحص كل ساعة ✓', 'Checked hourly ✓', 'Controllo ogni ora ✓', 'Revisión cada hora ✓')}</span>`;
  }
  document.getElementById('updated').innerHTML = up;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS().map(([id, t]) => id === 'ai'
    ? `<button class="tab tab-ai" role="tab" data-act="tab" data-v="ai" aria-selected="${state.tab === 'ai'}">${t}<span class="ai-badge">AI</span></button>`
    : `<button class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${id === state.tab}">${t}</button>`).join('');
}

function render(){
  renderTabs();
  document.getElementById('view').innerHTML = DATA ? R[state.tab]() : '';
}

function applyLang(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = isAr() ? 'rtl' : 'ltr';
  try { regionNames = new Intl.DisplayNames([state.lang], {type:'region'}); } catch (e) { regionNames = null; }
  setFormatters();
  renderTop();
  renderFab();
  renderMast();
  render();
}

const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'theme'){
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('gold-theme', state.theme); } catch (err) {}
    applyTheme(); renderTop();
    return;
  }
  if (act === 'lang'){
    state.lang = v;
    try { localStorage.setItem('gold-lang', v); } catch (err) {}
    const u = new URL(location.href); u.searchParams.delete('lang'); history.replaceState(null, '', u.pathname + u.hash);
    const y = window.scrollY; applyLang(); window.scrollTo(0, y);
    return;
  }
  if (!DATA) return;
  if (act === 'tab'){ state.tab = v; state.all = false; history.replaceState(null, '', location.pathname + location.search + '#' + v); render();
    document.querySelector('.tabs-bar').scrollIntoView({block:'nearest'}); return; }
  if (act === 'mode') state.mode[state.tab] = v;
  else if (act === 'period') state.period[state.tab] = v;
  else if (act === 'all') state.all = !state.all;
  else if (act === 'sel') state.sel[b.dataset.rv] = +b.dataset.i;
  else if (act === 'country-go') state.country = v;
  else if (act === 'bankview') state.bankView = v;
  else if (act === 'cotcat') state.cotCat = v;
  else if (act === 'bank'){ state.bank = v; state.bankView = 'deliv'; }
  else if (act === 'vault') state.vault = v;
  else if (act === 'mgr') state.mgr = v;
  else if (act === 'sig') state.sig = v;
  else if (act === 'etffund') state.etfFund = v;
  else if (act === 'phys') state.phys = v;
  else if (act === 'aidate') state.aiDate = v;
  else if (act === 'macrop') state.macroP = v;
  rerender();
  if (act === 'country-go'){ const el = document.getElementById('country-pick'); if (el) el.scrollIntoView({block:'center'}); }
  if (act === 'mgr'){ const el = document.getElementById('mgr-anchor'); if (el) el.scrollIntoView({block:'start'}); }
});

document.addEventListener('click', e => {
  const r = e.target.closest('rect.hit');
  if (!r || !DATA) return;
  state.sel[r.dataset.rv] = +r.dataset.i;
  rerender();
  showTip(document.querySelector(`rect.hit[data-rv="${CSS.escape(r.dataset.rv)}"][data-i="${r.dataset.i}"]`));
});

document.addEventListener('change', e => {
  const a = e.target.dataset.act;
  if (a === 'mgr-pick'){ state.mgr = e.target.value; rerender(); }
  if (a === 'country'){ state.country = e.target.value; rerender(); }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.about')) state.aboutClosed[d.dataset.about] = !d.open;
}, true);

function showTip(r){
  if (!r) return;
  const plot = r.closest('.rv-plot'), tt = plot && plot.querySelector('.tt');
  if (!tt) return;
  tt.innerHTML = panelHTML(r.dataset.rv, +r.dataset.i);
  tt.hidden = false;
  const pb = plot.getBoundingClientRect(), rb = r.getBoundingClientRect();
  const cx = rb.left + rb.width / 2 - pb.left, tw = tt.offsetWidth;
  let left = cx + 12;
  if (left + tw > pb.width) left = cx - tw - 12;
  tt.style.left = Math.max(0, left) + 'px';
  plot.querySelectorAll('rect.hover').forEach(x => x.classList.remove('hover'));
  r.classList.add('hover');
}
document.addEventListener('mouseover', e => { const r = e.target.closest && e.target.closest('rect.hit'); if (r) showTip(r); });
document.addEventListener('mouseout', e => {
  const plot = e.target.closest && e.target.closest('.rv-plot');
  if (plot && !plot.contains(e.relatedTarget)){ const tt = plot.querySelector('.tt'); if (tt) tt.hidden = true; }
});

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (TABS().some(([id]) => id === h) && h !== state.tab){ state.tab = h; render(); }
});

(async () => {
  const fromHash = location.hash.slice(1);
  if (TABS().some(([id]) => id === fromHash)) state.tab = fromHash;
  applyLang();
  try {
    const get = f => fetch(f + '?t=' + Date.now(), {cache:'no-store'}).then(x => x.ok ? x.json() : null).catch(() => null);
    const [d, p, s2] = await Promise.all([get('data.json'), get('prices.json'), get('status.json')]);
    if (!d) throw new Error('data.json');
    DATA = d; PRICES = p; STATUS = s2 || {checked_utc: d.generated_utc, sources: d.sources || {}};
    renderMast();
    render();
  } catch (err){
    document.getElementById('assay').textContent = L('لم يُعثر على البيانات', 'Data not found', 'Dati non trovati', 'Datos no encontrados');
    document.getElementById('view').innerHTML = `<p class="warn">${L('تعذّر قراءة الملف data.json', 'Could not read data.json', 'Impossibile leggere data.json', 'No se pudo leer data.json')} (${esc(err.message)}). ${L('إذا كان هذا أول تشغيل، افتح تبويب Actions في GitHub، شغّل «تحديث بيانات الذهب»، وانتظر حتى ينتهي ثم أعد تحميل الصفحة.', 'If this is the first run, open the Actions tab on GitHub, run the update workflow, wait for it to finish, then reload the page.', 'Se è la prima esecuzione, apri la scheda Actions su GitHub, avvia il workflow di aggiornamento, attendi che termini e poi ricarica la pagina.', 'Si es la primera ejecución, abre la pestaña Actions de GitHub, ejecuta el workflow de actualización, espera a que termine y vuelve a cargar la página.')}</p>`;
  }
})();

</script>
</body>
</html>

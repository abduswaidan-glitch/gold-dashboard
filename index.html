<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="تدفقات الذهب: تتبّع حركة الذهب العالمية | Gold Flows: tracking global gold">
<title>تدفقات الذهب</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23C99A2E'/><circle cx='50' cy='50' r='34' fill='none' stroke='%23F2C14E' stroke-width='6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* night first: deep navy surfaces, soft off-white ink, gold accent; light palette on request */
  --bg:#0A0F15; --surface:#111821; --surface-2:#16202B; --ink:#E3E8EE; --muted:#93A0B0; --rule:#233040;
  --navy:#0C121A; --navy-2:#1A2531; --navy-ink:#E9EDF2; --navy-muted:#9AA7B6;
  --gold:#E0B44C; --gold-hi:#F5CE6B; --gold-lo:#B8892B; --gold-ink:#241903; --gold-soft:rgba(224,180,76,.13);
  --buy:#3CC48C; --sell:#F06A5D; --blue:#78A6FF; --orange:#F5A142; --alt:#7FB0D1;
  --sel-bg:var(--gold); --sel-ink:var(--gold-ink);
  --metal:var(--gold); --metal-hi:var(--gold-hi); --metal-lo:var(--gold-lo); --ingot-ink:var(--gold-ink);
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.35);
  --sans:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",Tahoma,system-ui,sans-serif;
  --kufi:var(--sans);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#0F1720; --muted:#5B6776; --rule:#E2E6EB;
  --navy:#131A22; --navy-2:#232F3E;
  --gold:#C99A2E; --gold-hi:#F2C14E; --gold-lo:#9C7420; --gold-soft:rgba(201,154,46,.12);
  --buy:#0B8A5A; --sell:#C9372C; --blue:#1F62D6; --orange:#D97706; --alt:#3B6EA8;
  --sel-bg:var(--navy-2); --sel-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(15,23,32,.05),0 1px 1px rgba(15,23,32,.03); color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.site-head{background:var(--navy);color:var(--navy-ink);border-bottom:3px solid var(--gold)}
.util{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;direction:ltr;padding:10px 20px 0;font-size:12.5px;color:var(--navy-muted);flex-wrap:wrap-reverse}
.util .updated{direction:inherit;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:12px;padding-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.coin{width:40px;height:40px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,var(--gold-hi) 0 18%,var(--gold) 52%,var(--gold-lo) 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 0 0 2px rgba(242,193,78,.25)}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:0;line-height:1.15}
.brand h1 span{color:var(--gold-hi)}
.brand p{margin:2px 0 0;font-size:13.5px;color:var(--navy-muted)}
.lang{display:inline-flex;flex:none;margin-left:auto;margin-right:8px;border:1px solid rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.lang button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--navy-ink)}
.lang button+button{border-left:1px solid rgba(255,255,255,.18)}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:600}
.lang img{width:20px;height:14px;object-fit:cover;border-radius:2px}
.lang .lc{display:none}
.theme-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border-radius:99px;cursor:pointer;
  border:1px solid rgba(255,255,255,.18);background:none;color:var(--gold-hi)}
.theme-btn svg{width:16px;height:16px}
@media (max-width:600px){.lang .ln{display:none}.lang .lc{display:inline}.lang button{padding:5px 9px}}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:-1px;padding-top:16px;padding-bottom:4px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);min-width:0;
  border-top:3px solid var(--gold)}
.kpi span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:21px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:12.5px}
.kpi b em{font-style:normal}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:last-child{grid-column:1/-1}}

/* tabs */
.tabs-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--rule);
  box-shadow:0 2px 6px rgba(15,23,32,.04);margin-top:16px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:14px 13px 11px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14.5px;
  border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tab-ai{display:inline-flex;align-items:center;gap:8px;margin:7px 0 7px 6px;padding:7px 14px;border-radius:99px;border:0;color:var(--gold-ink);font-weight:700;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo))}
[dir="ltr"] .tab-ai{margin:7px 6px 7px 0}
.tab-ai:hover{color:var(--gold-ink);filter:brightness(1.05)}
.tab-ai[aria-selected="true"]{color:var(--gold-ink);border-bottom-color:transparent;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.ai-badge{font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--navy);color:var(--gold-hi);padding:1px 6px;border-radius:5px;direction:ltr}

/* ---------- section scaffolding ---------- */
main{padding:22px 0 40px}
.sec-head{margin-bottom:6px}
.sec-head h2{font-size:24px;font-weight:700;margin:0 0 4px;line-height:1.3}
.sec-head p{margin:0;color:var(--muted);max-width:72ch}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;align-items:center}
.chip{font-size:12.5px;padding:3px 10px;border:1px solid var(--rule);border-radius:99px;color:var(--muted);background:var(--surface)}
.fresh{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--surface)}
.fresh.ok{color:var(--buy);border-color:color-mix(in srgb,var(--buy) 40%,transparent)}
.fresh.stale{color:var(--sell);border-color:color-mix(in srgb,var(--sell) 40%,transparent)}
.site-head .fresh{background:transparent}
.warn{overflow-wrap:anywhere;margin:14px 0 0;padding:10px 14px;border-inline-start:3px solid var(--sell);background:var(--surface);border-radius:6px;font-size:14px}
.explain{color:var(--muted);font-size:13.5px;max-width:80ch;margin:6px 0 14px}
.empty{color:var(--muted);padding:12px 0;margin:0}
.about{border:1px solid var(--rule);background:var(--surface);margin:16px 0 18px;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.about summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.about summary::-webkit-details-marker{display:none}
.about summary::before{content:"i";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold-soft);color:var(--gold-lo);font-size:12px;font-weight:700;margin-inline-end:8px;flex:none}
.about summary span{flex:1}
.about summary::after{content:"−";color:var(--muted);font-weight:400}
.about:not([open]) summary::after{content:"+"}
.about-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 26px;padding:2px 16px 14px;border-top:1px solid var(--rule);background:var(--surface-2)}
.about-body h4{margin:12px 0 3px;font-size:14px}
.about-body p{margin:0;font-size:13.5px;max-width:68ch}

/* controls & chips */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 16px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip-btn{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.chip-btn:hover{border-color:var(--gold)}
.chip-btn[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.picker{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.picker label{font-weight:600;font-size:14px;display:flex;align-items:center}
.picker select{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:8px;min-width:200px}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;font:inherit;text-align:start}
.linkish:hover{text-decoration-color:var(--gold)}
.more{border:1px solid var(--rule);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;margin:4px 0 18px}
.flag{width:20px;height:14px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-inline-end:7px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}

/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.fig{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.fig h3{margin:0;font-size:13.5px;font-weight:500;color:var(--muted)}
.fig .v{font-size:27px;font-weight:700;line-height:1.3;margin-top:2px}
.fig .sub{font-size:13px;color:var(--muted)}
.fig .note{font-size:12.5px;color:var(--muted);margin-top:6px}
.chg{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:8px}
.chg b{font-size:16px}
.chg em{font-style:normal;font-size:12.5px;padding:0 8px;border-radius:4px}
.up{color:var(--buy)} .down{color:var(--sell)} .flat,.na{color:var(--muted)}
.ink{color:var(--ink)} .orange{color:var(--orange)} .blue{color:var(--blue)}
.up em{background:color-mix(in srgb,var(--buy) 12%,transparent)} .down em{background:color-mix(in srgb,var(--sell) 12%,transparent)}
.since{display:block;font-size:12.5px;color:var(--muted)}

/* report viewer */
.rv{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;margin:0 0 20px;box-shadow:var(--shadow)}
.rv-title{font-size:16px;font-weight:600;margin:0 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:6px}
.rv-plot{position:relative;direction:ltr;background:var(--surface-2);border-radius:8px;padding:6px 6px 2px}
.rvc{display:block;width:100%;height:230px}
.rvc .b-up{fill:var(--buy)} .rvc .b-down{fill:var(--sell)}
.rvc .zero{stroke:var(--muted);stroke-width:1;opacity:.6}
.rvc .l-net{fill:none;stroke:var(--ink);stroke-width:2}
.rvc .hit{fill:transparent;cursor:pointer}
.rvc .hit.hover{fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.rvc .selcol{fill:var(--gold-soft)}
.ticks{display:flex;font-size:11.5px;color:var(--muted);padding:4px 0 2px}
.ticks span{flex:1;text-align:center;white-space:nowrap}
.tt{position:absolute;top:8px;z-index:3;min-width:240px;max-width:310px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);border-top:3px solid var(--gold);border-radius:8px;box-shadow:0 10px 30px rgba(15,23,32,.18);padding:9px 12px;font-size:13px;pointer-events:none}
.tt-d{font-weight:700;margin-bottom:5px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.tt div:not(.tt-d){display:flex;justify-content:space-between;gap:14px;padding:1px 0}
.rv-bottom{display:grid;grid-template-columns:1fr 250px;gap:14px;margin-top:14px}
.rv-sel{font-size:13px;color:var(--muted);margin-bottom:6px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.cell h4{margin:0;font-size:12.5px;font-weight:500;color:var(--muted)}
.cell .cv{font-size:20px;font-weight:700;line-height:1.35}
.cell .cs{font-size:12.5px;color:var(--muted)}
.rv-list{max-height:260px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.rep{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:7px 11px;cursor:pointer;font-size:13px;text-align:start}
.rep:hover{background:var(--surface-2)}
.rep[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.rep[aria-pressed="true"] .up,.rep[aria-pressed="true"] .down,.rep[aria-pressed="true"] .flat{color:inherit}

/* tables & lists */
.tablebox{overflow-x:auto;border:1px solid var(--rule);background:var(--surface);margin-bottom:12px;border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
tbody tr:hover{background:var(--surface-2)}
td.n,th.n{text-align:end}
tr:last-child td{border-bottom:0}
.rank{color:var(--muted);width:2.5em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px}
.ranked{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.ranked h3{font-size:15px;margin:0 0 6px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(100px,9em) 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.row:last-child{border-bottom:0}
.ranked.wide .row{grid-template-columns:minmax(150px,15em) 1fr auto}
.row .track{height:8px;background:color-mix(in srgb,var(--muted) 12%,transparent);border-radius:99px;overflow:hidden}
.row .bar{height:100%;border-radius:99px}
.row .bar.up{background:var(--buy)} .row .bar.down{background:var(--sell)}
.row .val{text-align:end;font-weight:600}
.row .det{grid-column:1/-1;font-size:12.5px;color:var(--muted)}

/* dossier (13F) & briefs */
.dossier{border:1px solid var(--rule);background:var(--surface);margin:22px 0 22px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.dossier-head{display:flex;gap:16px;align-items:center;padding:16px 18px;background:var(--navy);color:var(--navy-ink);border-bottom:3px solid var(--gold)}
.dossier-head h2{font-size:21px;font-weight:700;margin:0;line-height:1.3}
.dossier-head p{margin:2px 0 0;font-size:14px;color:var(--navy-muted)}
.stamp{font-weight:800;font-size:20px;border:2px solid var(--gold);color:var(--gold-hi);padding:4px 10px;line-height:1.1;flex:none;direction:ltr;border-radius:6px}
.dossier-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 28px;padding:6px 18px 16px}
.dossier-body h3{font-size:15px;margin:14px 0 4px}
.dossier-body p,.dossier-body li{font-size:14px;max-width:70ch}
.dossier-body p{margin:0 0 6px}
.legend-list{list-style:none;padding:0;margin:0 0 6px}
.legend-list li{margin:5px 0}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.st-new{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.st-up{background:color-mix(in srgb,var(--buy) 14%,transparent);color:var(--buy)}
.st-down{background:color-mix(in srgb,var(--sell) 12%,transparent);color:var(--sell)}
.st-closed{background:var(--sell);color:#fff}
.st-same{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.brief{border:1px solid var(--rule);border-inline-start:4px solid var(--gold);background:var(--surface);padding:14px 18px;margin:0 0 16px;border-radius:var(--radius);box-shadow:var(--shadow)}
.brief h3{margin:0 0 6px;font-size:16px}
.brief p{margin:0 0 6px;max-width:85ch;font-size:14.5px}
.note-warn{color:var(--sell);font-size:13px}

/* COT gauges */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0 14px}
.gauge{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:start;font:inherit;color:inherit;box-shadow:var(--shadow)}
.gauge:hover{border-color:var(--gold)}
.gauge[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.gauge h3{margin:0;font-size:14px;font-weight:600}
.gauge .gv{font-size:30px;font-weight:700;line-height:1.3}
.gbar{position:relative;height:10px;margin:8px 0 4px;direction:ltr;border-radius:99px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--sell) 55%,transparent) 0 10%,color-mix(in srgb,var(--muted) 16%,transparent) 10% 90%,color-mix(in srgb,var(--buy) 55%,transparent) 90% 100%)}
.gbar i{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);transform:translateX(-1px);border-radius:2px}
.gbar b{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--gold);background:var(--surface);transform:translate(-5px,3px)}
.gscale{position:relative;height:16px;font-size:11px;color:var(--muted);direction:ltr}
.gscale span{position:absolute;top:0;transform:translateX(-50%)}
.gscale span:first-child{transform:none}
.gscale span:last-child{transform:translateX(-100%)}
.gtxt{font-size:13px;margin-top:6px}
.sig-hot{color:var(--sell);font-weight:600} .sig-cold{color:var(--blue);font-weight:600} .sig-mid{color:var(--muted)}

/* ---------- AI report ---------- */
.ai-intro{border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin:22px 0 18px}
.ai-intro-head{display:flex;align-items:center;gap:14px;padding:16px 18px;color:var(--gold-ink);
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo))}
.ai-intro-head h2{margin:0;font-size:21px;font-weight:700}
.ai-intro-head p{margin:2px 0 0;font-size:14px}
.ai-intro-head .ai-badge{font-size:14px;padding:3px 9px}
.ai-dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0 14px}

.tone.neg{background:color-mix(in srgb,var(--sell) 13%,transparent);color:var(--sell)}

.ai-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}

<body>

  <div class="util wrap"><p class="updated" id="updated"></p><div class="lang" id="lang" role="group" aria-label="Language / اللغة"></div><button class="theme-btn" id="theme" type="button" data-act="theme"></button></div>
  <div class="brand-row wrap">
    <div class="brand"><span class="coin" aria-hidden="true"></span><div><h1 id="title">تدفقات الذهب</h1><p id="tagline"></p></div></div>
  </div>
</header>
<section class="kpis wrap" id="assay" aria-label="KPIs"></section>
<div class="tabs-bar"><nav class="tabs wrap" role="tablist" id="tabs"></nav></div>
<main class="wrap" id="view" aria-live="polite"></main>
<footer class="wrap" id="foot"></footer>
<button class="fab" id="fab" type="button"></button>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* ================= language ================= */
const state = {lang:'ar', tab:'ai', aiDate:null, mode:{}, period:{}, all:false, sel:{}, country:null,
  bankView:'cot', cotCat:'swap', bank:null, vault:null, mgr:null, sig:'mm', etfFund:'GLD', phys:'efp'};
const LANGS = ['ar', 'en', 'it', 'es'];
/* night theme by default; the moon/sun button switches to light and is remembered */
state.theme = 'dark';
try { if (localStorage.getItem('gold-theme') === 'light') state.theme = 'light'; } catch (e) {}
const applyTheme = () => { if (state.theme === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; };
applyTheme();
try { const s = localStorage.getItem('gold-lang'); if (LANGS.includes(s)) state.lang = s; } catch (e) {}
const qLang = new URLSearchParams(location.search).get('lang');
if (LANGS.includes(qLang)) state.lang = qLang;
/* L(ar, en, it, es): Italian and Spanish fall back to English when a text is missing */
const L = (ar, en, it, es) => state.lang === 'ar' ? ar : state.lang === 'it' ? (it ?? en) : state.lang === 'es' ? (es ?? en) : en;
const isAr = () => state.lang === 'ar';

/* ================= formatting ================= */
const DATE_LOCALE = {ar:'ar-u-nu-latn', en:'en-GB', it:'it-IT', es:'es-ES'};
const NUM_LOCALE = {ar:'en-US', en:'en-US', it:'it-IT', es:'es-ES'};
let nf0, nf1, nf2, fMonth, fDay, fStamp, fShortM, fList, fRel;
function setFormatters(){
  const nl = NUM_LOCALE[state.lang];
  nf0 = new Intl.NumberFormat(nl, {maximumFractionDigits:0});
  nf1 = new Intl.NumberFormat(nl, {minimumFractionDigits:1, maximumFractionDigits:1});
  nf2 = new Intl.NumberFormat(nl, {minimumFractionDigits:2, maximumFractionDigits:2});
  const loc = DATE_LOCALE[state.lang];
  fMonth = new Intl.DateTimeFormat(loc, {month:'long', year:'numeric', timeZone:'UTC'});
  fDay = new Intl.DateTimeFormat(loc, {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'});
  fStamp = new Intl.DateTimeFormat(loc, {dateStyle:'medium', timeStyle:'short'});
  fShortM = new Intl.DateTimeFormat(loc, {month:'short', year:'2-digit', timeZone:'UTC'});
  fList = new Intl.DateTimeFormat(loc, {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'});
  fRel = new Intl.DateTimeFormat(loc, {weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'numeric', minute:'2-digit'});
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDate = s => new Date(s + 'T00:00:00Z');
const dm = d => { const t = toDate(d); return `${t.getUTCDate()}/${t.getUTCMonth() + 1}`; };
const sg = v => v > 0 ? '+' : v < 0 ? '−' : '';
const bd = s => `<bdi dir="ltr">${s}</bdi>`;
const U = {t: () => L('طن', 't', 't', 't'), kg: () => L('كغ', 'kg', 'kg', 'kg'), ct: () => L('عقد', 'contracts', 'contratti', 'contratos'), oz: () => '$/oz'};
const KG = v => `${bd((v < 0 ? '−' : '') + nf0.format(Math.abs(v)))} ${U.kg()}`;
const TN0 = v => `${bd(nf0.format(v / 1000))} ${U.t()}`;
const TN = v => `${bd((v < 0 ? '−' : '') + nf1.format(Math.abs(v) / 1000))} ${U.t()}`;
const sKG = v => `${bd(sg(v) + nf0.format(Math.abs(v)))} ${U.kg()}`;
const sTN = v => `${bd(sg(v) + nf1.format(Math.abs(v) / 1000))} ${U.t()}`;
const CT = v => `${bd((v < 0 ? '−' : '') + nf0.format(Math.abs(v)))} ${U.ct()}`;
const sCT = v => `${bd(sg(v) + nf0.format(Math.abs(v)))} ${U.ct()}`;
const USD = v => bd((v < 0 ? '−$' : '$') + nf2.format(Math.abs(v)));
const sUSD = v => bd(sg(v) + '$' + nf2.format(Math.abs(v)));
const sPCT = p => p == null || !isFinite(p) ? '' : bd(sg(p) + nf2.format(Math.abs(p)) + '%');
const plainSigned = (v, unit) => `${sg(v)}${nf0.format(Math.abs(v))} ${unit}`;
const isMonthly = s => s.length > 1 && s.every(p => p[0].endsWith('-01'));
const fmtD = (d, monthly) => monthly ? fMonth.format(toDate(d)) : fDay.format(toDate(d));
const CONTRACT_KG = 100 * 0.0311034768;
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';

/* ================= countries: ISO3 -> ISO2, names, flags ================= */
const ISO2 = Object.fromEntries(('USA:US DEU:DE ITA:IT FRA:FR RUS:RU CHN:CN CHE:CH JPN:JP IND:IN NLD:NL TUR:TR PRT:PT POL:PL UZB:UZ SAU:SA GBR:GB '
 + 'KAZ:KZ ESP:ES AUT:AT THA:TH SGP:SG BEL:BE DZA:DZ PHL:PH VEN:VE IRQ:IQ BRA:BR EGY:EG SWE:SE ZAF:ZA MEX:MX LBY:LY GRC:GR KOR:KR '
 + 'ROU:RO HUN:HU AUS:AU KWT:KW IDN:ID DNK:DK PAK:PK ARG:AR BLR:BY FIN:FI QAT:QA BGR:BG JOR:JO MYS:MY CZE:CZ SRB:RS PER:PE SVK:SK '
 + 'UKR:UA ARE:AE OMN:OM BHR:BH LBN:LB MAR:MA TUN:TN SYR:SY CAN:CA NOR:NO IRL:IE ISR:IL LUX:LU IRN:IR KGZ:KG TJK:TJ MNG:MN GHA:GH '
 + 'NGA:NG COL:CO CHL:CL ECU:EC BOL:BO HRV:HR SVN:SI LTU:LT LVA:LV EST:EE CYP:CY MLT:MT ISL:IS NZL:NZ VNM:VN BGD:BD LKA:LK MMR:MM '
 + 'KHM:KH AZE:AZ ARM:AM GEO:GE MKD:MK ALB:AL BIH:BA MDA:MD URY:UY PRY:PY GTM:GT DOM:DO SLV:SV HKG:HK MUS:MU KEN:KE SDN:SD MOZ:MZ '
 + 'CUW:CW ABW:AW AGO:AO CRI:CR HND:HN NIC:NI PAN:PA JAM:JM TTO:TT BRB:BB SUR:SR GUY:GY HTI:HT MWI:MW ZMB:ZM ZWE:ZW UGA:UG TZA:TZ '
 + 'RWA:RW MDG:MG BWA:BW NAM:NA SEN:SN CIV:CI CMR:CM MLI:ML BFA:BF MRT:MR YEM:YE AFG:AF NPL:NP LAO:LA PNG:PG FJI:FJ BRN:BN MAC:MO '
 + 'CUB:CU PRK:KP TWN:TW TKM:TM MNE:ME XKX:XK ETH:ET BEN:BJ TGO:TG NER:NE TCD:TD GAB:GA COG:CG COD:CD BDI:BI SLE:SL LBR:LR GIN:GN '
 + 'GMB:GM CPV:CV SYC:SC LSO:LS SWZ:SZ BLZ:BZ BHS:BS ATG:AG DMA:DM GRD:GD KNA:KN LCA:LC VCT:VC SMR:SM AND:AD LIE:LI MCO:MC BTN:BT '
 + 'MDV:MV TLS:TL SLB:SB VUT:VU WSM:WS TON:TO KIR:KI').split(' ').map(x => x.split(':')));
let regionNames = null;
function countryName(code){
  const c2 = ISO2[code];
  if (!c2) return code;
  try { return regionNames.of(c2) || code; } catch (e) { return code; }
}
const flag = code => ISO2[code] ? `<img class="flag" src="https://flagcdn.com/w40/${ISO2[code].toLowerCase()}.png" alt="" loading="lazy" width="20" height="14">` : '';
const nameOf = countryName;

/* ================= bank & depository names ================= */
const BANK_RULES = [[/J\.?\s?P\.?\s?MORGAN|JPMORGAN/,'JPMorgan'],[/HSBC/,'HSBC'],[/GOLDMAN/,'Goldman Sachs'],[/BOFA|BANC OF AMERICA|BANK OF AMERICA|MERRILL/,'Bank of America'],
 [/CITIGROUP|CITIBANK|\bCITI\b/,'Citigroup'],[/MORGAN STANLEY/,'Morgan Stanley'],[/WELLS FARGO/,'Wells Fargo'],[/BARCLAYS/,'Barclays'],[/\bRBC\b|ROYAL BANK OF CANADA/,'RBC'],
 [/SCOTIA/,'Scotiabank'],[/\bUBS\b/,'UBS'],[/BNP/,'BNP Paribas'],[/SOCIETE GENERALE|SG AMERICAS/,'Société Générale'],[/DEUTSCHE BANK/,'Deutsche Bank'],
 [/MIZUHO/,'Mizuho'],[/NOMURA/,'Nomura'],[/MACQUARIE/,'Macquarie'],[/STONEX|FCSTONE/,'StoneX'],[/MAREX/,'Marex'],[/ABN AMRO/,'ABN AMRO'],
 [/\bADM\b/,'ADM'],[/STANDARD CHARTERED/,'Standard Chartered'],[/\bICBC\b/,'ICBC'],[/BANK OF CHINA|BOCI/,'Bank of China'],[/TORONTO.?DOMINION|\bTD SEC/,'TD'],
 [/\bBMO\b|BANK OF MONTREAL/,'BMO'],[/BRINK/,"Brink's"],[/LOOMIS/,'Loomis'],[/MALCA/,'Malca-Amit'],[/MANFRA/,'Manfra, Tordella & Brookes'],
 [/ASAHI/,'Asahi'],[/INTERNATIONAL DEPOSITORY|\bIDS\b/,'IDS of Delaware'],[/DELAWARE DEPOSITORY/,'Delaware Depository'],[/DORMAN/,'Dorman'],[/ADVANTAGE FUTURES/,'Advantage Futures']];
const GLOBAL_BANKS = new Set(['JPMorgan','HSBC','Goldman Sachs','Bank of America','Citigroup','Morgan Stanley','Wells Fargo','Barclays','RBC','Scotiabank','UBS','BNP Paribas','Société Générale','Deutsche Bank','Mizuho','Nomura','Macquarie','Standard Chartered','ICBC','Bank of China','TD','BMO','ABN AMRO']);
const titleCase = raw => String(raw).toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
  .replace(/\b(Llc|Lp|Llp|Plc|Ag|Sa|Nv|Ltd|Lllp|Na|Usa|Us|Uk)\b/g, w => w.toUpperCase()).replace(/\s+\/[a-z]{2,3}\/?$/i, '').replace(/[,.\s]+$/, '');
function bankName(raw){
  const u = String(raw).toUpperCase();
  for (const [re, n] of BANK_RULES) if (re.test(u)) return n;
  return titleCase(raw);
}

/* ================= gold price & release dates ================= */
let PRICES = null, STATUS = null;
function priceAt(d, monthly){
  const a = PRICES && PRICES.daily; if (!a || !a.length) return null;
  let key = d;
  if (monthly){ const t = toDate(d); key = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).toISOString().slice(0, 10); }
  let lo = 0, hi = a.length - 1, ans = null;
  while (lo <= hi){ const m = (lo + hi) >> 1; if (a[m][0] <= key){ ans = a[m][1]; lo = m + 1; } else hi = m - 1; }
  return ans;
}
/* US Eastern time -> UTC (DST: 2nd Sunday of March to 1st Sunday of November) */
function nthSunday(y, m, n){ const d = new Date(Date.UTC(y, m, 1)); const first = (7 - d.getUTCDay()) % 7 + 1; return first + (n - 1) * 7; }
function etToUtc(dateStr, h, mi){
  const t = toDate(dateStr), y = t.getUTCFullYear();
  const start = Date.UTC(y, 2, nthSunday(y, 2, 2), 7), end = Date.UTC(y, 10, nthSunday(y, 10, 1), 6);
  const off = (t.getTime() >= start && t.getTime() < end) ? 4 : 5;
  return new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate(), h + off, mi));
}
const addDays = (d, n) => new Date(toDate(d).getTime() + n * 864e5).toISOString().slice(0, 10);
/* release of a COT report: data as of Tuesday, published Friday 15:30 New York time (or later after a holiday) */
function cotRelease(src, d){
  const seen = ((DATA.releases || {})[src] || {})[d], sched = etToUtc(addDays(d, 3), 15, 30);
  if (seen){ const s = new Date(seen); if (s - sched < 4 * 864e5) return {when: s, observed: true, sched}; }
  return {when: sched, observed: false, sched};
}
function seenAt(src, d){ const s = ((DATA.releases || {})[src] || {})[d]; return s ? new Date(s) : null; }
function untilText(t){
  const ms = t - Date.now(); if (ms <= 0) return L('متوقع الآن؛ يُفحص كل ساعة حتى يظهر', 'Due now; checked every hour until it appears', 'Previsto ora; controllato ogni ora finché non compare', 'Previsto ahora; se revisa cada hora hasta que aparezca');
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  return d ? L(`بعد ${d} يوم و${h % 24} ساعة`, `in ${d}d ${h % 24}h`, `tra ${d} g e ${h % 24} h`, `dentro de ${d} d y ${h % 24} h`) : L(`بعد ${h} ساعة`, `in ${h}h`, `tra ${h} h`, `dentro de ${h} h`);
}

/* ================= math helpers ================= */
const PERIODS = {m:{days:30, ar:'شهر', en:'Month', it:'Mese', es:'Mes'}, q:{days:91, ar:'ربع سنة', en:'Quarter', it:'Trimestre', es:'Trimestre'},
  y:{days:365, ar:'سنة', en:'Year', it:'Anno', es:'Año'}};
const pLabel = k => L(PERIODS[k].ar, PERIODS[k].en, PERIODS[k].it, PERIODS[k].es);
function last(s){ return s && s.length ? s[s.length - 1] : null; }
function change(s, days){
  if (!s || s.length < 2) return null;
  const end = last(s), target = toDate(end[0]).getTime() - days * 864e5;
  let best = null, gap = Infinity;
  for (let i = 0; i < s.length - 1; i++){
    const g = Math.abs(toDate(s[i][0]).getTime() - target);
    if (g < gap){ gap = g; best = s[i]; }
  }
  if (!best || gap > days * 864e5 * 0.5) return null;
  const d = end[1] - best[1];
  return {from: best, to: end, d, pct: best[1] ? d / Math.abs(best[1]) * 100 : null};
}

function sourceWarn(src){
  const s = STATUS && STATUS.sources && STATUS.sources[src];
  if (!s || s.ok) return '';

  return `<p class="warn">${L('تعذّر جلب هذا المصدر في آخر تشغيل', 'This source could not be fetched on the last run', 'Non è stato possibile scaricare questa fonte nell’ultima esecuzione', 'No se pudo obtener esta fuente en la última ejecución')}: <bdi dir="ltr">${esc((s.error || '').slice(0, 140))}</bdi>. ${L('المعروض هو آخر بيانات ناجحة', 'Showing the last successful data', 'Sono mostrati gli ultimi dati validi', 'Se muestran los últimos datos válidos')}${when}.</p>`;

/* freshness: how old is the latest data point vs. what the source normally allows */
function fresh(lastDate, maxDays){
  if (!lastDate) return '';
  const age = Math.floor((Date.now() - toDate(lastDate).getTime()) / 864e5);
  const ok = age <= maxDays;
  return `<span class="fresh ${ok ? 'ok' : 'stale'}" title="${L('عمر آخر قراءة', 'Age of latest data', 'Età dell’ultimo dato', 'Antigüedad del último dato')}: ${age} ${L('يومًا', 'days', 'giorni', 'días')}">${ok
    ? L('محدَّث تلقائيًا ✓', 'Auto-updated ✓', 'Aggiornato automaticamente ✓', 'Actualizado automáticamente ✓')
    : L(`أقدم من المتوقع (${age} يومًا)`, `Older than expected (${age} days)`, `Più vecchio del previsto (${age} giorni)`, `Más antiguo de lo previsto (${age} días)`)}</span>`;
}

function flowModel(series, gross){
  const s = (series || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < s.length; i++){
    const [d, v] = s[i], prev = s[i - 1][1], delta = v - prev, g = gross && gross[d];
    pts.push({d, line:v, delta, pct: prev ? delta / Math.abs(prev) * 100 : null, d3: i >= 3 ? v - s[i - 3][1] : null,
      buy: g ? g.buy : Math.max(delta, 0), sell: g ? g.sell : Math.max(-delta, 0), g});
  }
  return pts.slice(-WINDOW);
}

function lsModel(recs){
  const r = (recs || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < r.length; i++){
    const [d, l, s, sp] = r[i], [, pl, ps, psp] = r[i - 1];
    const net = l - s, pnet = pl - ps, delta = net - pnet;
    pts.push({d, buy:l, sell:s, line:net, delta, pct: pnet ? delta / Math.abs(pnet) * 100 : null,
      d3: i >= 3 ? net - (r[i - 3][1] - r[i - 3][2]) : null, dl: l - pl, ds: s - ps, sp: sp || 0, dsp: (sp || 0) - (psp || 0), rec: r[i]});
  }
  return pts.slice(-WINDOW);
}

/* spread model (USD/oz): bars above zero = premium, below = discount */
function spreadModel(rows){
  const r = (rows || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < r.length; i++){
    const [d, v, a, b] = r[i], prev = r[i - 1][1];
    pts.push({d, line:v, a, b, delta: v - prev, pct: b ? v / b * 100 : null, d3: i >= 3 ? v - r[i - 3][1] : null,
      buy: Math.max(v, 0), sell: Math.max(-v, 0)});
  }
  return pts.slice(-WINDOW);
}

function rvSel(id, pts){

function reportView(id, title, pts, cfg){
  if (!pts.length) return `<div class="rv"><h3 class="rv-title">${title}</h3><p class="empty">${cfg.empty || L('لا تكفي التقارير لرسم المخطط بعد؛ يكتمل مع التحديثات القادمة.', 'Not enough reports to draw the chart yet; it fills in with upcoming updates.', 'I report non sono ancora sufficienti per tracciare il grafico, che si completerà con i prossimi aggiornamenti.', 'Aún no hay informes suficientes para trazar el gráfico; se completará con las próximas actualizaciones.')}</p></div>`;
  RVM[id] = {pts, cfg};
  const si = rvSel(id, pts), p = pts[si], n = pts.length;
  const W = 640, H = 230, T = 10, B = 10, ph = H - T - B, cw = W / n;
  const mu = Math.max(1e-9, ...pts.map(q => q.buy)), md = Math.max(1e-9, ...pts.map(q => q.sell));
  const sc = ph / (mu + md), zy = T + mu * sc;
  let svg = `<svg class="rvc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  svg += `<rect class="selcol" x="${(si * cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}"/>`;
  pts.forEach((q, i) => {
    const x = (i * cw + cw * .2).toFixed(1), w = (cw * .6).toFixed(1);
    if (q.buy > 0) svg += `<rect class="b-up" x="${x}" y="${(zy - q.buy * sc).toFixed(1)}" width="${w}" height="${Math.max(1, q.buy * sc).toFixed(1)}"/>`;
    if (q.sell > 0) svg += `<rect class="b-down" x="${x}" y="${zy.toFixed(1)}" width="${w}" height="${Math.max(1, q.sell * sc).toFixed(1)}"/>`;
  });
  svg += `<line class="zero" x1="0" x2="${W}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" vector-effect="non-scaling-stroke"/>`;
  if (cfg.line){
    const lv = pts.map(q => q.line); let lo = Math.min(...lv), hi = Math.max(...lv);
    if (lo === hi){ lo -= 1; hi += 1; }
    const Y = v => T + 8 + (hi - v) / (hi - lo) * (ph - 16);
    svg += `<polyline class="l-net" points="${pts.map((q, i) => `${((i + .5) * cw).toFixed(1)},${Y(q.line).toFixed(1)}`).join(' ')}" vector-effect="non-scaling-stroke"/>`;
  }
  const pp = cfg.price === false ? [] : pts.map(q => priceAt(q.d, cfg.monthly));
  pts.forEach((q, i) => { q.gp = pp[i]; });
  const pv = pp.filter(v => v != null);
  if (pv.length >= 2){
    let lo = Math.min(...pv), hi = Math.max(...pv); if (lo === hi){ lo -= 1; hi += 1; }
    const Y = v => T + 8 + (hi - v) / (hi - lo) * (ph - 16);
    svg += `<polyline class="l-price" points="${pts.map((q, i) => q.gp == null ? '' : `${((i + .5) * cw).toFixed(1)},${Y(q.gp).toFixed(1)}`).filter(Boolean).join(' ')}" vector-effect="non-scaling-stroke"/>`;
  }
  pts.forEach((q, i) => { svg += `<rect class="hit" data-rv="${esc(id)}" data-i="${i}" x="${(i * cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}"/>`; });
  svg += '</svg>';
  const monthly = cfg.monthly, step = n > 12 ? 4 : n > 6 ? 2 : 1;
  const ticks = pts.map((q, i) => `<span>${(i % step === (n - 1) % step) ? (monthly ? fShortM.format(toDate(q.d)) : dm(q.d)) : ''}</span>`).join('');
  const legend = `<div class="legend"><span><i style="background:var(--buy)"></i>${cfg.buy}</span><span><i style="background:var(--sell)"></i>${cfg.sell}</span>${cfg.line ? `<span><i style="background:var(--ink)"></i>${cfg.line}</span>` : ''}${pv.length >= 2 ? `<span><i class="lg-price"></i>${L('سعر الذهب (GC)', 'Gold price (GC)', 'Prezzo dell’oro (GC)', 'Precio del oro (GC)')}</span>` : ''}</div>`;
  const cells = cfg.cells(p, si, pts).map(c => `<div class="cell"><h4>${c.label}</h4><div class="cv">${c.v}</div><div class="cs">${c.sub || ''}</div></div>`).join('');
  const list = pts.map((q, i) => ({q, i})).reverse().map(({q, i}) =>
    `<button class="rep" data-act="sel" data-rv="${esc(id)}" data-i="${i}" aria-pressed="${i === si}"><span>${cfg.rel ? fList.format(cfg.rel(q.d).when) : (monthly ? fMonth.format(toDate(q.d)) : fList.format(toDate(q.d)))}</span><span class="${cls(q.delta)}">${cfg.sfmt(q.delta)}</span></button>`).join('');
  return `<div class="rv" id="rv-${esc(id)}">
    <h3 class="rv-title">${title}</h3>${legend}
    <div class="rv-plot">${svg}<div class="ticks">${ticks}</div><div class="tt" dir="${isAr() ? 'rtl' : 'ltr'}" hidden></div></div>
    <div class="rv-bottom">
      <div><div class="rv-sel">${relLine(cfg, p.d, monthly)}</div><div class="cells">${cells}</div></div>
      <div class="rv-list" aria-label="${L('آخر التقارير', 'Latest reports', 'Ultimi report', 'Últimos informes')}">${list}</div>
    </div></div>`;
}

R.countries = () => {
  const id = 'countries', p = state.period[id];
  const entries = Object.entries(DATA.countries || {});
  const latest = entries.reduce((a, [, s]) => last(s)[0] > a ? last(s)[0] : a, '');
  let h = head(L('مشتريات الدول من الذهب', 'Gold purchases by country', 'Acquisti di oro per Paese', 'Compras de oro por país'), '',
    [L('شهري', 'Monthly', 'Mensile', 'Mensual'), L('تأخير نحو 50 يومًا', 'About 50 days delay', 'Circa 50 giorni di ritardo', 'Unos 50 días de retraso'), `${entries.length} ${L('دولة', 'countries', 'Paesi', 'países')}`, seenChip('imf', latest), `${L('التحديث القادم', 'Next update', 'Prossimo aggiornamento', 'Próxima actualización')}: ${L('مستمر خلال الشهر، ويُفحص مرتين يوميًا', 'rolling through the month, checked twice a day', 'continuo durante il mese, con controllo due volte al giorno', 'continuo a lo largo del mes, con revisión dos veces al día')}`], 'imf', fresh(latest, 80));
  h += about(id, ABOUT.countries());
  if (!entries.length) return h + noData();

  const codes = entries.map(([c]) => c).sort((a, b) => nameOf(a).localeCompare(nameOf(b), state.lang));
  if (!state.country || !DATA.countries[state.country]) state.country = DATA.countries.CHN ? 'CHN' : codes[0];
  const cs = DATA.countries[state.country], cb = (DATA.central_banks || {}).series || [];
  h += `<div class="picker"><label for="country-pick">${flag(state.country)}${L('الدولة', 'Country', 'Paese', 'País')}</label><select id="country-pick" data-act="country">${codes.map(c =>
    `<option value="${c}" ${c === state.country ? 'selected' : ''}>${esc(nameOf(c))}</option>`).join('')}</select></div>`;
  h += reportView('c-' + state.country, `${cName(state.country)}: ${L('آخر 20 شهرًا', 'last 20 months', 'ultimi 20 mesi', 'últimos 20 meses')}`, flowModel(cs), kgCfg({
    monthly:true, buy: L('شراء', 'Bought', 'Acquistato', 'Comprado'), sell: L('بيع', 'Sold', 'Venduto', 'Vendido'), line: L('الحيازة', 'Holdings', 'Riserve', 'Tenencias'),
    cells: q => {
      const tot = cb.length ? (cb.filter(x => x[0] <= q.d).slice(-1)[0] || [0, 0])[1] : 0;
      return [
        {label: L('الحيازة', 'Holdings', 'Riserve', 'Tenencias'), v: TN(q.line), sub: KG(q.line)},
        {label: L('التغير عن الشهر السابق', 'Change vs previous month', 'Variazione rispetto al mese precedente', 'Variación frente al mes anterior'), v: `<span class="${cls(q.delta)}">${sTN(q.delta)}</span>`, sub: `${sKG(q.delta)} ${sPCT(q.pct)}`},
        {label: L('الحصة من إجمالي الدول المُبلِّغة', 'Share of all reporting countries', 'Quota sul totale dei Paesi segnalanti', 'Proporción sobre el total de países declarantes'), v: tot ? bd(nf2.format(q.line / tot * 100) + '%') : '—', sub: tot ? `${L('من', 'of', 'su', 'de')} ${TN(tot)}` : ''},
      ];
    }}));

  h += controls(id, true);
  if (state.mode[id] === 'stock'){
    const rows = entries.map(([code, s]) => ({code, l: last(s), c: change(s, PERIODS[p].days)})).sort((a, b) => b.l[1] - a.l[1]);
    const total = rows.reduce((a, r) => a + r.l[1], 0), shown = state.all ? rows : rows.slice(0, 25);
    h += `<div class="tablebox"><table><thead><tr><th class="rank">#</th><th>${L('الدولة', 'Country', 'Paese', 'País')}</th><th class="n">${L('الحيازة', 'Holdings', 'Riserve', 'Tenencias')}</th><th class="n">${L('بالكيلوغرام', 'In kilograms', 'In chilogrammi', 'En kilogramos')}</th>
      <th class="n">${L('الحصة', 'Share', 'Quota', 'Proporción')}</th><th class="n">${L('التغير خلال', 'Change over', 'Variazione su', 'Variación en')} ${pLabel(p)}</th><th>${L('آخر قراءة', 'Latest report', 'Ultimo report', 'Último informe')}</th></tr></thead><tbody>
      ${shown.map((r, i) => `<tr><td class="rank">${i + 1}</td><td><button class="linkish" data-act="country-go" data-v="${r.code}">${cName(r.code)}</button></td>
        <td class="n">${TN(r.l[1])}</td><td class="n">${KG(r.l[1])}</td><td class="n">${bd(nf1.format(r.l[1] / total * 100) + '%')}</td>
        <td class="n ${r.c ? cls(r.c.d) : 'na'}">${r.c ? `${sTN(r.c.d)} ${sPCT(r.c.pct)}` : L('غير متاح', 'n/a', 'n.d.', 'n. d.')}</td><td>${fMonth.format(toDate(r.l[0]))}</td></tr>`).join('')}</tbody></table></div>`;
    if (rows.length > 25) h += `<button class="more" data-act="all">${state.all ? L('عرض أكبر 25 دولة فقط', 'Show the top 25 only', 'Mostra solo i primi 25', 'Mostrar solo los 25 primeros') : L(`عرض كل الدول (${rows.length})`, `Show all countries (${rows.length})`, `Mostra tutti i Paesi (${rows.length})`, `Mostrar todos los países (${rows.length})`)}</button>`;
    h += `<p class="explain">${L('اضغط اسم أي دولة لعرض مخططها.', 'Click any country to see its chart.', 'Fai clic su un Paese per vederne il grafico.', 'Haz clic en cualquier país para ver su gráfico.')}</p>`;
    return h;
  }
  const rows = countryChanges(p);
  const buyers = rows.filter(r => r.c.d > 0).sort((a, b) => b.c.d - a.c.d), sellers = rows.filter(r => r.c.d < 0).sort((a, b) => a.c.d - b.c.d);
  const bought = buyers.reduce((a, r) => a + r.c.d, 0), sold = sellers.reduce((a, r) => a + r.c.d, 0), net = bought + sold;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.c.d)));
  const nm = r => `<button class="linkish" data-act="country-go" data-v="${r.code}">${cName(r.code)}</button>`;
  h += `<div class="figs">
    <div class="fig"><h3>${L(`اشترت ${buyers.length} دولة`, `${buyers.length} countries bought`, `${buyers.length} Paesi hanno acquistato`, `${buyers.length} países compraron`)}</h3><div class="v ${bought ? 'up' : 'flat'}">${sTN(bought)}</div><div class="sub">${sKG(bought)}</div></div>
    <div class="fig"><h3>${L(`باعت ${sellers.length} دولة`, `${sellers.length} countries sold`, `${sellers.length} Paesi hanno venduto`, `${sellers.length} países vendieron`)}</h3><div class="v ${sold ? 'down' : 'flat'}">${sTN(sold)}</div><div class="sub">${sKG(sold)}</div></div>
    <div class="fig"><h3>${L('الصافي خلال', 'Net over', 'Saldo netto su', 'Saldo neto en')} ${pLabel(p)}</h3><div class="v ${net >= 0 ? 'up' : 'down'}">${sTN(net)}</div><div class="sub">${sKG(net)}</div></div></div>
    <p class="explain">${L('تُقارَن آخر قراءة لكل دولة بقراءتها قبل المدة المختارة تقريبًا، لأن الدول لا ترفع بياناتها في الشهر نفسه.', 'Each country’s latest report is compared with its report roughly one period earlier, since countries do not all report in the same month.', 'L’ultimo report di ogni Paese viene confrontato con quello di circa un periodo prima, perché non tutti i Paesi inviano i dati nello stesso mese.', 'El último informe de cada país se compara con el de aproximadamente un periodo antes, ya que no todos los países reportan en el mismo mes.')}</p>
    <div class="cols">${rankedList(L('المشترون', 'Buyers', 'Acquirenti', 'Compradores'), buyers, 'up', maxAbs, true, nm)}${rankedList(L('البائعون', 'Sellers', 'Venditori', 'Vendedores'), sellers, 'down', maxAbs, true, nm)}</div>`;
  return h;
};

    extra: q => q.g ? `<div><span>${L('عدد المشترين / البائعين', 'Buyers / sellers', 'Acquirenti / venditori', 'Compradores / vendedores')}</span><b>${bd(q.g.nb + ' / ' + q.g.ns)}</b></div>` : '',
    cells: q => [
      {label: L('الحيازة الإجمالية', 'Total holdings', 'Consistenza totale', 'Tenencias totales'), v: TN(q.line), sub: `${sKG(q.delta)} ${sPCT(q.pct)}`},
      {label: L('إجمالي المشتريات', 'Gross buying', 'Acquisti lordi', 'Compras brutas') + (q.g ? ` (${q.g.nb} ${L('دولة', 'countries', 'Paesi', 'países')})` : ''), v: `<span class="up">${TN(q.buy)}</span>`, sub: KG(q.buy)},
      {label: L('إجمالي المبيعات', 'Gross selling', 'Vendite lorde', 'Ventas brutas') + (q.g ? ` (${q.g.ns} ${L('دولة', 'countries', 'Paesi', 'países')})` : ''), v: `<span class="down">${TN(q.sell)}</span>`, sub: KG(q.sell)},
    ]}));

  h += `<div class="figs">${figure(L('الحيازة الإجمالية المُبلَّغة', 'Total reported holdings', 'Riserve dichiarate totali', 'Tenencias declaradas totales'), s, p, [L('صافي شراء', 'Net buying', 'Acquisti netti', 'Compras netas'), L('صافي بيع', 'Net selling', 'Vendite nette', 'Ventas netas')],
    `<div class="note">${L(`تشمل ${cb.in_total || '?'} دولة متوفرة البيانات منذ بداية السجل.`, `Includes ${cb.in_total || '?'} countries with data since the start of the record.`, `Comprende ${cb.in_total || '?'} Paesi con dati dall’inizio della serie.`, `Incluye ${cb.in_total || '?'} países con datos desde el inicio de la serie.`)}</div>`)}</div>`;

  const maxAbs = Math.max(1, ...buyers.concat(sellers).map(r => Math.abs(r.c.d)));

  return h;
};

/* ---------- commercial banks ---------- */
function deliveriesByBank(){
  const daily = (DATA.deliveries || {}).daily || {}, days = Object.keys(daily).sort(), banks = {};
  days.forEach(d => Object.entries(daily[d] || {}).forEach(([raw, acc]) => {
    const b = bankName(raw), rec = ((banks[b] = banks[b] || {})[d] = banks[b][d] || {iss:0, stp:0, H:[0, 0], C:[0, 0]});
    Object.entries(acc).forEach(([org, [i, s]]) => { rec.iss += i; rec.stp += s; if (rec[org]){ rec[org][0] += i; rec[org][1] += s; } });
  }));
  return {days, banks};
}

    'COT does not name banks. Deliveries include customer accounts as well as the bank’s own (house) account. A vault holds the bank’s and its clients’ metal together.', 'Il COT non indica i nomi delle banche. Le consegne comprendono sia i conti dei clienti sia il conto proprio (house) della banca. Un caveau custodisce insieme il metallo della banca e quello dei suoi clienti.', 'El COT no nombra a los bancos. Las entregas incluyen tanto las cuentas de clientes como la cuenta propia (house) del banco. Una bóveda guarda juntos el metal del banco y el de sus clientes.')],

R.banks = () => {
  let h = head(L('البنوك التجارية', 'Commercial banks', 'Banche commerciali', 'Bancos comerciales'), '', [], null, '');
  h += about('banks', ABOUT.banks());
  h += chips('bankview', [['cot', 'COT: Swap Dealers'], ['deliv', L('التسليمات حسب البنك', 'Deliveries by bank', 'Consegne per banca', 'Entregas por banco')], ['vault', L('خزائن البنوك', 'Bank vaults', 'Caveau delle banche', 'Bóvedas de los bancos')]], state.bankView);

  if (state.bankView === 'cot'){
    const dis = DATA.cot_disagg || {}, recs = state.cotCat === 'prod' ? dis.prod : dis.swap;
    h += sourceWarn('cot');
    if (!recs || !recs.length) return h + noData();
    h += `<div class="meta">${cotChips('cot', recs).map(c => `<span class="chip">${c}</span>`).join('')}${fresh(last(recs)[0], 11)}</div>`;
    h += chips('cotcat', [['swap', L('Swap Dealers (البنوك الكبرى)', 'Swap Dealers (major banks)', 'Swap Dealers (grandi banche)', 'Swap Dealers (grandes bancos)')], ['prod', 'Producer/Merchant']], state.cotCat);
    h += reportView('cot-' + state.cotCat, L(`آخر ${WINDOW} تقريرًا أسبوعيًا`, `Last ${WINDOW} weekly reports`, `Ultimi ${WINDOW} report settimanali`, `Últimos ${WINDOW} informes semanales`), lsModel(recs), ctCfg({rel: d => cotRelease('cot', d),
      buy: L('Long (شراء)', 'Long (buy)', 'Long (acquisto)', 'Long (compra)'), sell: L('Short (بيع)', 'Short (sell)', 'Short (vendita)', 'Short (venta)'), line: L('صافي المركز', 'Net position', 'Posizione netta', 'Posición neta'),
      pctLabel: L('نسبة تغير الصافي', 'Net change %', 'Variazione % del netto', 'Variación % del neto'), deltaLabel: L('دلتا الصافي', 'Net delta', 'Delta del netto', 'Delta del neto'), extra: lsExtra, cells: lsCells(state.cotCat === 'prod')}));
    return h;
  }

  if (state.bankView === 'deliv'){
    h += sourceWarn('deliveries');
    const {days, banks} = deliveriesByBank();
    if (!days.length) return h + `<p class="empty">${L('يُبنى سجل التسليمات يوميًا من أول تشغيل؛ لا توجد أيام مسجلة بعد.', 'The delivery history builds daily from the first run; no days recorded yet.', 'Lo storico delle consegne si costruisce ogni giorno a partire dalla prima esecuzione; non ci sono ancora giorni registrati.', 'El historial de entregas se construye a diario desde la primera ejecución; todavía no hay días registrados.')}</p>`;
    h += `<div class="meta"><span class="chip">${dailyNext()}</span>${seenChip('deliveries', last(days)) ? `<span class="chip">${seenChip('deliveries', last(days))}</span>` : ''}${fresh(last(days), 6)}</div>`;
    const totals = Object.entries(banks).map(([b, byDay]) => {
      const t = Object.values(byDay).reduce((a, r) => ({iss: a.iss + r.iss, stp: a.stp + r.stp}), {iss:0, stp:0});
      return {b, ...t, vol: t.iss + t.stp};
    }).sort((a, b) => b.vol - a.vol);
    if (!state.bank || !banks[state.bank]) state.bank = totals[0] ? totals[0].b : null;
    h += `<div class="chips">${totals.slice(0, 14).map(t => `<button class="chip-btn" data-act="bank" data-v="${esc(t.b)}" aria-pressed="${t.b === state.bank}"><bdi>${esc(t.b)}</bdi>${star(t.b)}</button>`).join('')}</div>`;
    const byDay = banks[state.bank] || {}, dayTot = {};
    days.forEach(d => { dayTot[d] = Object.values(banks).reduce((a, x) => a + (x[d] ? x[d].iss + x[d].stp : 0), 0); });
    const ser = days.map(d => { const r = byDay[d] || {iss:0, stp:0, H:[0, 0], C:[0, 0]}; return {d, stp: r.stp * CONTRACT_KG, iss: r.iss * CONTRACT_KG, H: r.H, C: r.C}; }).slice(-(WINDOW + 3));
    const pts = ser.map((r, i) => ({d: r.d, buy: r.stp, sell: r.iss, delta: r.stp - r.iss, H: r.H, C: r.C,
      d3: i >= 2 ? ser.slice(i - 2, i + 1).reduce((a, x) => a + x.stp - x.iss, 0) : null,
      pct: dayTot[r.d] ? (r.stp + r.iss) / CONTRACT_KG / dayTot[r.d] * 100 : null})).slice(-WINDOW);
    h += reportView('dl-' + state.bank, `<bdi>${esc(state.bank)}</bdi>: ${L(`آخر ${pts.length} يوم تسليم مسجَّل`, `last ${pts.length} recorded delivery days`, `ultimi ${pts.length} giorni di consegna registrati`, `últimos ${pts.length} días de entrega registrados`)}`, pts, kgCfg({
      buy: L('استلام Stopped (شراء فعلي)', 'Stopped (taking delivery)', 'Stopped (ritira la consegna)', 'Stopped (recibe la entrega)'), sell: L('تسليم Issued (بيع فعلي)', 'Issued (making delivery)', 'Issued (effettua la consegna)', 'Issued (realiza la entrega)'),
      pctLabel: L('حصته من حجم اليوم', 'Share of the day’s volume', 'Quota del volume del giorno', 'Proporción del volumen del día'), deltaLabel: L('الصافي (استلام − تسليم)', 'Net (stopped − issued)', 'Netto (stopped − issued)', 'Neto (stopped − issued)'),
      extra: q => q.H && (q.H[0] + q.H[1] + q.C[0] + q.C[1]) ? `<div><span>House / Customer</span><b>${bd(nf0.format(q.H[1] - q.H[0]) + ' / ' + nf0.format(q.C[1] - q.C[0]))} ${U.ct()}</b></div>` : '',
      cells: q => [
        {label: L('استلم (Stopped)', 'Stopped', 'Stopped', 'Stopped'), v: `<span class="up">${KG(q.buy)}</span>`, sub: CT(q.buy / CONTRACT_KG)},
        {label: L('سلّم (Issued)', 'Issued', 'Issued', 'Issued'), v: `<span class="down">${KG(q.sell)}</span>`, sub: CT(q.sell / CONTRACT_KG)},
        {label: L('الصافي', 'Net', 'Netto', 'Neto'), v: `<span class="${cls(q.delta)}">${sKG(q.delta)}</span>`, sub: sCT(q.delta / CONTRACT_KG)},
      ]}));
    const mtd = (DATA.deliveries || {}).mtd || {};
    let rows;
    if (mtd.firms){
      const agg = {};
      Object.entries(mtd.firms).forEach(([raw, acc]) => {
        const b = bankName(raw), e = (agg[b] = agg[b] || {iss:0, stp:0, H:0, C:0});
        Object.entries(acc).forEach(([org, [i, s]]) => { e.iss += i; e.stp += s; e[org] = (e[org] || 0) + s - i; });
      });
      rows = Object.entries(agg).map(([b, e]) => ({b, ...e}));
    } else rows = totals.map(t => ({b: t.b, iss: t.iss, stp: t.stp}));
    rows.sort((a, b) => (b.stp - b.iss) - (a.stp - a.iss));
    h += `<h3 class="rv-title">${mtd.firms ? L(`ترتيب البنوك منذ بداية الشهر (حتى ${fDay.format(toDate(mtd.date))})`, `Banks ranked month to date (to ${fDay.format(toDate(mtd.date))})`, `Classifica delle banche da inizio mese (fino al ${fDay.format(toDate(mtd.date))})`, `Clasificación de bancos en lo que va de mes (hasta el ${fDay.format(toDate(mtd.date))})`) : L('ترتيب البنوك في الأيام المسجلة', 'Banks ranked over the recorded days', 'Classifica delle banche nei giorni registrati', 'Clasificación de bancos en los días registrados')}</h3>
      <div class="tablebox"><table><thead><tr><th>${L('البنك', 'Bank', 'Banca', 'Banco')}</th><th class="n">${L('استلم (شراء)', 'Stopped (bought)', 'Stopped (acquistato)', 'Stopped (comprado)')}</th><th class="n">${L('سلّم (بيع)', 'Issued (sold)', 'Issued (venduto)', 'Issued (vendido)')}</th><th class="n">${L('الصافي', 'Net', 'Netto', 'Neto')}</th><th class="n">House</th><th class="n">Customer</th></tr></thead><tbody>
      ${rows.map(r => { const net = r.stp - r.iss; return `<tr><td><button class="linkish" data-act="bank" data-v="${esc(r.b)}"><bdi>${esc(r.b)}</bdi>${star(r.b)}</button></td>
        <td class="n up">${KG(r.stp * CONTRACT_KG)}</td><td class="n down">${KG(r.iss * CONTRACT_KG)}</td><td class="n ${cls(net)}">${sKG(net * CONTRACT_KG)}</td>
        <td class="n">${r.H == null ? '—' : sCT(r.H)}</td><td class="n">${r.C == null ? '—' : sCT(r.C)}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="explain">${L('Stopped = استلام ذهب فعلي مقابل العقود (شراء)، وIssued = تسليمه (بيع). House حساب البنك نفسه، وCustomer حسابات عملائه. ★ بنك عالمي.', 'Stopped = taking physical gold against contracts (buying); Issued = delivering it (selling). House is the bank’s own account; Customer is its clients’ accounts. ★ global bank.', 'Stopped = ritiro di oro fisico a fronte dei contratti (acquisto); Issued = sua consegna (vendita). House è il conto proprio della banca; Customer sono i conti dei suoi clienti. ★ banca globale.', 'Stopped = recibir oro físico contra contratos (compra); Issued = entregarlo (venta). House es la cuenta propia del banco; Customer, las cuentas de sus clientes. ★ banco global.')}</p>`;
    return h;
  }

  h += sourceWarn('comex');
  const deps = ((DATA.comex || {}).depositories) || {};
  const list = Object.entries(deps).map(([raw, s]) => ({raw, name: bankName(raw), s, l: last(s)})).filter(x => x.l)
    .sort((a, b) => (GLOBAL_BANKS.has(b.name) - GLOBAL_BANKS.has(a.name)) || (b.l[1] + b.l[2]) - (a.l[1] + a.l[2]));
  if (!list.length) return h + `<p class="empty">${L('تفصيل الخزائن يبدأ من أول تحديث بعد تفعيل هذه الميزة.', 'The vault breakdown starts with the first update after this feature was enabled.', 'Il dettaglio dei caveau parte dal primo aggiornamento successivo all’attivazione di questa funzione.', 'El desglose por bóveda empieza con la primera actualización tras activar esta función.')}</p>`;
  h += `<div class="meta">${fresh(list[0].l[0], 6)}</div>`;
  if (!state.vault || !deps[state.vault]) state.vault = list[0].raw;
  h += `<div class="chips">${list.map(x => `<button class="chip-btn" data-act="vault" data-v="${esc(x.raw)}" aria-pressed="${x.raw === state.vault}"><bdi>${esc(x.name)}</bdi>${star(x.name)}</button>`).join('')}</div>`;
  const vs = deps[state.vault], tot = vs.map(r => [r[0], r[1] + r[2]]), byD = Object.fromEntries(vs.map(r => [r[0], r]));
  h += reportView('v-' + state.vault, `<bdi>${esc(bankName(state.vault))}</bdi>: ${L(`آخر ${WINDOW} تقريرًا يوميًا`, `last ${WINDOW} daily reports`, `ultimi ${WINDOW} report giornalieri`, `últimos ${WINDOW} informes diarios`)}`, flowModel(tot), kgCfg({
    buy: L('دخول ذهب', 'Gold in', 'Oro in entrata', 'Entrada de oro'), sell: L('خروج ذهب', 'Gold out', 'Oro in uscita', 'Salida de oro'), line: L('إجمالي الخزنة', 'Vault total', 'Totale del caveau', 'Total de la bóveda'),
    empty: L('يكتمل المخطط بعد يومين على الأقل من التسجيل.', 'The chart needs at least two recorded days.', 'Il grafico richiede almeno due giorni registrati.', 'El gráfico necesita al menos dos días registrados.'),
    cells: q => { const r = byD[q.d] || [q.d, 0, 0]; return [
      {label: 'Registered', v: TN(r[1]), sub: KG(r[1])}, {label: 'Eligible', v: TN(r[2]), sub: KG(r[2])},
      {label: L('الإجمالي', 'Total', 'Totale', 'Total'), v: TN(q.line), sub: `${sKG(q.delta)} ${sPCT(q.pct)}`}]; }}));
  const all = list.reduce((a, x) => a + x.l[1] + x.l[2], 0);
  h += `<div class="tablebox"><table><thead><tr><th>${L('الخزنة', 'Vault', 'Caveau', 'Bóveda')}</th><th class="n">Registered</th><th class="n">Eligible</th><th class="n">${L('الإجمالي', 'Total', 'Totale', 'Total')}</th><th class="n">${L('الحصة', 'Share', 'Quota', 'Proporción')}</th></tr></thead><tbody>
    ${list.map(x => `<tr><td><button class="linkish" data-act="vault" data-v="${esc(x.raw)}"><bdi>${esc(x.name)}</bdi>${star(x.name)}</button></td><td class="n">${TN(x.l[1])}</td><td class="n">${TN(x.l[2])}</td><td class="n">${TN(x.l[1] + x.l[2])}</td><td class="n">${bd(nf1.format((x.l[1] + x.l[2]) / all * 100) + '%')}</td></tr>`).join('')}
    </tbody></table></div>`;
  return h;
};

    {id:'swap', recs: d.swap || [], type:'comm', name: L('Swap Dealers (البنوك الكبرى)', 'Swap Dealers (major banks)', 'Swap Dealers (grandi banche)', 'Swap Dealers (grandes bancos)')},
    {id:'prod', recs: d.prod || [], type:'comm', name: L('Producer/Merchant (المنتجون والتجار)', 'Producer/Merchant (producers and merchants)', 'Producer/Merchant (produttori e commercianti)', 'Producer/Merchant (productores y comerciantes)')},
  ].filter(c => c.recs.length > 10);

function cotIndexAt(recs, endIdx, weeks){
  const r = recs.slice(Math.max(0, endIdx - weeks + 1), endIdx + 1), nets = r.map(x => x[1] - x[2]);
  const lo = Math.min(...nets), hi = Math.max(...nets), cur = nets[nets.length - 1];
  return {idx: hi === lo ? 50 : (cur - lo) / (hi - lo) * 100, lo, hi, cur, n: r.length};
}
function sigText(type, v){
  if (v >= 90) return type === 'spec'
    ? [L('تموضع شرائي مزدحم', 'Crowded long', 'Long affollato', 'Long saturado'), 'sig-hot', L('المضاربون قرب أعلى صافي شراء لهم منذ 3 سنوات. تاريخيًا يرتفع خطر التصحيح في هذه الحالة، لأن المشترين الجدد قليلون وقد يكون الخروج جماعيًا عند أي خبر سلبي.', 'Speculators are near their largest net long in 3 years. Historically this raises pullback risk: few buyers are left and exits can be crowded on any negative news.', 'Gli speculatori sono vicini al loro massimo long netto degli ultimi 3 anni. Storicamente ciò aumenta il rischio di ritracciamento: restano pochi compratori e alla prima notizia negativa le uscite possono diventare affollate.', 'Los especuladores están cerca de su mayor posición long neta en 3 años. Históricamente esto eleva el riesgo de retroceso: quedan pocos compradores y, ante cualquier noticia negativa, las salidas pueden agolparse.')]
    : [L('إشارة إيجابية تاريخيًا', 'Historically bullish', 'Storicamente rialzista', 'Históricamente alcista'), 'sig-cold', L('هذه الفئة في أقل مستوى تحوط بيعي منذ 3 سنوات. لأنها تبيع عادةً في الارتفاعات وتشتري في الانخفاضات، يُقرأ هذا تاريخيًا إشارة إيجابية للسعر.', 'This group is at its lightest short hedge in 3 years. Because it usually sells into rallies and buys dips, this has historically been read as bullish for price.', 'Questo gruppo ha la copertura short più leggera degli ultimi 3 anni. Poiché di solito vende nei rialzi e compra nei ribassi, storicamente questa situazione è stata letta come rialzista per il prezzo.', 'Este grupo tiene su cobertura short más ligera en 3 años. Como suele vender en las subidas y comprar en las caídas, históricamente esto se ha interpretado como alcista para el precio.')];
  if (v <= 10) return type === 'spec'
    ? [L('تموضع بيعي متطرف', 'Extreme short', 'Short estremo', 'Short extremo'), 'sig-cold', L('المضاربون قرب أضعف صافي مركز لهم منذ 3 سنوات. تاريخيًا يزيد هذا احتمال ارتداد صاعد عند تغطية المراكز المكشوفة (Short covering).', 'Speculators are near their weakest net position in 3 years. Historically this raises the odds of a rebound as shorts cover.', 'Gli speculatori sono vicini alla loro posizione netta più debole degli ultimi 3 anni. Storicamente ciò aumenta le probabilità di un rimbalzo dovuto alla chiusura degli short.', 'Los especuladores están cerca de su posición neta más débil en 3 años. Históricamente esto aumenta las probabilidades de un rebote cuando se cierran los cortos.')]
    : [L('إشارة تحذيرية تاريخيًا', 'Historically bearish', 'Storicamente ribassista', 'Históricamente bajista'), 'sig-hot', L('هذه الفئة في أكبر تحوط بيعي منذ 3 سنوات، أي أنها تبيع الارتفاع بقوة. تاريخيًا يُقرأ هذا تحذيرًا للسعر.', 'This group is at its heaviest short hedge in 3 years, selling into strength. Historically this has been read as a warning for price.', 'Questo gruppo ha la copertura short più pesante degli ultimi 3 anni e vende sulla forza. Storicamente ciò è stato letto come un segnale di allarme per il prezzo.', 'Este grupo tiene su cobertura short más pesada en 3 años y vende en las subidas. Históricamente esto se ha interpretado como una señal de alerta para el precio.')];
  if (v >= 80 || v <= 20) return [L('قريب من التطرف', 'Near an extreme', 'Vicino a un estremo', 'Cerca de un extremo'), 'sig-mid', L('قريب من حدود نطاقه خلال 3 سنوات، دون أن يبلغ منطقة الإشارة بعد.', 'Close to the edge of its 3-year range, but not yet in signal territory.', 'Vicino al limite del suo intervallo triennale, ma non ancora in zona di segnale.', 'Cerca del borde de su rango de 3 años, pero todavía no en zona de señal.')];
  return [L('نطاق طبيعي', 'Normal range', 'Intervallo normale', 'Rango normal'), 'sig-mid', L('ضمن نطاقه المعتاد خلال 3 سنوات، ولا إشارة تطرف الآن.', 'Within its usual 3-year range; no extreme signal now.', 'Entro il suo consueto intervallo triennale; nessun segnale estremo al momento.', 'Dentro de su rango habitual de 3 años; ahora no hay ninguna señal extrema.')];
}

/* historical test: what did gold do after each extreme? */
function backtest(c){
  const r = c.recs, H = [4, 8, 13], px = r.map(x => priceAt(x[0], false));
  const idx = r.map((x, i) => i >= 155 ? cotIndexAt(r, i, 156).idx : null);
  const want = {hi: c.type === 'spec' ? -1 : 1, lo: c.type === 'spec' ? 1 : -1};
  const mk = () => ({n: 0, dates: [], hit: [0, 0, 0], ret: [0, 0, 0], cnt: [0, 0, 0]});
  const S = {hi: mk(), lo: mk()}, B = {up: [0, 0, 0], ret: [0, 0, 0], cnt: [0, 0, 0]};
  let first = null, lastD = null;
  for (let i = 0; i < r.length; i++){
    if (idx[i] == null || px[i] == null) continue;
    first = first || r[i][0];
    const fr = H.map(h => (i + h < r.length && px[i + h] != null) ? px[i + h] / px[i] - 1 : null);
    fr.forEach((v, k) => { if (v != null){ B.cnt[k]++; B.ret[k] += v; if (v > 0) B.up[k]++; lastD = r[i][0]; } });
    const zone = idx[i] >= 90 && !(idx[i - 1] >= 90) ? 'hi' : idx[i] <= 10 && !(idx[i - 1] <= 10) ? 'lo' : null;
    if (!zone) continue;
    const z = S[zone]; z.n++; z.dates.push(r[i][0]);
    fr.forEach((v, k) => { if (v != null){ z.cnt[k]++; z.ret[k] += v; if (Math.sign(v) === want[zone]) z.hit[k]++; } });
  }
  return {S, B, want, first, lastD, H};
}
function backtestHTML(c){
  if (!PRICES || !PRICES.daily || c.recs.length < 200) return `<p class="explain">${L('الاختبار التاريخي يحتاج سجل أسعار وسجل COT أطول؛ يكتمل بعد التحديث القادم.', 'The historical test needs longer price and COT history; it completes after the next update.', 'Il test storico richiede uno storico più lungo di prezzi e COT; si completerà dopo il prossimo aggiornamento.', 'La prueba histórica necesita un historial más largo de precios y del COT; se completará tras la próxima actualización.')}</p>`;
  const {S, B, want, first, lastD, H} = backtest(c);
  if (!first) return '';
  const pc = (a, b) => b ? bd(nf0.format(a / b * 100) + '%') : '—';
  const avg = (a, b) => b ? `<span class="${cls(a)}">${sPCT(a / b * 100)}</span>` : '—';
  const dir = w => w > 0 ? `<span class="up">${L('صعود', 'Up', 'Rialzo', 'Subida')}</span>` : `<span class="down">${L('هبوط', 'Down', 'Ribasso', 'Bajada')}</span>`;
  const row = (label, z, w) => `<tr><td>${label}</td><td class="n">${z.n}</td><td>${dir(w)}</td>${H.map((h, k) => `<td class="n"><b>${pc(z.hit[k], z.cnt[k])}</b></td>`).join('')}${H.map((h, k) => `<td class="n">${avg(z.ret[k], z.cnt[k])}</td>`).join('')}</tr>`;
  const base = `<tr class="base"><td>${L('كل الأسابيع (للمقارنة)', 'All weeks (baseline)', 'Tutte le settimane (base)', 'Todas las semanas (referencia)')}</td><td class="n">${B.cnt[0]}</td><td>${L('نسبة الصعود', 'Share up', 'Quota di rialzi', 'Proporción de subidas')}</td>${H.map((h, k) => `<td class="n">${pc(B.up[k], B.cnt[k])}</td>`).join('')}${H.map((h, k) => `<td class="n">${avg(B.ret[k], B.cnt[k])}</td>`).join('')}</tr>`;
  const lastSig = [...S.hi.dates.map(d => [d, 'hi']), ...S.lo.dates.map(d => [d, 'lo'])].sort().slice(-6).reverse();
  return `<h3 class="rv-title">${L('الاختبار التاريخي: ماذا فعل الذهب بعد كل إشارة؟', 'Historical test: what did gold do after each signal?', 'Test storico: cosa ha fatto l’oro dopo ogni segnale?', 'Prueba histórica: ¿qué hizo el oro tras cada señal?')}</h3>
    <div class="tablebox"><table><thead><tr><th>${L('الإشارة', 'Signal', 'Segnale', 'Señal')}</th><th class="n">${L('عدد المرات', 'Times', 'Occorrenze', 'Veces')}</th><th>${L('الاتجاه المتوقع', 'Expected move', 'Movimento atteso', 'Movimiento esperado')}</th>
      ${H.map(h => `<th class="n">${L(`نجاح بعد ${h} أسابيع`, `Hit rate, ${h}w`, `Tasso di successo, ${h} sett.`, `Tasa de acierto, ${h} sem.`)}</th>`).join('')}${H.map(h => `<th class="n">${L(`متوسط العائد ${h} أسابيع`, `Avg return, ${h}w`, `Rendimento medio, ${h} sett.`, `Rentabilidad media, ${h} sem.`)}</th>`).join('')}</tr></thead>
      <tbody>${row(L('دخول منطقة 90 فما فوق', 'Entered 90 or above', 'Entrato a 90 o oltre', 'Entró en 90 o más'), S.hi, want.hi)}${row(L('دخول منطقة 10 فما دون', 'Entered 10 or below', 'Entrato a 10 o meno', 'Entró en 10 o menos'), S.lo, want.lo)}${base}</tbody></table></div>
    <p class="explain">${L(
      `الفترة المختبرة: من ${fDay.format(toDate(first))} إلى ${fDay.format(toDate(lastD))}. «النجاح» يعني أن الذهب تحرك في الاتجاه المتوقع بعد المدة المذكورة. قارن نسبة النجاح بسطر «كل الأسابيع»: الإشارة مفيدة فقط إن تفوقت عليه بوضوح. السعر من عقود COMEX الأقرب، وفيه فروق صغيرة عند تبديل العقود. النتائج التاريخية لا تضمن المستقبل، وعدد المرات القليل يجعل النسب غير موثوقة.`,
      `Period tested: ${fDay.format(toDate(first))} to ${fDay.format(toDate(lastD))}. A “hit” means gold moved in the expected direction over that horizon. Compare each hit rate with the “All weeks” row: a signal only adds value if it clearly beats it. Prices are from the front COMEX contract, with small jumps at contract rolls. Past results do not guarantee the future, and a small number of signals makes the rates unreliable.`, `Periodo testato: dal ${fDay.format(toDate(first))} al ${fDay.format(toDate(lastD))}. Un “successo” significa che l’oro si è mosso nella direzione attesa su quell’orizzonte. Confronta ogni tasso di successo con la riga “Tutte le settimane”: un segnale aggiunge valore solo se la supera nettamente. I prezzi sono quelli del contratto COMEX più vicino, con piccoli salti ai rollover. I risultati passati non garantiscono quelli futuri, e un numero ridotto di segnali rende i tassi poco affidabili.`, `Periodo analizado: del ${fDay.format(toDate(first))} al ${fDay.format(toDate(lastD))}. Un “acierto” significa que el oro se movió en la dirección esperada en ese horizonte. Compara cada tasa de acierto con la fila “Todas las semanas”: una señal solo aporta valor si la supera con claridad. Los precios son los del contrato COMEX más próximo, con pequeños saltos en los cambios de contrato. Los resultados pasados no garantizan los futuros, y un número reducido de señales hace que las tasas sean poco fiables.`)}
      ${lastSig.length ? `<br>${L('آخر الإشارات', 'Latest signals', 'Ultimi segnali', 'Últimas señales')}: ${lastSig.map(([d, z]) => `${fList.format(toDate(d))} (${z === 'hi' ? '≥90' : '≤10'})`).join(L('، ', ', ', ', ', ', '))}` : ''}</p>`;
}

function f13Name(raw){
  const u = String(raw).toUpperCase();
  for (const [re, n] of BANK_RULES) if (GLOBAL_BANKS.has(n) && re.test(u)) return n;
  return titleCase(raw);
}

function f13Brief(P, first){
  const nb = P.n.new + P.n.first + P.n.up, ns = P.n.down + P.n.closed, net = P.buy - P.sell;
  let h = `<div class="brief"><h3>${L('قراءة التقرير: الربع المنتهي في', 'Reading the report: quarter ended', 'Lettura del report: trimestre chiuso il', 'Lectura del informe: trimestre cerrado el')} ${fDay.format(toDate(P.p))}</h3><p>${L(
    `أفصحت ${bd(nf0.format(P.holders))} مؤسسة عن حيازة ${TN(P.total)} من الذهب عبر صناديق الذهب المتداولة.`,
    `${bd(nf0.format(P.holders))} institutions reported holding ${TN(P.total)} of gold through gold ETFs.`, `${bd(nf0.format(P.holders))} istituzioni hanno dichiarato di detenere ${TN(P.total)} di oro tramite ETF sull’oro.`, `${bd(nf0.format(P.holders))} instituciones declararon tener ${TN(P.total)} de oro a través de ETF de oro.`)}`;
  if (first) h += ' ' + L('هذا أول ربع في السجل، فلا توجد مقارنة بربع سابق.', 'This is the first quarter in the record, so there is no comparison.', 'È il primo trimestre della serie, quindi non c’è confronto.', 'Es el primer trimestre de la serie, así que no hay comparación.') + '</p>';
  else h += ' ' + L(`${net >= 0 ? 'زادت المؤسسات حيازتها بصافي' : 'خفّضت المؤسسات حيازتها بصافي'} ${sTN(net)}: اشترت ${bd(nf0.format(nb))} مؤسسة ما مجموعه ${TN(P.buy)}، وباعت ${bd(nf0.format(ns))} مؤسسة ما مجموعه ${TN(P.sell)}.`,
    `Institutions ${net >= 0 ? 'added' : 'cut'} a net ${sTN(net)}: ${bd(nf0.format(nb))} bought a total of ${TN(P.buy)}, and ${bd(nf0.format(ns))} sold a total of ${TN(P.sell)}.`, `Saldo netto delle istituzioni: ${sTN(net)}. ${bd(nf0.format(nb))} hanno acquistato in totale ${TN(P.buy)} e ${bd(nf0.format(ns))} hanno venduto in totale ${TN(P.sell)}.`, `Saldo neto de las instituciones: ${sTN(net)}. ${bd(nf0.format(nb))} compraron en total ${TN(P.buy)} y ${bd(nf0.format(ns))} vendieron en total ${TN(P.sell)}.`) + '</p>';
  if (P.buyers.length) h += `<p><b class="up">${L('أكبر المشترين', 'Largest buyers', 'Maggiori acquirenti', 'Mayores compradores')}:</b> ${P.buyers.slice(0, 5).map(moveTxt).join(L('، ', '; ', '; ', '; '))}.</p>`;
  if (P.sellers.length) h += `<p><b class="down">${L('أكبر البائعين', 'Largest sellers', 'Maggiori venditori', 'Mayores vendedores')}:</b> ${P.sellers.slice(0, 5).map(moveTxt).join(L('، ', '; ', '; ', '; '))}.</p>`;
  const newN = P.n.new + P.n.first;
  if (!first && newN) h += `<p>${L(`فتحت ${bd(nf0.format(newN))} مؤسسة مراكز جديدة`, `${bd(nf0.format(newN))} institutions opened new positions`, `${bd(nf0.format(newN))} istituzioni hanno aperto nuove posizioni`, `${bd(nf0.format(newN))} instituciones abrieron nuevas posiciones`)}${P.opened.length ? L('، أبرزها ', ', led by ', ', guidate da ', ', encabezadas por ') + P.opened.slice(0, 3).map(m => `${nm13(m.n)} (${TN(m.b)})`).join(L('، ', '; ', '; ', '; ')) : ''}.</p>`;
  if (!first && P.n.closed) h += `<p>${L(`أغلقت ${bd(nf0.format(P.n.closed))} مؤسسة مراكزها بالكامل`, `${bd(nf0.format(P.n.closed))} institutions closed out completely`, `${bd(nf0.format(P.n.closed))} istituzioni hanno chiuso completamente le posizioni`, `${bd(nf0.format(P.n.closed))} instituciones cerraron por completo sus posiciones`)}${P.closed.length ? L('، أبرزها ', ', led by ', ', guidate da ', ', encabezadas por ') + P.closed.slice(0, 3).map(m => `${nm13(m.n)} (${L('كانت تملك', 'held', 'deteneva', 'tenía')} ${TN(m.a)})`).join(L('، ', '; ', '; ', '; ')) : ''}.</p>`;
  if (!P.complete) h += `<p class="note-warn">${L('مهلة الإفصاح عن هذا الربع لم تكتمل في الملفات المنشورة بعد، فقد تتغير الأرقام عند إضافة الإيداعات المتأخرة.', 'The filing deadline for this quarter is not fully covered by the published files yet, so figures may change as late filings arrive.', 'I file pubblicati non coprono ancora del tutto la scadenza di segnalazione di questo trimestre, quindi i dati possono cambiare con l’arrivo delle segnalazioni tardive.', 'Los archivos publicados aún no cubren por completo el plazo de declaración de este trimestre, por lo que las cifras pueden cambiar a medida que lleguen declaraciones tardías.')}</p>`;
  return h + '</div>';
}

function f13List(title, rows, k){
  if (!rows.length) return `<div class="ranked wide"><h3>${title}</h3><p class="empty">${L('لا توجد مؤسسات في هذه الفئة.', 'No institutions in this group.', 'Nessuna istituzione in questo gruppo.', 'No hay instituciones en este grupo.')}</p></div>`;
  const maxAbs = Math.max(1, ...rows.map(m => Math.abs(m.b - m.a)));
  return `<div class="ranked wide"><h3>${title}</h3>${rows.map(m => { const d = m.b - m.a, pct = m.a ? d / m.a * 100 : null;
    return `<div class="row"><span>${mgrBtn(m.c, m.n)}</span>
      <span class="track"><span class="bar ${k}" style="display:block;width:${Math.max(2, Math.abs(d) / maxAbs * 100).toFixed(1)}%"></span></span>
      <span class="val ${k}">${sTN(d)}</span>
      <span class="det">${badge(m.s)} ${sKG(d)}${pct == null ? '' : ' ' + sPCT(pct)}${L('، من', ', from', ', da', ', de')} ${TN(m.a)} ${L('إلى', 'to', 'a', 'a')} ${TN(m.b)}</span></div>`; }).join('')}</div>`;
}

function comexGross(){
  const deps = ((DATA.comex || {}).depositories) || {}, g = {};
  Object.values(deps).forEach(s => { for (let i = 1; i < s.length; i++){
    const dv = (s[i][1] + s[i][2]) - (s[i - 1][1] + s[i - 1][2]), e = (g[s[i][0]] = g[s[i][0]] || {buy:0, sell:0});
    if (dv > 0) e.buy += dv; else e.sell -= dv; } });
  return Object.keys(g).length ? g : null;
}

function etfTotal(funds){
  const use = Object.keys(funds).filter(k => funds[k].length >= 25), maps = use.map(k => Object.fromEntries(funds[k]));

/* ---------- shared: two series on one chart (each on its own scale) ---------- */
function onOrBefore(series, d){
  let lo = 0, hi = series.length - 1, ans = null;
  while (lo <= hi){ const m = (lo + hi) >> 1; if (series[m][0] <= d){ ans = series[m][1]; lo = m + 1; } else hi = m - 1; }
  return ans;
}
function dualChart(title, a, b, o){
  const step = Math.max(1, Math.ceil(a.length / 360)), pts = [];
  for (let i = 0; i < a.length; i += step) pts.push(a[i]);
  if (pts[pts.length - 1] !== a[a.length - 1]) pts.push(a[a.length - 1]);
  const pb = pts.map(p => onOrBefore(b, p[0]));
  if (pts.length < 2) return '';
  const W = 640, H = 240, T = 10, B = 10, n = pts.length, X = i => (i / (n - 1) * W).toFixed(1);
  const ext = v => { const f = v.filter(x => x != null); let lo = Math.min(...f), hi = Math.max(...f); if (lo === hi){ lo -= 1; hi += 1; } return [lo, hi]; };
  const [al, ah] = ext(pts.map(p => p[1])), [bl, bh] = ext(pb);
  const YA = v => (T + (ah - v) / (ah - al) * (H - T - B)).toFixed(1);
  const YB = v => (T + (o.invertB ? (v - bl) / (bh - bl) : (bh - v) / (bh - bl)) * (H - T - B)).toFixed(1);
  const line = (vals, Y) => vals.map((v, i) => v == null ? '' : `${X(i)},${Y(v)}`).filter(Boolean).join(' ');
  const ticks = [0, .25, .5, .75, 1].map(f => { const p = pts[Math.round(f * (n - 1))]; return `<span>${fShortM.format(toDate(p[0]))}</span>`; }).join('');
  const lastB = pb[pb.length - 1];
  return `<div class="rv"><h3 class="rv-title">${title}</h3>
    <div class="legend"><span><i style="background:var(--gold)"></i>${o.aName}: <b>${o.aFmt(pts[n - 1][1])}</b> <small class="muted">(${o.aFmt(al)} – ${o.aFmt(ah)})</small></span>
      <span><i style="background:var(--blue)"></i>${o.bName}${o.invertB ? ` <small class="muted">${L('(محور مقلوب)', '(inverted axis)', '(asse invertito)', '(eje invertido)')}</small>` : ''}: <b>${lastB == null ? '—' : o.bFmt(lastB)}</b> <small class="muted">(${o.bFmt(bl)} – ${o.bFmt(bh)})</small></span></div>
    <div class="rv-plot"><svg class="rvc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="${line(pts.map(p => p[1]), YA)}" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <polyline points="${line(pb, YB)}" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
      <div class="ticks spread">${ticks}</div></div>${o.note ? `<p class="explain">${o.note}</p>` : ''}</div>`;
}
function corr(xs, ys){
  const n = xs.length; if (n < 10) return null;
  const mx = xs.reduce((s, v) => s + v, 0) / n, my = ys.reduce((s, v) => s + v, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++){ const a = xs[i] - mx, b = ys[i] - my; sxy += a * b; sxx += a * a; syy += b * b; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
/* correlation of daily changes: gold % change vs the driver's daily change, over the last n shared days */
function changeCorr(driver, n, pct){
  const g = (PRICES && PRICES.daily) || [], gm = new Map(g), xs = [], ys = [];
  const d = driver.filter(r => gm.has(r[0])).slice(-(n + 1));
  for (let i = 1; i < d.length; i++){
    const g0 = gm.get(d[i - 1][0]), g1 = gm.get(d[i][0]);
    xs.push((g1 / g0 - 1) * 100); ys.push(pct ? (d[i][1] / d[i - 1][1] - 1) * 100 : d[i][1] - d[i - 1][1]);
  }
  return corr(xs, ys);
}

function gexQuad(g){

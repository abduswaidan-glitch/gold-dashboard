<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تدفقات الذهب</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBE9; --surface:#F5F6F4; --ink:#18232B; --muted:#56646C; --rule:#C7CEC9;
  --metal:#8E661C; --metal-hi:#D9B35E; --metal-lo:#9C7428; --ingot-ink:#2A1E07;
  --buy:#1F7049; --sell:#A93A26; --alt:#3D6C8C; --orange:#C2620A; --blue:#2458C6;
  --kufi:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131B21; --surface:#1B252C; --ink:#E4E7E3; --muted:#93A1A8; --rule:#2C3940;
    --metal:#D8AB4F; --metal-hi:#E2BE6E; --metal-lo:#8A6421; --ingot-ink:#1E1505;
    --buy:#4DB383; --sell:#E2735B; --alt:#7FB0D1; --orange:#F0A04B; --blue:#7FA8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B21; --surface:#1B252C; --ink:#E4E7E3; --muted:#93A1A8; --rule:#2C3940;
  --metal:#D8AB4F; --metal-hi:#E2BE6E; --metal-lo:#8A6421; --ingot-ink:#1E1505;
  --buy:#4DB383; --sell:#E2735B; --alt:#7FB0D1; --orange:#F0A04B; --blue:#7FA8FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--metal);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* masthead: the stamped ingot */
.masthead{padding:10px 0 18px}
.ingot{position:relative;padding:22px 28px 20px;color:var(--ingot-ink);
  background:linear-gradient(170deg,var(--metal-hi) 0%,#C99A3E 45%,var(--metal-lo) 100%);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);}
.ingot::after{content:"";position:absolute;inset:7px 3.5% 7px;border:1px solid rgba(42,30,7,.35);
  clip-path:polygon(1.5% 0,98.5% 0,100% 100%,0 100%);pointer-events:none}
.ingot h1{font-family:var(--kufi);font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0}
.ingot .assay{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:8px;font-size:15px}
.ingot .assay b{font-family:var(--kufi);font-size:clamp(22px,4.6vw,30px);font-weight:700;margin-inline-end:6px}
.updated{margin:10px 2px 0;color:var(--muted);font-size:14px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--rule);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:12px 14px 10px;cursor:pointer;color:var(--muted);
  border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--metal)}

/* section */
main{padding:22px 0 40px}
.sec-head h2{font-family:var(--kufi);font-weight:500;font-size:26px;margin:0 0 4px}
.sec-head p{margin:0;color:var(--muted);max-width:68ch;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-size:13px;padding:2px 10px;border:1px solid var(--rule);border-radius:99px;color:var(--muted)}
.warn{overflow-wrap:anywhere;margin:14px 0 0;padding:10px 14px;border-inline-start:3px solid var(--sell);background:var(--surface);font-size:14px}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-size:15px}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:18px}
.fig{background:var(--surface);padding:14px 16px}
.fig h3{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.fig .v{font-family:var(--kufi);font-size:30px;font-weight:700;line-height:1.25;margin-top:2px}
.fig .sub{font-size:14px;color:var(--muted)}
.fig .note{font-size:13px;color:var(--muted);margin-top:6px}
.chg{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:8px}
.chg b{font-size:18px}
.chg em{font-style:normal;font-size:13px;padding:0 8px;border-radius:4px}
.up{color:var(--buy)} .down{color:var(--sell)} .flat,.na{color:var(--muted)}
.up em{background:color-mix(in srgb,var(--buy) 14%,transparent)}
.down em{background:color-mix(in srgb,var(--sell) 14%,transparent)}
.since{display:block;font-size:13px;color:var(--muted)}

/* charts */
.chartbox{margin:0 0 18px;background:var(--surface);border:1px solid var(--rule);padding:12px 12px 6px}
.chartbox h4{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--muted)}
.chart{display:block;width:100%;height:170px;direction:ltr}
.chart .area{fill:var(--metal);opacity:.13}
.chart .l-main{fill:none;stroke:var(--metal);stroke-width:2}
.chart .l-alt{fill:none;stroke:var(--alt);stroke-width:2}
.chart .zero{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.chart .b-up{fill:var(--buy)} .chart .b-down{fill:var(--sell)}
.chartbox figcaption{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);padding-top:4px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-inline-end:5px}

/* tables & ranked lists */
.tablebox{overflow-x:auto;border:1px solid var(--rule);background:var(--surface);margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13.5px;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:end}
tr:last-child td{border-bottom:0}
.rank{color:var(--muted);width:2.5em}
.more{border:1px solid var(--rule);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;margin:4px 0 18px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}
.ranked h3{font-size:16px;margin:0 0 8px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(90px,8.5em) 1fr auto;gap:4px 10px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.row .track{height:10px;background:color-mix(in srgb,var(--muted) 12%,transparent)}
.row .bar{height:100%}
.row .bar.up{background:var(--buy)} .row .bar.down{background:var(--sell)}
.row .val{text-align:end}
.row .det{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0;margin:0}
.explain{color:var(--muted);font-size:14px;max-width:72ch;margin:0 0 10px}

/* report viewer */
.rv{background:var(--surface);border:1px solid var(--rule);padding:14px 14px 12px;margin:0 0 20px}
.rv-title{font-size:16px;font-weight:600;margin:0 0 6px}
.rv-plot{position:relative;direction:ltr}
.rvc{display:block;width:100%;height:230px}
.rvc .b-up{fill:var(--buy)} .rvc .b-down{fill:var(--sell)}
.rvc .zero{stroke:var(--muted);stroke-width:1}
.rvc .l-net{fill:none;stroke:var(--ink);stroke-width:2}
.rvc .hit{fill:transparent;cursor:pointer}
.rvc .hit.hover{fill:color-mix(in srgb,var(--ink) 7%,transparent)}
.rvc .selcol{fill:color-mix(in srgb,var(--metal) 18%,transparent)}
.ticks{display:flex;font-size:11.5px;color:var(--muted);padding-top:4px}
.ticks span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.tt{position:absolute;top:8px;z-index:3;min-width:230px;max-width:300px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);box-shadow:0 6px 18px rgba(0,0,0,.18);padding:8px 10px;font-size:13px;pointer-events:none}
.tt-d{font-weight:600;margin-bottom:4px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.tt div:not(.tt-d){display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.tt .ink{color:var(--ink)} .orange{color:var(--orange)} .blue{color:var(--blue)}
.rv-bottom{display:grid;grid-template-columns:1fr 230px;gap:14px;margin-top:12px}
.rv-sel{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.cell{background:var(--bg);padding:10px 12px}
.cell h4{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.cell .cv{font-family:var(--kufi);font-size:20px;font-weight:700;line-height:1.35}
.cell .cs{font-size:12.5px;color:var(--muted)}
.rv-list{max-height:250px;overflow-y:auto;border:1px solid var(--rule);background:var(--bg)}
.rep{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 10px;cursor:pointer;font-size:13px;text-align:start}
.rep[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rep[aria-pressed="true"] .up,.rep[aria-pressed="true"] .down,.rep[aria-pressed="true"] .flat{color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip-btn{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.picker select{font:inherit;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:8px}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;font:inherit}
@media (max-width:720px){
  .rv-bottom{grid-template-columns:1fr}
  .rv-list{display:flex;max-height:none;overflow-x:auto;overflow-y:hidden}
  .rep{flex:none;width:auto;flex-direction:column;border-bottom:0;border-inline-end:1px solid var(--rule)}
  .cells{grid-template-columns:1fr}
  .tt{min-width:200px}
}

/* 13F dossier */
.dossier{border:1px solid var(--metal-lo);background:var(--surface);margin:22px 0 22px}
.dossier-head{display:flex;gap:16px;align-items:center;padding:16px 18px;color:var(--ingot-ink);
  background:linear-gradient(170deg,var(--metal-hi) 0%,#C99A3E 55%,var(--metal-lo) 100%)}
.dossier-head h2{font-family:var(--kufi);font-size:24px;font-weight:700;margin:0;line-height:1.25}
.dossier-head p{margin:2px 0 0;font-size:15px}
.stamp{font-family:var(--kufi);font-weight:700;font-size:26px;border:2px solid var(--ingot-ink);padding:4px 12px;line-height:1.1;flex:none;direction:ltr}
.dossier-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 28px;padding:8px 18px 14px}
.dossier-body h3{font-size:16px;margin:12px 0 4px}
.dossier-body p{margin:0 0 6px;font-size:14.5px;max-width:70ch}
.legend-list{list-style:none;padding:0;margin:0 0 6px;font-size:14.5px}
.legend-list li{margin:4px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.st-new{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.st-up{background:color-mix(in srgb,var(--buy) 16%,transparent);color:var(--buy)}
.st-down{background:color-mix(in srgb,var(--sell) 14%,transparent);color:var(--sell)}
.st-closed{background:var(--sell);color:#fff}
.st-same{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.ranked.wide .row{grid-template-columns:minmax(150px,15em) 1fr auto}
.brief{border-inline-start:4px solid var(--metal);background:var(--surface);padding:12px 16px;margin:0 0 16px}
.brief h3{margin:0 0 6px;font-size:17px}
.brief p{margin:0 0 6px;max-width:80ch;font-size:15px}
.note-warn{color:var(--sell);font-size:13.5px}
footer{border-top:1px solid var(--rule);color:var(--muted);font-size:13px;padding:18px 0 30px}
footer a{color:inherit}
@media (max-width:520px){
  .fig .v{font-size:26px}
  .ingot{padding:18px 20px 16px}
}
@media (prefers-reduced-motion:no-preference){
  .ingot{animation:strike .6s ease-out both}
  @keyframes strike{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
}

/* language switch (always top-right) */
.topbar{display:flex;justify-content:flex-end;direction:ltr;padding:12px 0 10px}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden;background:var(--surface)}
.lang button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:5px 12px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.lang button+button{border-left:1px solid var(--rule)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang img{width:20px;height:14px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.flag{width:20px;height:14px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-inline-end:7px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
/* about panel */
.about{border:1px solid var(--rule);background:var(--surface);margin:16px 0 4px}
.about summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.about summary::-webkit-details-marker{display:none}
.about summary::after{content:"−";color:var(--muted);font-weight:400}
.about:not([open]) summary::after{content:"+"}
.about-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 26px;padding:0 14px 12px;border-top:1px solid var(--rule)}
.about-body h4{margin:10px 0 3px;font-size:14.5px}
.about-body p{margin:0;font-size:14px;color:var(--ink);opacity:.92;max-width:68ch}
.fresh{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--rule)}
.fresh.ok{color:var(--buy);border-color:color-mix(in srgb,var(--buy) 45%,transparent)}
.fresh.stale{color:var(--sell);border-color:color-mix(in srgb,var(--sell) 45%,transparent)}
/* COT signal gauges */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0 18px}
.gauge{background:var(--surface);border:1px solid var(--rule);padding:12px 14px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.gauge[aria-pressed="true"]{outline:2px solid var(--metal);outline-offset:-2px}
.gauge h3{margin:0;font-size:14.5px;font-weight:600}
.gauge .gv{font-family:var(--kufi);font-size:30px;font-weight:700;line-height:1.3}
.gbar{position:relative;height:12px;margin:6px 0 4px;direction:ltr;
  background:linear-gradient(90deg,color-mix(in srgb,var(--sell) 55%,transparent) 0 10%,color-mix(in srgb,var(--muted) 18%,transparent) 10% 90%,color-mix(in srgb,var(--buy) 55%,transparent) 90% 100%)}
.gbar i{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);transform:translateX(-1px)}
.gbar b{position:absolute;top:-3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--metal);background:var(--surface);transform:translate(-4px,4px)}
.gscale{position:relative;height:16px;font-size:11.5px;color:var(--muted);direction:ltr}
.gscale span{position:absolute;top:0;transform:translateX(-50%)}
.gscale span:first-child{transform:none}
.gscale span:last-child{transform:translateX(-100%)}
.gtxt{font-size:13.5px;margin-top:6px}
.sig-hot{color:var(--sell);font-weight:600} .sig-cold{color:var(--blue);font-weight:600} .sig-mid{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap topbar"><div class="lang" id="lang" role="group" aria-label="Language / اللغة"></div></div>
<header class="wrap masthead">
  <div class="ingot">
    <h1 id="title">تدفقات الذهب</h1>
    <div class="assay" id="assay">…</div>
  </div>
  <p class="updated" id="updated"></p>
</header>
<nav class="tabs wrap" role="tablist" id="tabs"></nav>
<main class="wrap" id="view" aria-live="polite"></main>
<footer class="wrap" id="foot"></footer>
<script>
'use strict';
/* ================= language ================= */
const state = {lang:'ar', tab:'countries', mode:{}, period:{}, all:false, sel:{}, country:null,
  bankView:'cot', cotCat:'swap', bank:null, vault:null, mgr:null, sig:'mm', etfFund:'GLD', phys:'efp'};
try { const s = localStorage.getItem('gold-lang'); if (s === 'en' || s === 'ar') state.lang = s; } catch (e) {}
const qLang = new URLSearchParams(location.search).get('lang');
if (qLang === 'en' || qLang === 'ar') state.lang = qLang;
const L = (ar, en) => state.lang === 'en' ? en : ar;
const isAr = () => state.lang === 'ar';

/* ================= formatting ================= */
const nf0 = new Intl.NumberFormat('en-US', {maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('en-US', {minimumFractionDigits:1, maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
let fMonth, fDay, fStamp, fShortM;
function setFormatters(){
  const loc = isAr() ? 'ar-u-nu-latn' : 'en-GB';
  fMonth = new Intl.DateTimeFormat(loc, {month:'long', year:'numeric', timeZone:'UTC'});
  fDay = new Intl.DateTimeFormat(loc, {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'});
  fStamp = new Intl.DateTimeFormat(loc, {dateStyle:'medium', timeStyle:'short'});
  fShortM = new Intl.DateTimeFormat(loc, {month:'short', year:'2-digit', timeZone:'UTC'});
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDate = s => new Date(s + 'T00:00:00Z');
const dm = d => { const t = toDate(d); return `${t.getUTCDate()}/${t.getUTCMonth() + 1}`; };
const sg = v => v > 0 ? '+' : v < 0 ? '−' : '';
const bd = s => `<bdi dir="ltr">${s}</bdi>`;
const U = {t: () => L('طن', 't'), kg: () => L('كغ', 'kg'), ct: () => L('عقد', 'contracts'), oz: () => '$/oz'};
const KG = v => `${bd((v < 0 ? '−' : '') + nf0.format(Math.abs(v)))} ${U.kg()}`;
const TN = v => `${bd((v < 0 ? '−' : '') + nf1.format(Math.abs(v) / 1000))} ${U.t()}`;
const sKG = v => `${bd(sg(v) + nf0.format(Math.abs(v)))} ${U.kg()}`;
const sTN = v => `${bd(sg(v) + nf1.format(Math.abs(v) / 1000))} ${U.t()}`;
const CT = v => `${bd((v < 0 ? '−' : '') + nf0.format(Math.abs(v)))} ${U.ct()}`;
const sCT = v => `${bd(sg(v) + nf0.format(Math.abs(v)))} ${U.ct()}`;
const USD = v => bd((v < 0 ? '−$' : '$') + nf2.format(Math.abs(v)));
const sUSD = v => bd(sg(v) + '$' + nf2.format(Math.abs(v)));
const sPCT = p => p == null || !isFinite(p) ? '' : bd(sg(p) + nf2.format(Math.abs(p)) + '%');
const plainSigned = (v, unit) => `${sg(v)}${nf0.format(Math.abs(v))} ${unit}`;
const isMonthly = s => s.length > 1 && s.every(p => p[0].endsWith('-01'));

/* ================= math helpers ================= */
const PERIODS = {m:{days:30, ar:'شهر', en:'Month'}, q:{days:91, ar:'ربع سنة', en:'Quarter'}, y:{days:365, ar:'سنة', en:'Year'}};
const pLabel = k => L(PERIODS[k].ar, PERIODS[k].en);
function last(s){ return s && s.length ? s[s.length - 1] : null; }
function change(s, days){
  if (!s || s.length < 2) return null;
  const end = last(s), target = toDate(end[0]).getTime() - days * 864e5;
  let best = null, gap = Infinity;
  for (let i = 0; i < s.length - 1; i++){
    const g = Math.abs(toDate(s[i][0]).getTime() - target);
    if (g < gap){ gap = g; best = s[i]; }
  }
  if (!best || gap > days * 864e5 * 0.5) return null;
  const d = end[1] - best[1];
  return {from: best, to: end, d, pct: best[1] ? d / Math.abs(best[1]) * 100 : null};
}

  const when = s.last_ok ? ` ${L('بتاريخ', 'from')} ${fDay.format(new Date(s.last_ok))}` : '';
  return `<p class="warn">${L('تعذّر جلب هذا المصدر في آخر تشغيل', 'This source could not be fetched on the last run')}: <bdi dir="ltr">${esc((s.error || '').slice(0, 140))}</bdi>. ${L('المعروض هو آخر بيانات ناجحة', 'Showing the last successful data')}${when}.</p>`;
}

/* freshness: how old is the latest data point vs. what the source normally allows */
function fresh(lastDate, maxDays){
  if (!lastDate) return '';
  const age = Math.floor((Date.now() - toDate(lastDate).getTime()) / 864e5);
  const ok = age <= maxDays;
  return `<span class="fresh ${ok ? 'ok' : 'stale'}" title="${L('عمر آخر قراءة', 'Age of latest data')}: ${age} ${L('يومًا', 'days')}">${ok
    ? L('محدَّث تلقائيًا ✓', 'Auto-updated ✓')
    : L(`أقدم من المتوقع (${age} يومًا)`, `Older than expected (${age} days)`)}</span>`;
}

function flowModel(series, gross){
  const s = (series || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < s.length; i++){
    const [d, v] = s[i], prev = s[i - 1][1], delta = v - prev, g = gross && gross[d];
    pts.push({d, line:v, delta, pct: prev ? delta / Math.abs(prev) * 100 : null, d3: i >= 3 ? v - s[i - 3][1] : null,
      buy: g ? g.buy : Math.max(delta, 0), sell: g ? g.sell : Math.max(-delta, 0), g});
  }
  return pts.slice(-WINDOW);
}

function lsModel(recs){
  const r = (recs || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < r.length; i++){
    const [d, l, s, sp] = r[i], [, pl, ps, psp] = r[i - 1];
    const net = l - s, pnet = pl - ps, delta = net - pnet;
    pts.push({d, buy:l, sell:s, line:net, delta, pct: pnet ? delta / Math.abs(pnet) * 100 : null,
      d3: i >= 3 ? net - (r[i - 3][1] - r[i - 3][2]) : null, dl: l - pl, ds: s - ps, sp: sp || 0, dsp: (sp || 0) - (psp || 0), rec: r[i]});
  }
  return pts.slice(-WINDOW);
}

/* spread model (USD/oz): bars above zero = premium, below = discount */
function spreadModel(rows){
  const r = (rows || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < r.length; i++){
    const [d, v, a, b] = r[i], prev = r[i - 1][1];
    pts.push({d, line:v, a, b, delta: v - prev, pct: b ? v / b * 100 : null, d3: i >= 3 ? v - r[i - 3][1] : null,
      buy: Math.max(v, 0), sell: Math.max(-v, 0)});
  }
  return pts.slice(-WINDOW);
}

function rvSel(id, pts){
  let i = state.sel[id];
  if (i == null || i >= pts.length) i = pts.length - 1;
  return i;

function reportView(id, title, pts, cfg){
  if (!pts.length) return `<div class="rv"><h3 class="rv-title">${title}</h3><p class="empty">${cfg.empty || L('لا تكفي التقارير لرسم المخطط بعد؛ يكتمل مع التحديثات القادمة.', 'Not enough reports to draw the chart yet; it fills in with upcoming updates.')}</p></div>`;
  RVM[id] = {pts, cfg};
  const si = rvSel(id, pts), p = pts[si], n = pts.length;
  const W = 640, H = 230, T = 10, B = 10, ph = H - T - B, cw = W / n;
  const mu = Math.max(1e-9, ...pts.map(q => q.buy)), md = Math.max(1e-9, ...pts.map(q => q.sell));
  const sc = ph / (mu + md), zy = T + mu * sc;
  let svg = `<svg class="rvc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  svg += `<rect class="selcol" x="${(si * cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}"/>`;
  pts.forEach((q, i) => {
    const x = (i * cw + cw * .2).toFixed(1), w = (cw * .6).toFixed(1);
    if (q.buy > 0) svg += `<rect class="b-up" x="${x}" y="${(zy - q.buy * sc).toFixed(1)}" width="${w}" height="${Math.max(1, q.buy * sc).toFixed(1)}"/>`;
    if (q.sell > 0) svg += `<rect class="b-down" x="${x}" y="${zy.toFixed(1)}" width="${w}" height="${Math.max(1, q.sell * sc).toFixed(1)}"/>`;
  });
  svg += `<line class="zero" x1="0" x2="${W}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" vector-effect="non-scaling-stroke"/>`;
  if (cfg.line){
    const lv = pts.map(q => q.line); let lo = Math.min(...lv), hi = Math.max(...lv);
    if (lo === hi){ lo -= 1; hi += 1; }
    const Y = v => T + 8 + (hi - v) / (hi - lo) * (ph - 16);
    svg += `<polyline class="l-net" points="${pts.map((q, i) => `${((i + .5) * cw).toFixed(1)},${Y(q.line).toFixed(1)}`).join(' ')}" vector-effect="non-scaling-stroke"/>`;
  }
  pts.forEach((q, i) => { svg += `<rect class="hit" data-rv="${esc(id)}" data-i="${i}" x="${(i * cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}"/>`; });
  svg += '</svg>';
  const monthly = cfg.monthly, step = n > 12 ? 4 : n > 6 ? 2 : 1;
  const ticks = pts.map((q, i) => `<span>${(i % step === (n - 1) % step) ? (monthly ? fShortM.format(toDate(q.d)) : dm(q.d)) : ''}</span>`).join('');
  const legend = `<div class="legend"><span><i style="background:var(--buy)"></i>${cfg.buy}</span><span><i style="background:var(--sell)"></i>${cfg.sell}</span>${cfg.line ? `<span><i style="background:var(--ink)"></i>${cfg.line}</span>` : ''}</div>`;
  const cells = cfg.cells(p, si, pts).map(c => `<div class="cell"><h4>${c.label}</h4><div class="cv">${c.v}</div><div class="cs">${c.sub || ''}</div></div>`).join('');
  const list = pts.map((q, i) => ({q, i})).reverse().map(({q, i}) =>
    `<button class="rep" data-act="sel" data-rv="${esc(id)}" data-i="${i}" aria-pressed="${i === si}"><span>${fmtD(q.d, monthly)}</span><span class="${cls(q.delta)}">${cfg.sfmt(q.delta)}</span></button>`).join('');
  return `<div class="rv" id="rv-${esc(id)}">
    <h3 class="rv-title">${title}</h3>${legend}
    <div class="rv-plot">${svg}<div class="ticks">${ticks}</div><div class="tt" dir="${isAr() ? 'rtl' : 'ltr'}" hidden></div></div>
    <div class="rv-bottom">
      <div><div class="rv-sel">${L('التقرير المختار', 'Selected report')}: <b>${fmtD(p.d, monthly)}</b></div><div class="cells">${cells}</div></div>
      <div class="rv-list" aria-label="${L('آخر التقارير', 'Latest reports')}">${list}</div>
    </div></div>`;
}

function panelHTML(id, i){
  const m = RVM[id]; if (!m) return '';
  const q = m.pts[i], c = m.cfg;
  const row = (k, v, cl) => `<div><span>${k}</span><b class="${cl}">${v}</b></div>`;
  let h = `<div class="tt-d">${fmtD(q.d, c.monthly)}</div>`;
  if (c.panel) return h + c.panel(q, row);
  h += row(c.buy, c.fmt(q.buy), 'up');
  h += row(c.sell, c.fmt(q.sell), 'down');
  if (c.extra) h += c.extra(q);
  h += row(c.pctLabel || L('نسبة التغير', 'Change %'), q.pct == null ? '—' : sPCT(q.pct), 'ink');
  h += row(c.deltaLabel || L('الدلتا', 'Delta'), c.sfmt(q.delta), 'orange');

  return h;
}

function grossByMonth(){
  const g = {};
  Object.values(DATA.countries || {}).forEach(s => {
    for (let i = 1; i < s.length; i++){
      const d = s[i][0], dv = s[i][1] - s[i - 1][1], e = (g[d] = g[d] || {buy:0, sell:0, nb:0, ns:0});
      if (dv > 0){ e.buy += dv; e.nb++; } else if (dv < 0){ e.sell -= dv; e.ns++; }
    }
  });
  return g;
}

R.countries = () => {
  const id = 'countries', p = state.period[id];
  const entries = Object.entries(DATA.countries || {});
  const latest = entries.reduce((a, [, s]) => last(s)[0] > a ? last(s)[0] : a, '');

    [L('شهري', 'Monthly'), L('تأخير نحو 50 يومًا', 'About 50 days delay'), `${entries.length} ${L('دولة', 'countries')}`], 'imf', fresh(latest, 80));
  h += about(id, ABOUT.countries());
  if (!entries.length) return h + noData();

  const codes = entries.map(([c]) => c).sort((a, b) => nameOf(a).localeCompare(nameOf(b), state.lang));

    `<option value="${c}" ${c === state.country ? 'selected' : ''}>${esc(nameOf(c))}</option>`).join('')}</select></div>`;
  h += reportView('c-' + state.country, `${cName(state.country)}: ${L('آخر 20 شهرًا', 'last 20 months')}`, flowModel(cs), kgCfg({
    monthly:true, buy: L('شراء', 'Bought'), sell: L('بيع', 'Sold'), line: L('الحيازة', 'Holdings'),

      return [
        {label: L('الحيازة', 'Holdings'), v: TN(q.line), sub: KG(q.line)},
        {label: L('التغير عن الشهر السابق', 'Change vs previous month'), v: `<span class="${cls(q.delta)}">${sTN(q.delta)}</span>`, sub: `${sKG(q.delta)} ${sPCT(q.pct)}`},
        {label: L('الحصة من إجمالي الدول المُبلِّغة', 'Share of all reporting countries'), v: tot ? bd(nf2.format(q.line / tot * 100) + '%') : '—', sub: tot ? `${L('من', 'of')} ${TN(tot)}` : ''},
      ];
    }}));

  h += controls(id, true);
  if (state.mode[id] === 'stock'){
    const rows = entries.map(([code, s]) => ({code, l: last(s), c: change(s, PERIODS[p].days)})).sort((a, b) => b.l[1] - a.l[1]);
    const total = rows.reduce((a, r) => a + r.l[1], 0), shown = state.all ? rows : rows.slice(0, 25);
    h += `<div class="tablebox"><table><thead><tr><th class="rank">#</th><th>${L('الدولة', 'Country')}</th><th class="n">${L('الحيازة', 'Holdings')}</th><th class="n">${L('بالكيلوغرام', 'In kilograms')}</th>
      <th class="n">${L('الحصة', 'Share')}</th><th class="n">${L('التغير خلال', 'Change over')} ${pLabel(p)}</th><th>${L('آخر قراءة', 'Latest report')}</th></tr></thead><tbody>
      ${shown.map((r, i) => `<tr><td class="rank">${i + 1}</td><td><button class="linkish" data-act="country-go" data-v="${r.code}">${cName(r.code)}</button></td>
        <td class="n">${TN(r.l[1])}</td><td class="n">${KG(r.l[1])}</td><td class="n">${bd(nf1.format(r.l[1] / total * 100) + '%')}</td>
        <td class="n ${r.c ? cls(r.c.d) : 'na'}">${r.c ? `${sTN(r.c.d)} ${sPCT(r.c.pct)}` : L('غير متاح', 'n/a')}</td><td>${fMonth.format(toDate(r.l[0]))}</td></tr>`).join('')}</tbody></table></div>`;
    if (rows.length > 25) h += `<button class="more" data-act="all">${state.all ? L('عرض أكبر 25 دولة فقط', 'Show the top 25 only') : L(`عرض كل الدول (${rows.length})`, `Show all countries (${rows.length})`)}</button>`;
    h += `<p class="explain">${L('اضغط اسم أي دولة لعرض مخططها.', 'Click any country to see its chart.')}</p>`;
    return h;
  }
  const rows = countryChanges(p);
  const buyers = rows.filter(r => r.c.d > 0).sort((a, b) => b.c.d - a.c.d), sellers = rows.filter(r => r.c.d < 0).sort((a, b) => a.c.d - b.c.d);
  const bought = buyers.reduce((a, r) => a + r.c.d, 0), sold = sellers.reduce((a, r) => a + r.c.d, 0), net = bought + sold;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.c.d)));
  const nm = r => `<button class="linkish" data-act="country-go" data-v="${r.code}">${cName(r.code)}</button>`;
  h += `<div class="figs">
    <div class="fig"><h3>${L(`اشترت ${buyers.length} دولة`, `${buyers.length} countries bought`)}</h3><div class="v ${bought ? 'up' : 'flat'}">${sTN(bought)}</div><div class="sub">${sKG(bought)}</div></div>
    <div class="fig"><h3>${L(`باعت ${sellers.length} دولة`, `${sellers.length} countries sold`)}</h3><div class="v ${sold ? 'down' : 'flat'}">${sTN(sold)}</div><div class="sub">${sKG(sold)}</div></div>
    <div class="fig"><h3>${L('الصافي خلال', 'Net over')} ${pLabel(p)}</h3><div class="v ${net >= 0 ? 'up' : 'down'}">${sTN(net)}</div><div class="sub">${sKG(net)}</div></div></div>
    <p class="explain">${L('تُقارَن آخر قراءة لكل دولة بقراءتها قبل المدة المختارة تقريبًا، لأن الدول لا ترفع بياناتها في الشهر نفسه.', 'Each country’s latest report is compared with its report roughly one period earlier, since countries do not all report in the same month.')}</p>
    <div class="cols">${rankedList(L('المشترون', 'Buyers'), buyers, 'up', maxAbs, true, nm)}${rankedList(L('البائعون', 'Sellers'), sellers, 'down', maxAbs, true, nm)}</div>`;
  return h;
};

      {label: L('إجمالي المبيعات', 'Gross selling') + (q.g ? ` (${q.g.ns} ${L('دولة', 'countries')})` : ''), v: `<span class="down">${TN(q.sell)}</span>`, sub: KG(q.sell)},

    `<div class="note">${L(`تشمل ${cb.in_total || '?'} دولة متوفرة البيانات منذ بداية السجل.`, `Includes ${cb.in_total || '?'} countries with data since the start of the record.`)}</div>`)}</div>`;
  const rows = countryChanges(p);
  const buyers = rows.filter(r => r.c.d > 0).sort((a, b) => b.c.d - a.c.d).slice(0, 5), sellers = rows.filter(r => r.c.d < 0).sort((a, b) => a.c.d - b.c.d).slice(0, 5);
  const maxAbs = Math.max(1, ...buyers.concat(sellers).map(r => Math.abs(r.c.d)));

};

/* ---------- commercial banks ---------- */
function deliveriesByBank(){
  const daily = (DATA.deliveries || {}).daily || {}, days = Object.keys(daily).sort(), banks = {};
  days.forEach(d => Object.entries(daily[d] || {}).forEach(([raw, acc]) => {
    const b = bankName(raw), rec = ((banks[b] = banks[b] || {})[d] = banks[b][d] || {iss:0, stp:0, H:[0, 0], C:[0, 0]});
    Object.entries(acc).forEach(([org, [i, s]]) => { rec.iss += i; rec.stp += s; if (rec[org]){ rec[org][0] += i; rec[org][1] += s; } });
  }));
  return {days, banks};
}
const star = b => GLOBAL_BANKS.has(b) ? ' ★' : '';

ABOUT.banks = () => [
  [L('ماذا يعرض؟', 'What it shows'), L('ثلاث نوافذ رسمية على نشاط البنوك في الذهب: مراكز Swap Dealers في تقرير COT، وتسليمات الذهب الفعلي في COMEX لكل بنك بالاسم، وحيازات خزائن البنوك في COMEX.',

    'COT comes from the official CFTC API for COMEX Gold (code 088691). Deliveries come from CME’s daily Issues and Stops report (a PDF read automatically); one contract = 100 oz ≈ 3.11 kg. Vaults come from CME’s daily Gold Warehouse Stocks report, depository by depository.')],

R.banks = () => {
  let h = head(L('البنوك التجارية', 'Commercial banks'), '', [], null, '');
  h += about('banks', ABOUT.banks());
  h += chips('bankview', [['cot', 'COT: Swap Dealers'], ['deliv', L('التسليمات حسب البنك', 'Deliveries by bank')], ['vault', L('خزائن البنوك', 'Bank vaults')]], state.bankView);

  if (state.bankView === 'cot'){
    const dis = DATA.cot_disagg || {}, recs = state.cotCat === 'prod' ? dis.prod : dis.swap;
    h += sourceWarn('cot');
    if (!recs || !recs.length) return h + noData();
    h += `<div class="meta">${fresh(last(recs)[0], 10)}</div>`;
    h += chips('cotcat', [['swap', L('Swap Dealers (البنوك الكبرى)', 'Swap Dealers (major banks)')], ['prod', 'Producer/Merchant']], state.cotCat);
    h += reportView('cot-' + state.cotCat, L(`آخر ${WINDOW} تقريرًا أسبوعيًا`, `Last ${WINDOW} weekly reports`), lsModel(recs), ctCfg({
      buy: L('Long (شراء)', 'Long (buy)'), sell: L('Short (بيع)', 'Short (sell)'), line: L('صافي المركز', 'Net position'),
      pctLabel: L('نسبة تغير الصافي', 'Net change %'), deltaLabel: L('دلتا الصافي', 'Net delta'), extra: lsExtra, cells: lsCells(state.cotCat === 'prod')}));
    return h;
  }

  if (state.bankView === 'deliv'){
    h += sourceWarn('deliveries');
    const {days, banks} = deliveriesByBank();
    if (!days.length) return h + `<p class="empty">${L('يُبنى سجل التسليمات يوميًا من أول تشغيل؛ لا توجد أيام مسجلة بعد.', 'The delivery history builds daily from the first run; no days recorded yet.')}</p>`;
    h += `<div class="meta">${fresh(last(days), 6)}</div>`;
    const totals = Object.entries(banks).map(([b, byDay]) => {
      const t = Object.values(byDay).reduce((a, r) => ({iss: a.iss + r.iss, stp: a.stp + r.stp}), {iss:0, stp:0});
      return {b, ...t, vol: t.iss + t.stp};
    }).sort((a, b) => b.vol - a.vol);
    if (!state.bank || !banks[state.bank]) state.bank = totals[0] ? totals[0].b : null;
    h += `<div class="chips">${totals.slice(0, 14).map(t => `<button class="chip-btn" data-act="bank" data-v="${esc(t.b)}" aria-pressed="${t.b === state.bank}"><bdi>${esc(t.b)}</bdi>${star(t.b)}</button>`).join('')}</div>`;
    const byDay = banks[state.bank] || {}, dayTot = {};
    days.forEach(d => { dayTot[d] = Object.values(banks).reduce((a, x) => a + (x[d] ? x[d].iss + x[d].stp : 0), 0); });
    const ser = days.map(d => { const r = byDay[d] || {iss:0, stp:0, H:[0, 0], C:[0, 0]}; return {d, stp: r.stp * CONTRACT_KG, iss: r.iss * CONTRACT_KG, H: r.H, C: r.C}; }).slice(-(WINDOW + 3));
    const pts = ser.map((r, i) => ({d: r.d, buy: r.stp, sell: r.iss, delta: r.stp - r.iss, H: r.H, C: r.C,
      d3: i >= 2 ? ser.slice(i - 2, i + 1).reduce((a, x) => a + x.stp - x.iss, 0) : null,
      pct: dayTot[r.d] ? (r.stp + r.iss) / CONTRACT_KG / dayTot[r.d] * 100 : null})).slice(-WINDOW);
    h += reportView('dl-' + state.bank, `<bdi>${esc(state.bank)}</bdi>: ${L(`آخر ${pts.length} يوم تسليم مسجَّل`, `last ${pts.length} recorded delivery days`)}`, pts, kgCfg({
      buy: L('استلام Stopped (شراء فعلي)', 'Stopped (taking delivery)'), sell: L('تسليم Issued (بيع فعلي)', 'Issued (making delivery)'),
      pctLabel: L('حصته من حجم اليوم', 'Share of the day’s volume'), deltaLabel: L('الصافي (استلام − تسليم)', 'Net (stopped − issued)'),
      extra: q => q.H && (q.H[0] + q.H[1] + q.C[0] + q.C[1]) ? `<div><span>House / Customer</span><b>${bd(nf0.format(q.H[1] - q.H[0]) + ' / ' + nf0.format(q.C[1] - q.C[0]))} ${U.ct()}</b></div>` : '',
      cells: q => [
        {label: L('استلم (Stopped)', 'Stopped'), v: `<span class="up">${KG(q.buy)}</span>`, sub: CT(q.buy / CONTRACT_KG)},
        {label: L('سلّم (Issued)', 'Issued'), v: `<span class="down">${KG(q.sell)}</span>`, sub: CT(q.sell / CONTRACT_KG)},
        {label: L('الصافي', 'Net'), v: `<span class="${cls(q.delta)}">${sKG(q.delta)}</span>`, sub: sCT(q.delta / CONTRACT_KG)},
      ]}));
    const mtd = (DATA.deliveries || {}).mtd || {};
    let rows;
    if (mtd.firms){
      const agg = {};
      Object.entries(mtd.firms).forEach(([raw, acc]) => {
        const b = bankName(raw), e = (agg[b] = agg[b] || {iss:0, stp:0, H:0, C:0});
        Object.entries(acc).forEach(([org, [i, s]]) => { e.iss += i; e.stp += s; e[org] = (e[org] || 0) + s - i; });
      });
      rows = Object.entries(agg).map(([b, e]) => ({b, ...e}));
    } else rows = totals.map(t => ({b: t.b, iss: t.iss, stp: t.stp}));
    rows.sort((a, b) => (b.stp - b.iss) - (a.stp - a.iss));
    h += `<h3 class="rv-title">${mtd.firms ? L(`ترتيب البنوك منذ بداية الشهر (حتى ${fDay.format(toDate(mtd.date))})`, `Banks ranked month to date (to ${fDay.format(toDate(mtd.date))})`) : L('ترتيب البنوك في الأيام المسجلة', 'Banks ranked over the recorded days')}</h3>
      <div class="tablebox"><table><thead><tr><th>${L('البنك', 'Bank')}</th><th class="n">${L('استلم (شراء)', 'Stopped (bought)')}</th><th class="n">${L('سلّم (بيع)', 'Issued (sold)')}</th><th class="n">${L('الصافي', 'Net')}</th><th class="n">House</th><th class="n">Customer</th></tr></thead><tbody>
      ${rows.map(r => { const net = r.stp - r.iss; return `<tr><td><button class="linkish" data-act="bank" data-v="${esc(r.b)}"><bdi>${esc(r.b)}</bdi>${star(r.b)}</button></td>

        <td class="n">${r.H == null ? '—' : sCT(r.H)}</td><td class="n">${r.C == null ? '—' : sCT(r.C)}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="explain">${L('Stopped = استلام ذهب فعلي مقابل العقود (شراء)، وIssued = تسليمه (بيع). House حساب البنك نفسه، وCustomer حسابات عملائه. ★ بنك عالمي.', 'Stopped = taking physical gold against contracts (buying); Issued = delivering it (selling). House is the bank’s own account; Customer is its clients’ accounts. ★ global bank.')}</p>`;
    return h;
  }

  h += sourceWarn('comex');
  const deps = ((DATA.comex || {}).depositories) || {};
  const list = Object.entries(deps).map(([raw, s]) => ({raw, name: bankName(raw), s, l: last(s)})).filter(x => x.l)
    .sort((a, b) => (GLOBAL_BANKS.has(b.name) - GLOBAL_BANKS.has(a.name)) || (b.l[1] + b.l[2]) - (a.l[1] + a.l[2]));
  if (!list.length) return h + `<p class="empty">${L('تفصيل الخزائن يبدأ من أول تحديث بعد تفعيل هذه الميزة.', 'The vault breakdown starts with the first update after this feature was enabled.')}</p>`;
  h += `<div class="meta">${fresh(list[0].l[0], 6)}</div>`;

};

const SIG_CATS = () => {
  const d = DATA.cot_disagg || {};
  return [
    {id:'mm', recs: d.mm || [], type:'spec', name: L('Managed Money (صناديق التحوط)', 'Managed Money (hedge funds)')},
    {id:'nc', recs: DATA.noncomm || [], type:'spec', name: L('Non-Commercial (المضاربون الكبار)', 'Non-Commercial (large speculators)')},
    {id:'swap', recs: d.swap || [], type:'comm', name: L('Swap Dealers (البنوك الكبرى)', 'Swap Dealers (major banks)')},
    {id:'prod', recs: d.prod || [], type:'comm', name: L('Producer/Merchant (المنتجون والتجار)', 'Producer/Merchant (producers and merchants)')},
  ].filter(c => c.recs.length > 10);
};
function cotIndexAt(recs, endIdx, weeks){
  const r = recs.slice(Math.max(0, endIdx - weeks + 1), endIdx + 1), nets = r.map(x => x[1] - x[2]);
  const lo = Math.min(...nets), hi = Math.max(...nets), cur = nets[nets.length - 1];
  return {idx: hi === lo ? 50 : (cur - lo) / (hi - lo) * 100, lo, hi, cur, n: r.length};
}
function sigText(type, v){
  if (v >= 90) return type === 'spec'
    ? [L('تموضع شرائي مزدحم', 'Crowded long'), 'sig-hot', L('المضاربون قرب أعلى صافي شراء لهم منذ 3 سنوات. تاريخيًا يرتفع خطر التصحيح في هذه الحالة، لأن المشترين الجدد قليلون وقد يكون الخروج جماعيًا عند أي خبر سلبي.', 'Speculators are near their largest net long in 3 years. Historically this raises pullback risk: few buyers are left and exits can be crowded on any negative news.')]
    : [L('إشارة إيجابية تاريخيًا', 'Historically bullish'), 'sig-cold', L('هذه الفئة في أقل مستوى تحوط بيعي منذ 3 سنوات. لأنها تبيع عادةً في الارتفاعات وتشتري في الانخفاضات، يُقرأ هذا تاريخيًا إشارة إيجابية للسعر.', 'This group is at its lightest short hedge in 3 years. Because it usually sells into rallies and buys dips, this has historically been read as bullish for price.')];
  if (v <= 10) return type === 'spec'
    ? [L('تموضع بيعي متطرف', 'Extreme short'), 'sig-cold', L('المضاربون قرب أضعف صافي مركز لهم منذ 3 سنوات. تاريخيًا يزيد هذا احتمال ارتداد صاعد عند تغطية المراكز المكشوفة (Short covering).', 'Speculators are near their weakest net position in 3 years. Historically this raises the odds of a rebound as shorts cover.')]
    : [L('إشارة تحذيرية تاريخيًا', 'Historically bearish'), 'sig-hot', L('هذه الفئة في أكبر تحوط بيعي منذ 3 سنوات، أي أنها تبيع الارتفاع بقوة. تاريخيًا يُقرأ هذا تحذيرًا للسعر.', 'This group is at its heaviest short hedge in 3 years, selling into strength. Historically this has been read as a warning for price.')];
  if (v >= 80 || v <= 20) return [L('قريب من التطرف', 'Near an extreme'), 'sig-mid', L('قريب من حدود نطاقه خلال 3 سنوات، دون أن يبلغ منطقة الإشارة بعد.', 'Close to the edge of its 3-year range, but not yet in signal territory.')];
  return [L('نطاق طبيعي', 'Normal range'), 'sig-mid', L('ضمن نطاقه المعتاد خلال 3 سنوات، ولا إشارة تطرف الآن.', 'Within its usual 3-year range; no extreme signal now.')];
}

  const c = scored.find(x => x.id === state.sig), offset = c.recs.length;

function comexGross(){
  const deps = ((DATA.comex || {}).depositories) || {}, g = {};
  Object.values(deps).forEach(s => { for (let i = 1; i < s.length; i++){
    const dv = (s[i][1] + s[i][2]) - (s[i - 1][1] + s[i - 1][2]), e = (g[s[i][0]] = g[s[i][0]] || {buy:0, sell:0});
    if (dv > 0) e.buy += dv; else e.sell -= dv; } });
  return Object.keys(g).length ? g : null;
}

const ETF_INFO = {GLD: 'SPDR Gold Shares', IAU: 'iShares Gold Trust', GLDM: 'SPDR Gold MiniShares'};
function etfSeries(){
  const out = {}, a = DATA.etf || {}, b = DATA.etf2 || {};
  ['GLD', 'IAU', 'GLDM'].forEach(k => { const s = a[k] || b[k]; if (s && s.length) out[k] = s; });

}
function etfTotal(funds){
  const use = Object.keys(funds).filter(k => funds[k].length >= 25), maps = use.map(k => Object.fromEntries(funds[k]));
  if (!use.length) return {use, series: []};
  const dates = funds[use[0]].map(x => x[0]).filter(d => maps.every(m => m[d] != null));
  return {use, series: dates.map(d => [d, maps.reduce((a, m) => a + m[d], 0)])};
}

ABOUT.physical = () => [
  [L('ماذا يعرض؟', 'What it shows'), L('مقياسان لتوتر سوق الذهب الفعلي: (1) فرق سعر عقود COMEX في نيويورك عن سعر لندن الفوري، وهو مؤشر تقريبي لـ EFP. (2) علاوة شنغهاي: فرق سعر الذهب في الصين عن سعر لندن.',
    'Two gauges of stress in the physical gold market: (1) the gap between COMEX futures in New York and the London spot price, an approximate EFP gauge; (2) the Shanghai premium: the gap between the gold price in China and the London price.')],
  [L('طريقة الحساب', 'Method'), L('فرق COMEX = سعر إغلاق العقد الأقرب (GC) − سعر LBMA Gold Price PM. علاوة شنغهاي = سعر Shanghai Gold Benchmark (يوان للغرام) محوَّلًا إلى دولار للأونصة بسعر صرف البنك المركزي الأوروبي − سعر LBMA AM. ونحسب ترتيب القراءة الحالية بين قراءات آخر سنة (الشريحة المئوية).',
    'COMEX gap = front-month futures close (GC) − LBMA Gold Price PM. Shanghai premium = the Shanghai Gold Benchmark (yuan per gram) converted to dollars per ounce at the ECB reference rate − LBMA AM. We also rank today’s reading against the last year (percentile).')],
  [L('كيف تقرؤه؟', 'How to read it'), L('فرق COMEX موجب عادةً بقدر صغير بسبب تكلفة الفائدة حتى استحقاق العقد؛ اتساعه الحاد يعني طلبًا استثنائيًا لنقل الذهب إلى نيويورك أو ضغطًا على البائعين. علاوة شنغهاي الموجبة تعني طلبًا صينيًا قويًا يدفع فوق سعر لندن، والخصم يعني طلبًا محليًا ضعيفًا.',
    'The COMEX gap is normally small and positive because of interest carry until expiry; a sharp widening means unusual demand to move metal to New York or pressure on sellers. A positive Shanghai premium means strong Chinese demand paying above London; a discount means weak local demand.')],
  [L('التحديث والحدود', 'Updates and limits'), L('يومي. الأسعار مأخوذة في أوقات مختلفة من اليوم، لذلك فيها ضجيج يومي بضعة دولارات: اقرأ الاتجاه والقراءات المتطرفة لا يومًا واحدًا. المصادر: LBMA وYahoo Finance (GC=F) وبورصة شنغهاي للذهب وFrankfurter (أسعار صرف البنك المركزي الأوروبي).',
    'Daily. Prices are taken at different times of day, so there is a few dollars of daily noise: read the trend and the extremes, not a single day. Sources: LBMA, Yahoo Finance (GC=F), the Shanghai Gold Exchange and Frankfurter (ECB exchange rates).')],
];
R.physical = () => {
  const ph = DATA.physical || {};
  const avail = [['efp', L('فرق COMEX عن لندن (EFP)', 'COMEX vs London (EFP)')], ['sh', L('علاوة شنغهاي', 'Shanghai premium')]].filter(([k]) => (ph[k] || []).length);
  let h = head(L('السوق الفعلي: EFP وعلاوة شنغهاي', 'Physical market: EFP and Shanghai premium'), '', [L('يومي', 'Daily'), '$/oz'], 'physical',
    avail.length ? fresh(last(ph[avail[0][0]])[0], 6) : '');
  h += about('physical', ABOUT.physical());
  if (!avail.length) return h + noData();
  if (!avail.find(a => a[0] === state.phys)) state.phys = avail[0][0];
  h += chips('phys', avail, state.phys);
  const rows = ph[state.phys], isE = state.phys === 'efp', vals = rows.slice(-250).map(r => r[1]);
  const lr = last(rows), pr = pctRank(vals, lr[1]);
  const aName = isE ? 'COMEX (GC)' : L('شنغهاي', 'Shanghai'), bName = isE ? 'LBMA PM' : 'LBMA AM';
  let verdict;
  if (pr >= 90) verdict = isE ? L('الفرق في أعلى 10% من مستوياته خلال سنة: طلب غير عادي على الذهب في نيويورك أو ضغط على المراكز المكشوفة.', 'The gap is in the top 10% of its one-year range: unusual demand for metal in New York or pressure on short positions.')
    : L('العلاوة في أعلى 10% من مستوياتها خلال سنة: طلب صيني قوي على الذهب الفعلي.', 'The premium is in the top 10% of its one-year range: strong Chinese demand for physical gold.');
  else if (pr <= 10) verdict = isE ? L('الفرق في أدنى 10% من مستوياته خلال سنة: سوق نيويورك هادئة أو فائض في المعروض.', 'The gap is in the bottom 10% of its one-year range: a calm New York market or ample supply.')
    : L('العلاوة في أدنى 10% من مستوياتها خلال سنة: طلب صيني ضعيف أو بيع محلي.', 'The premium is in the bottom 10% of its one-year range: weak Chinese demand or local selling.');
  else verdict = L('القراءة ضمن نطاقها المعتاد خلال سنة.', 'The reading is within its usual one-year range.');
  h += `<div class="brief"><h3>${L('القراءة الحالية', 'Current reading')}: ${sUSD(lr[1])} / oz</h3><p>${L('الشريحة المئوية خلال سنة', 'One-year percentile')}: <b>${pr == null ? '—' : bd(nf0.format(pr))}</b>. ${verdict}</p></div>`;
  const pts = spreadModel(rows).map(q => ({...q, pr: pctRank(rows.filter(r => r[0] <= q.d).slice(-250).map(r => r[1]), q.line)}));
  h += reportView('phys-' + state.phys, L(`آخر ${WINDOW} يوم تداول`, `Last ${WINDOW} trading days`), pts, {
    fmt: USD, sfmt: sUSD, buy: L('علاوة (موجب)', 'Premium (positive)'), sell: L('خصم (سالب)', 'Discount (negative)'), line: L('الفرق', 'Spread'),
    panel: (q, row) => row(L('الفرق', 'Spread'), sUSD(q.line), q.line >= 0 ? 'up' : 'down') + row(aName, USD(q.a), '') + row(bName, USD(q.b), '')
      + row(L('نسبة الفرق', 'Spread %'), sPCT(q.pct), 'ink') + row(L('الدلتا', 'Delta'), sUSD(q.delta), 'orange')
      + row(L('دلتا آخر 3 تقارير', 'Delta, last 3 reports'), q.d3 == null ? '—' : sUSD(q.d3), q.d3 >= 0 ? 'blue' : 'down')
      + row(L('الشريحة المئوية (سنة)', 'Percentile (1y)'), q.pr == null ? '—' : bd(nf0.format(q.pr)), ''),
    cells: q => [
      {label: L('الفرق', 'Spread'), v: `<span class="${cls(q.line)}">${sUSD(q.line)}</span>`, sub: `${sPCT(q.pct)} ${L('من سعر لندن', 'of the London price')}`},
      {label: `${aName} / ${bName}`, v: USD(q.a), sub: USD(q.b)},
      {label: L('الشريحة المئوية (سنة)', 'Percentile (1 year)'), v: q.pr == null ? '—' : bd(nf0.format(q.pr)), sub: `${L('الدلتا', 'Delta')}: <span class="orange">${sUSD(q.delta)}</span>`},
    ]});
  if ((ph.errors || []).length) h += `<p class="explain">${L('ملاحظة المصدر', 'Source note')}: <bdi dir="ltr">${esc(ph.errors.join(' | ').slice(0, 200))}</bdi></p>`;
  return h;
};

/* ================= shell ================= */
const TABS = () => [
  ['countries', L('الدول', 'Countries')], ['cb', L('البنوك المركزية', 'Central banks')], ['banks', L('البنوك التجارية', 'Commercial banks')],
  ['noncomm', 'COT Non-Commercial'], ['signals', L('إشارات COT', 'COT signals')], ['f13', L('المؤسسات (13F)', 'Institutions (13F)')],
  ['comex', 'COMEX'], ['etf', L('صناديق ETF', 'Gold ETFs')], ['physical', L('السوق الفعلي', 'Physical market')],
];
TABS().forEach(([id]) => { state.mode[id] = 'stock'; state.period[id] = 'm'; });
state.aboutClosed = {};

function renderTop(){
  document.getElementById('lang').innerHTML = [['ar', 'sa', 'العربية'], ['en', 'gb', 'English']].map(([k, f, t]) =>
    `<button data-act="lang" data-v="${k}" aria-pressed="${state.lang === k}" lang="${k}"><img src="https://flagcdn.com/w40/${f}.png" alt="" width="20" height="14">${t}</button>`).join('');
  document.getElementById('title').textContent = L('تدفقات الذهب', 'Gold Flows');
  document.title = L('تدفقات الذهب', 'Gold Flows');
  document.getElementById('foot').innerHTML = L(
    'المصادر: IMF IRFCL، وCFTC COT (Legacy وDisaggregated)، وCME (مخزون COMEX وتقرير Issues and Stops)، وSPDR وiShares، وSEC Form 13F، وLBMA، وبورصة شنغهاي للذهب، وYahoo Finance، وFrankfurter. تُحدَّث البيانات تلقائيًا عبر GitHub Actions ثلاث مرات يوميًا في أيام العمل ومرة يوم السبت.',
    'Sources: IMF IRFCL, CFTC COT (Legacy and Disaggregated), CME (COMEX vault stocks and the Issues and Stops report), SPDR and iShares, SEC Form 13F, LBMA, the Shanghai Gold Exchange, Yahoo Finance and Frankfurter. Data updates automatically via GitHub Actions three times a day on weekdays and once on Saturday.');
}

function renderMast(){
  if (!DATA) return;
  const cb = DATA.central_banks, l = cb && last(cb.series || []);
  const gld = DATA.etf && last(DATA.etf.GLD || []), com = DATA.comex && last(DATA.comex.total || []);
  const parts = [];
  if (l) parts.push(`<span><b>${bd(nf0.format(l[1] / 1000))}</b>${L('طن لدى البنوك المركزية المُبلِّغة', 't held by reporting central banks')}</span>`);
  if (com) parts.push(`<span><b>${bd(nf0.format(com[1] / 1000))}</b>${L('طن في COMEX', 't in COMEX vaults')}</span>`);
  if (gld) parts.push(`<span><b>${bd(nf0.format(gld[1] / 1000))}</b>${L('طن في GLD', 't in GLD')}</span>`);
  document.getElementById('assay').innerHTML = parts.join('') || L('لا توجد بيانات بعد', 'No data yet');
  let up = '';
  if (DATA.generated_utc){
    const g = new Date(DATA.generated_utc), age = (Date.now() - g.getTime()) / 864e5;
    up = `${L('آخر تشغيل للتحديث التلقائي', 'Last automatic update')}: ${fStamp.format(g)}`;
    if (age > 3) up += ` <span class="fresh stale">${L(`التحديث التلقائي متوقف منذ ${Math.floor(age)} أيام؛ افتح تبويب Actions في GitHub.`, `Automatic updates have not run for ${Math.floor(age)} days; check the Actions tab on GitHub.`)}</span>`;
    else up += ` <span class="fresh ok">${L('التحديث التلقائي يعمل ✓', 'Automatic updates running ✓')}</span>`;
  }
  document.getElementById('updated').innerHTML = up;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS().map(([id, t]) =>
    `<button class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${id === state.tab}">${t}</button>`).join('');
}

function render(){
  renderTabs();
  document.getElementById('view').innerHTML = DATA ? R[state.tab]() : '';
}

function applyLang(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = isAr() ? 'rtl' : 'ltr';
  try { regionNames = new Intl.DisplayNames([state.lang], {type:'region'}); } catch (e) { regionNames = null; }
  setFormatters();
  renderTop();
  renderMast();
  render();
}

const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'lang'){
    state.lang = v;
    try { localStorage.setItem('gold-lang', v); } catch (err) {}
    const u = new URL(location.href); u.searchParams.delete('lang'); history.replaceState(null, '', u.pathname + u.hash);
    const y = window.scrollY; applyLang(); window.scrollTo(0, y);
    return;
  }
  if (!DATA) return;
  if (act === 'tab'){ state.tab = v; state.all = false; history.replaceState(null, '', location.pathname + location.search + '#' + v); render();
    document.getElementById('tabs').scrollIntoView({block:'nearest'}); return; }
  if (act === 'mode') state.mode[state.tab] = v;
  else if (act === 'period') state.period[state.tab] = v;
  else if (act === 'all') state.all = !state.all;
  else if (act === 'sel') state.sel[b.dataset.rv] = +b.dataset.i;
  else if (act === 'country-go') state.country = v;
  else if (act === 'bankview') state.bankView = v;
  else if (act === 'cotcat') state.cotCat = v;
  else if (act === 'bank'){ state.bank = v; state.bankView = 'deliv'; }
  else if (act === 'vault') state.vault = v;
  else if (act === 'mgr') state.mgr = v;
  else if (act === 'sig') state.sig = v;
  else if (act === 'etffund') state.etfFund = v;
  else if (act === 'phys') state.phys = v;
  rerender();
  if (act === 'country-go'){ const el = document.getElementById('country-pick'); if (el) el.scrollIntoView({block:'center'}); }
  if (act === 'mgr'){ const el = document.getElementById('mgr-anchor'); if (el) el.scrollIntoView({block:'start'}); }
});

document.addEventListener('click', e => {
  const r = e.target.closest('rect.hit');
  if (!r || !DATA) return;
  state.sel[r.dataset.rv] = +r.dataset.i;
  rerender();
  showTip(document.querySelector(`rect.hit[data-rv="${CSS.escape(r.dataset.rv)}"][data-i="${r.dataset.i}"]`));
});

document.addEventListener('change', e => {
  const a = e.target.dataset.act;
  if (a === 'mgr-pick'){ state.mgr = e.target.value; rerender(); }
  if (a === 'country'){ state.country = e.target.value; rerender(); }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.about')) state.aboutClosed[d.dataset.about] = !d.open;
}, true);

function showTip(r){
  if (!r) return;
  const plot = r.closest('.rv-plot'), tt = plot && plot.querySelector('.tt');
  if (!tt) return;
  tt.innerHTML = panelHTML(r.dataset.rv, +r.dataset.i);
  tt.hidden = false;
  const pb = plot.getBoundingClientRect(), rb = r.getBoundingClientRect();
  const cx = rb.left + rb.width / 2 - pb.left, tw = tt.offsetWidth;
  let left = cx + 12;
  if (left + tw > pb.width) left = cx - tw - 12;
  tt.style.left = Math.max(0, left) + 'px';
  plot.querySelectorAll('rect.hover').forEach(x => x.classList.remove('hover'));
  r.classList.add('hover');
}
document.addEventListener('mouseover', e => { const r = e.target.closest && e.target.closest('rect.hit'); if (r) showTip(r); });
document.addEventListener('mouseout', e => {
  const plot = e.target.closest && e.target.closest('.rv-plot');
  if (plot && !plot.contains(e.relatedTarget)){ const tt = plot.querySelector('.tt'); if (tt) tt.hidden = true; }
});

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (TABS().some(([id]) => id === h) && h !== state.tab){ state.tab = h; render(); }
});

(async () => {
  const fromHash = location.hash.slice(1);
  if (TABS().some(([id]) => id === fromHash)) state.tab = fromHash;
  applyLang();
  try {
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    renderMast();
    render();
  } catch (err){
    document.getElementById('assay').textContent = L('لم يُعثر على البيانات', 'Data not found');
    document.getElementById('view').innerHTML = `<p class="warn">${L('تعذّر قراءة الملف data.json', 'Could not read data.json')} (${esc(err.message)}). ${L('إذا كان هذا أول تشغيل، افتح تبويب Actions في GitHub، شغّل «تحديث بيانات الذهب»، وانتظر حتى ينتهي ثم أعد تحميل الصفحة.', 'If this is the first run, open the Actions tab on GitHub, run the update workflow, wait for it to finish, then reload the page.')}</p>`;
  }
})();

</script>
</body>
</html>

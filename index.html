<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تدفقات الذهب</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBE9; --surface:#F5F6F4; --ink:#18232B; --muted:#56646C; --rule:#C7CEC9;
  --metal:#8E661C; --metal-hi:#D9B35E; --metal-lo:#9C7428; --ingot-ink:#2A1E07;
  --buy:#1F7049; --sell:#A93A26; --alt:#3D6C8C; --orange:#C2620A; --blue:#2458C6;
  --kufi:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131B21; --surface:#1B252C; --ink:#E4E7E3; --muted:#93A1A8; --rule:#2C3940;
    --metal:#D8AB4F; --metal-hi:#E2BE6E; --metal-lo:#8A6421; --ingot-ink:#1E1505;
    --buy:#4DB383; --sell:#E2735B; --alt:#7FB0D1; --orange:#F0A04B; --blue:#7FA8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B21; --surface:#1B252C; --ink:#E4E7E3; --muted:#93A1A8; --rule:#2C3940;
  --metal:#D8AB4F; --metal-hi:#E2BE6E; --metal-lo:#8A6421; --ingot-ink:#1E1505;
  --buy:#4DB383; --sell:#E2735B; --alt:#7FB0D1; --orange:#F0A04B; --blue:#7FA8FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--metal);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* masthead: the stamped ingot */
.masthead{padding:28px 0 18px}
.ingot{position:relative;padding:22px 28px 20px;color:var(--ingot-ink);
  background:linear-gradient(170deg,var(--metal-hi) 0%,#C99A3E 45%,var(--metal-lo) 100%);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);}
.ingot::after{content:"";position:absolute;inset:7px 3.5% 7px;border:1px solid rgba(42,30,7,.35);
  clip-path:polygon(1.5% 0,98.5% 0,100% 100%,0 100%);pointer-events:none}
.ingot h1{font-family:var(--kufi);font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0}
.ingot .assay{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:8px;font-size:15px}
.ingot .assay b{font-family:var(--kufi);font-size:clamp(22px,4.6vw,30px);font-weight:700;margin-inline-end:6px}
.updated{margin:10px 2px 0;color:var(--muted);font-size:14px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--rule);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:12px 14px 10px;cursor:pointer;color:var(--muted);
  border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--metal)}

/* section */
main{padding:22px 0 40px}
.sec-head h2{font-family:var(--kufi);font-weight:500;font-size:26px;margin:0 0 4px}
.sec-head p{margin:0;color:var(--muted);max-width:68ch;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-size:13px;padding:2px 10px;border:1px solid var(--rule);border-radius:99px;color:var(--muted)}
.warn{overflow-wrap:anywhere;margin:14px 0 0;padding:10px 14px;border-inline-start:3px solid var(--sell);background:var(--surface);font-size:14px}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-size:15px}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:18px}
.fig{background:var(--surface);padding:14px 16px}
.fig h3{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.fig .v{font-family:var(--kufi);font-size:30px;font-weight:700;line-height:1.25;margin-top:2px}
.fig .sub{font-size:14px;color:var(--muted)}
.fig .note{font-size:13px;color:var(--muted);margin-top:6px}
.chg{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:8px}
.chg b{font-size:18px}
.chg em{font-style:normal;font-size:13px;padding:0 8px;border-radius:4px}
.up{color:var(--buy)} .down{color:var(--sell)} .flat,.na{color:var(--muted)}
.up em{background:color-mix(in srgb,var(--buy) 14%,transparent)}
.down em{background:color-mix(in srgb,var(--sell) 14%,transparent)}
.since{display:block;font-size:13px;color:var(--muted)}

/* charts */
.chartbox{margin:0 0 18px;background:var(--surface);border:1px solid var(--rule);padding:12px 12px 6px}
.chartbox h4{margin:0 0 6px;font-size:14px;font-weight:500;color:var(--muted)}
.chart{display:block;width:100%;height:170px;direction:ltr}
.chart .area{fill:var(--metal);opacity:.13}
.chart .l-main{fill:none;stroke:var(--metal);stroke-width:2}
.chart .l-alt{fill:none;stroke:var(--alt);stroke-width:2}
.chart .zero{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.chart .b-up{fill:var(--buy)} .chart .b-down{fill:var(--sell)}
.chartbox figcaption{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);padding-top:4px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-inline-end:5px}

/* tables & ranked lists */
.tablebox{overflow-x:auto;border:1px solid var(--rule);background:var(--surface);margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13.5px;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:end}
tr:last-child td{border-bottom:0}
.rank{color:var(--muted);width:2.5em}
.more{border:1px solid var(--rule);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;margin:4px 0 18px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}
.ranked h3{font-size:16px;margin:0 0 8px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(90px,8.5em) 1fr auto;gap:4px 10px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.row .track{height:10px;background:color-mix(in srgb,var(--muted) 12%,transparent)}
.row .bar{height:100%}
.row .bar.up{background:var(--buy)} .row .bar.down{background:var(--sell)}
.row .val{text-align:end}
.row .det{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0;margin:0}
.explain{color:var(--muted);font-size:14px;max-width:72ch;margin:0 0 10px}

/* report viewer */
.rv{background:var(--surface);border:1px solid var(--rule);padding:14px 14px 12px;margin:0 0 20px}
.rv-title{font-size:16px;font-weight:600;margin:0 0 6px}
.rv-plot{position:relative;direction:ltr}
.rvc{display:block;width:100%;height:230px}
.rvc .b-up{fill:var(--buy)} .rvc .b-down{fill:var(--sell)}
.rvc .zero{stroke:var(--muted);stroke-width:1}
.rvc .l-net{fill:none;stroke:var(--ink);stroke-width:2}
.rvc .hit{fill:transparent;cursor:pointer}
.rvc .hit.hover{fill:color-mix(in srgb,var(--ink) 7%,transparent)}
.rvc .selcol{fill:color-mix(in srgb,var(--metal) 18%,transparent)}
.ticks{display:flex;font-size:11.5px;color:var(--muted);padding-top:4px}
.ticks span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.tt{position:absolute;top:8px;z-index:3;direction:rtl;min-width:230px;max-width:290px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);box-shadow:0 6px 18px rgba(0,0,0,.18);padding:8px 10px;font-size:13px;pointer-events:none}
.tt-d{font-weight:600;margin-bottom:4px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.tt div:not(.tt-d){display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.tt .ink{color:var(--ink)} .orange{color:var(--orange)} .blue{color:var(--blue)}
.rv-bottom{display:grid;grid-template-columns:1fr 230px;gap:14px;margin-top:12px}
.rv-sel{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.cell{background:var(--bg);padding:10px 12px}
.cell h4{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.cell .cv{font-family:var(--kufi);font-size:20px;font-weight:700;line-height:1.35}
.cell .cs{font-size:12.5px;color:var(--muted)}
.rv-list{max-height:250px;overflow-y:auto;border:1px solid var(--rule);background:var(--bg)}
.rep{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 10px;cursor:pointer;font-size:13px;text-align:start}
.rep[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rep[aria-pressed="true"] .up,.rep[aria-pressed="true"] .down,.rep[aria-pressed="true"] .flat{color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip-btn{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.picker select{font:inherit;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:8px}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;font:inherit}
@media (max-width:720px){
  .rv-bottom{grid-template-columns:1fr}
  .rv-list{display:flex;max-height:none;overflow-x:auto;overflow-y:hidden}
  .rep{flex:none;width:auto;flex-direction:column;border-bottom:0;border-inline-end:1px solid var(--rule)}
  .cells{grid-template-columns:1fr}
  .tt{min-width:200px}
}

/* 13F dossier */
.dossier{border:1px solid var(--metal-lo);background:var(--surface);margin:22px 0 22px}
.dossier-head{display:flex;gap:16px;align-items:center;padding:16px 18px;color:var(--ingot-ink);
  background:linear-gradient(170deg,var(--metal-hi) 0%,#C99A3E 55%,var(--metal-lo) 100%)}
.dossier-head h2{font-family:var(--kufi);font-size:24px;font-weight:700;margin:0;line-height:1.25}
.dossier-head p{margin:2px 0 0;font-size:15px}
.stamp{font-family:var(--kufi);font-weight:700;font-size:26px;border:2px solid var(--ingot-ink);padding:4px 12px;line-height:1.1;flex:none;direction:ltr}
.dossier-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 28px;padding:8px 18px 14px}
.dossier-body h3{font-size:16px;margin:12px 0 4px}
.dossier-body p{margin:0 0 6px;font-size:14.5px;max-width:70ch}
.legend-list{list-style:none;padding:0;margin:0 0 6px;font-size:14.5px}
.legend-list li{margin:4px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.st-new{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.st-up{background:color-mix(in srgb,var(--buy) 16%,transparent);color:var(--buy)}
.st-down{background:color-mix(in srgb,var(--sell) 14%,transparent);color:var(--sell)}
.st-closed{background:var(--sell);color:#fff}
.st-same{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.ranked.wide .row{grid-template-columns:minmax(150px,15em) 1fr auto}
.brief{border-inline-start:4px solid var(--metal);background:var(--surface);padding:12px 16px;margin:0 0 16px}
.brief h3{margin:0 0 6px;font-size:17px}
.brief p{margin:0 0 6px;max-width:80ch;font-size:15px}
.note-warn{color:var(--sell);font-size:13.5px}
footer{border-top:1px solid var(--rule);color:var(--muted);font-size:13px;padding:18px 0 30px}
footer a{color:inherit}
@media (max-width:520px){
  .fig .v{font-size:26px}
  .ingot{padding:18px 20px 16px}
}
@media (prefers-reduced-motion:no-preference){
  .ingot{animation:strike .6s ease-out both}
  @keyframes strike{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<header class="wrap masthead">
  <div class="ingot">
    <h1>تدفقات الذهب</h1>
    <div class="assay" id="assay">جارٍ تحميل البيانات…</div>
  </div>
  <p class="updated" id="updated"></p>
</header>

<nav class="tabs wrap" role="tablist" aria-label="الأقسام" id="tabs"></nav>
<main class="wrap" id="view" aria-live="polite"></main>

<footer class="wrap">
  المصادر: IMF IRFCL للحيازات الرسمية، CFTC COT (Legacy وDisaggregated)، CME لمخزون COMEX وتقرير Issues and Stops، SPDR لصندوق GLD، وSEC Form 13F لحيازات المؤسسات.
  تُحدَّث البيانات تلقائيًا عبر GitHub Actions، وكل قسم يعرض تاريخ آخر قراءة رسمية له.
</footer>

<script>
'use strict';
const PERIODS = {m:{days:30,label:'شهر',since:'شهر'}, q:{days:91,label:'ربع سنة',since:'ربع سنة'}, y:{days:365,label:'سنة',since:'سنة'}};
const TABS = [
  {id:'countries', label:'الدول'},
  {id:'cb', label:'البنوك المركزية'},
  {id:'banks', label:'البنوك التجارية'},
  {id:'noncomm', label:'COT Non-Commercial'},
  {id:'f13', label:'المؤسسات (13F)'},
  {id:'comex', label:'COMEX'},
  {id:'etf', label:'صناديق ETF'},
];
const NAMES = {USA:'الولايات المتحدة',DEU:'ألمانيا',ITA:'إيطاليا',FRA:'فرنسا',RUS:'روسيا',CHN:'الصين',CHE:'سويسرا',JPN:'اليابان',
IND:'الهند',NLD:'هولندا',TUR:'تركيا',PRT:'البرتغال',POL:'بولندا',UZB:'أوزبكستان',SAU:'السعودية',GBR:'المملكة المتحدة',KAZ:'كازاخستان',
ESP:'إسبانيا',AUT:'النمسا',THA:'تايلاند',SGP:'سنغافورة',BEL:'بلجيكا',DZA:'الجزائر',PHL:'الفلبين',VEN:'فنزويلا',IRQ:'العراق',
BRA:'البرازيل',EGY:'مصر',SWE:'السويد',ZAF:'جنوب أفريقيا',MEX:'المكسيك',LBY:'ليبيا',GRC:'اليونان',KOR:'كوريا الجنوبية',ROU:'رومانيا',
HUN:'المجر',AUS:'أستراليا',KWT:'الكويت',IDN:'إندونيسيا',DNK:'الدنمارك',PAK:'باكستان',ARG:'الأرجنتين',BLR:'بيلاروسيا',FIN:'فنلندا',
QAT:'قطر',BGR:'بلغاريا',JOR:'الأردن',MYS:'ماليزيا',CZE:'التشيك',SRB:'صربيا',PER:'بيرو',SVK:'سلوفاكيا',UKR:'أوكرانيا',ARE:'الإمارات',
OMN:'عُمان',BHR:'البحرين',LBN:'لبنان',MAR:'المغرب',TUN:'تونس',SYR:'سوريا',CAN:'كندا',NOR:'النرويج',IRL:'أيرلندا',ISR:'إسرائيل',
LUX:'لوكسمبورغ',IRN:'إيران',KGZ:'قيرغيزستان',TJK:'طاجيكستان',MNG:'منغوليا',GHA:'غانا',NGA:'نيجيريا',COL:'كولومبيا',CHL:'تشيلي',
ECU:'الإكوادور',BOL:'بوليفيا',HRV:'كرواتيا',SVN:'سلوفينيا',LTU:'ليتوانيا',LVA:'لاتفيا',EST:'إستونيا',CYP:'قبرص',MLT:'مالطا',
ISL:'آيسلندا',NZL:'نيوزيلندا',VNM:'فيتنام',BGD:'بنغلاديش',LKA:'سريلانكا',MMR:'ميانمار',KHM:'كمبوديا',AZE:'أذربيجان',ARM:'أرمينيا',
GEO:'جورجيا',MKD:'مقدونيا الشمالية',ALB:'ألبانيا',BIH:'البوسنة والهرسك',MDA:'مولدوفا',URY:'الأوروغواي',PRY:'باراغواي',GTM:'غواتيمالا',
DOM:'الدومينيكان',SLV:'السلفادور',HKG:'هونغ كونغ',MUS:'موريشيوس',KEN:'كينيا',SDN:'السودان',MOZ:'موزمبيق',CUW:'كوراساو',ABW:'أروبا',
AGO:'أنغولا',CRI:'كوستاريكا',HND:'هندوراس',NIC:'نيكاراغوا',PAN:'بنما',JAM:'جامايكا',TTO:'ترينيداد وتوباغو',BRB:'باربادوس',
SUR:'سورينام',GUY:'غيانا',HTI:'هايتي',MWI:'مالاوي',ZMB:'زامبيا',ZWE:'زيمبابوي',UGA:'أوغندا',TZA:'تنزانيا',RWA:'رواندا',
MDG:'مدغشقر',BWA:'بوتسوانا',NAM:'ناميبيا',SEN:'السنغال',CIV:'ساحل العاج',CMR:'الكاميرون',MLI:'مالي',BFA:'بوركينا فاسو',
MRT:'موريتانيا',YEM:'اليمن',AFG:'أفغانستان',NPL:'نيبال',LAO:'لاوس',PNG:'بابوا غينيا الجديدة',FJI:'فيجي',BRN:'بروناي',MAC:'ماكاو',
CUB:'كوبا',PRK:'كوريا الشمالية',TWN:'تايوان',TKM:'تركمانستان',MNE:'الجبل الأسود',XKX:'كوسوفو',ETH:'إثيوبيا'};

const CONTRACT_KG = 100 * 0.0311034768;
const state = {tab:'countries', mode:{}, period:{}, all:false, sel:{}, country:null, bankView:'cot', cotCat:'swap', bank:null, vault:null, mgr:null};
TABS.forEach(t => { state.mode[t.id] = 'stock'; state.period[t.id] = 'm'; });
let DATA = null;

/* ---------- formatting ---------- */
const nf0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fMonth = new Intl.DateTimeFormat('ar-u-nu-latn',{month:'long',year:'numeric',timeZone:'UTC'});
const fDay = new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const fStamp = new Intl.DateTimeFormat('ar-u-nu-latn',{dateStyle:'medium',timeStyle:'short'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDate = s => new Date(s + 'T00:00:00Z');
const sg = v => v > 0 ? '+' : v < 0 ? '−' : '';
const bd = s => `<bdi dir="ltr">${s}</bdi>`;

const TN = v => `${bd((v < 0 ? '−' : '') + nf1.format(Math.abs(v) / 1000))} طن`;

/* ---------- math ---------- */
function last(s){ return s && s.length ? s[s.length - 1] : null; }

/* compare the latest reading with the reading closest to (latest − days) */
function change(s, days){
  if (!s || s.length < 2) return null;
  const end = last(s), endT = toDate(end[0]).getTime();
  const target = endT - days * 864e5;
  let best = null, bestGap = Infinity;
  for (let i = 0; i < s.length - 1; i++){
    const gap = Math.abs(toDate(s[i][0]).getTime() - target);
    if (gap < bestGap){ bestGap = gap; best = s[i]; }
  }
  if (!best || bestGap > days * 864e5 * 0.5) return null;
  const d = end[1] - best[1];
  return {from: best, to: end, d, pct: best[1] ? d / Math.abs(best[1]) * 100 : null};
}

/* ---------- small renderers ---------- */
function sourceWarn(src){
  const s = DATA.sources && DATA.sources[src];
  if (!s || s.ok) return '';
  const when = s.last_ok ? ` بتاريخ ${fDay.format(new Date(s.last_ok))}` : '';
  return `<p class="warn">تعذّر جلب هذا المصدر في آخر تشغيل: <bdi dir="ltr">${esc((s.error || 'خطأ غير معروف').slice(0, 140))}</bdi>. المعروض هو آخر بيانات ناجحة${when}.</p>`;
}

/* ---------- 20-report viewer (chart + hover panel + table + report list) ---------- */
const WINDOW = 20;
const RVM = {};
const fShort = new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'numeric',timeZone:'UTC'});
const fShortM = new Intl.DateTimeFormat('ar-u-nu-latn',{month:'short',year:'2-digit',timeZone:'UTC'});
const dm = d => { const t = toDate(d); return `${t.getUTCDate()}/${t.getUTCMonth() + 1}`; };
const CT = v => `${bd(nf0.format(v))} عقد`;
const sCT = v => `${bd(sg(v) + nf0.format(Math.abs(v)))} عقد`;
const KG_PER_CT = CONTRACT_KG;

function flowModel(series, gross){
  const s = (series || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < s.length; i++){
    const [d, v] = s[i], prev = s[i - 1][1], delta = v - prev, g = gross && gross[d];
    pts.push({d, line:v, delta, pct: prev ? delta / Math.abs(prev) * 100 : null,
      d3: i >= 3 ? v - s[i - 3][1] : null,
      buy: g ? g.buy : Math.max(delta, 0), sell: g ? g.sell : Math.max(-delta, 0), g});
  }
  return pts.slice(-WINDOW);
}

function lsModel(recs){
  const r = (recs || []).slice(-(WINDOW + 4)), pts = [];
  for (let i = 1; i < r.length; i++){
    const [d, l, s, sp] = r[i], [, pl, ps, psp] = r[i - 1];
    const net = l - s, pnet = pl - ps, delta = net - pnet;
    pts.push({d, buy:l, sell:s, line:net, delta, pct: pnet ? delta / Math.abs(pnet) * 100 : null,
      d3: i >= 3 ? net - (r[i - 3][1] - r[i - 3][2]) : null,
      dl: l - pl, ds: s - ps, sp: sp || 0, dsp: (sp || 0) - (psp || 0), rec: r[i]});
  }
  return pts.slice(-WINDOW);
}

function rvSel(id, pts){
  let i = state.sel[id];
  if (i == null || i >= pts.length) i = pts.length - 1;
  return i;
}

function reportView(id, title, pts, cfg){
  if (!pts.length) return `<div class="rv"><h3 class="rv-title">${title}</h3><p class="empty">${cfg.empty || 'لا تكفي التقارير لرسم المخطط بعد؛ يكتمل مع التحديثات القادمة.'}</p></div>`;
  RVM[id] = {pts, cfg};
  const si = rvSel(id, pts), p = pts[si], n = pts.length;
  const W = 640, H = 230, T = 10, B = 10, ph = H - T - B, cw = W / n;
  const mu = Math.max(1, ...pts.map(q => q.buy)), md = Math.max(1, ...pts.map(q => q.sell));
  const sc = ph / (mu + md), zy = T + mu * sc;
  let svg = `<svg class="rvc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  svg += `<rect class="selcol" x="${(si * cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}"/>`;
  pts.forEach((q, i) => {
    const x = (i * cw + cw * .2).toFixed(1), w = (cw * .6).toFixed(1);
    if (q.buy > 0) svg += `<rect class="b-up" x="${x}" y="${(zy - q.buy * sc).toFixed(1)}" width="${w}" height="${Math.max(1, q.buy * sc).toFixed(1)}"/>`;
    if (q.sell > 0) svg += `<rect class="b-down" x="${x}" y="${zy.toFixed(1)}" width="${w}" height="${Math.max(1, q.sell * sc).toFixed(1)}"/>`;
  });
  svg += `<line class="zero" x1="0" x2="${W}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" vector-effect="non-scaling-stroke"/>`;
  if (cfg.line){
    const lv = pts.map(q => q.line); let lo = Math.min(...lv), hi = Math.max(...lv);
    if (lo === hi){ lo -= 1; hi += 1; }
    const Y = v => T + 8 + (hi - v) / (hi - lo) * (ph - 16);
    const xy = pts.map((q, i) => `${((i + .5) * cw).toFixed(1)},${Y(q.line).toFixed(1)}`);
    svg += `<polyline class="l-net" points="${xy.join(' ')}" vector-effect="non-scaling-stroke"/>`;
  }
  pts.forEach((q, i) => { svg += `<rect class="hit" data-rv="${id}" data-i="${i}" x="${(i * cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}"/>`; });
  svg += '</svg>';
  const monthly = cfg.monthly;
  const step = n > 12 ? 4 : n > 6 ? 2 : 1;
  const ticks = pts.map((q, i) => `<span>${(i % step === (n - 1) % step) ? (monthly ? fShortM.format(toDate(q.d)) : dm(q.d)) : ''}</span>`).join('');
  const legend = `<div class="legend"><span><i style="background:var(--buy)"></i>${cfg.buy}</span><span><i style="background:var(--sell)"></i>${cfg.sell}</span>${cfg.line ? `<span><i style="background:var(--ink)"></i>${cfg.line}</span>` : ''}</div>`;
  const cells = cfg.cells(p, si, pts).map(c => `<div class="cell"><h4>${c.label}</h4><div class="cv">${c.v}</div><div class="cs">${c.sub || ''}</div></div>`).join('');
  const list = pts.map((q, i) => ({q, i})).reverse().map(({q, i}) => {
    const cls = q.delta > 0 ? 'up' : q.delta < 0 ? 'down' : 'flat';
    return `<button class="rep" data-act="sel" data-rv="${id}" data-i="${i}" aria-pressed="${i === si}">
      <span>${fmtD(q.d, monthly)}</span><span class="${cls}">${cfg.sfmt(q.delta)}</span></button>`;
  }).join('');
  return `<div class="rv" id="rv-${id}">
    <h3 class="rv-title">${title}</h3>${legend}
    <div class="rv-plot">${svg}<div class="ticks">${ticks}</div><div class="tt" hidden></div></div>
    <div class="rv-bottom">
      <div><div class="rv-sel">التقرير المختار: <b>${fmtD(p.d, monthly)}</b></div><div class="cells">${cells}</div></div>
      <div class="rv-list" aria-label="آخر ${n} تقريرًا">${list}</div>
    </div></div>`;
}

const BANK_RULES = [[/J\.?\s?P\.?\s?MORGAN/,'JPMorgan'],[/HSBC/,'HSBC'],[/GOLDMAN/,'Goldman Sachs'],[/BOFA|BANC OF AMERICA|BANK OF AMERICA|MERRILL/,'Bank of America'],
 [/CITIGROUP|CITIBANK|\bCITI\b/,'Citigroup'],[/MORGAN STANLEY/,'Morgan Stanley'],[/WELLS FARGO/,'Wells Fargo'],[/BARCLAYS/,'Barclays'],[/\bRBC\b|ROYAL BANK OF CANADA/,'RBC'],
 [/SCOTIA/,'Scotiabank'],[/\bUBS\b/,'UBS'],[/BNP/,'BNP Paribas'],[/SOCIETE|SG AMERICAS/,'Société Générale'],[/DEUTSCHE/,'Deutsche Bank'],
 [/MIZUHO/,'Mizuho'],[/NOMURA/,'Nomura'],[/MACQUARIE/,'Macquarie'],[/STONEX|FCSTONE/,'StoneX'],[/MAREX/,'Marex'],[/ABN AMRO/,'ABN AMRO'],
 [/\bADM\b/,'ADM'],[/STANDARD CHARTERED/,'Standard Chartered'],[/ICBC/,'ICBC'],[/BANK OF CHINA|BOCI/,'Bank of China'],[/\bTD\b|TORONTO/,'TD'],
 [/BMO|BANK OF MONTREAL/,'BMO'],[/BRINK/,"Brink's"],[/LOOMIS/,'Loomis'],[/MALCA/,'Malca-Amit'],[/MANFRA/,'Manfra, Tordella & Brookes'],
 [/ASAHI/,'Asahi'],[/INTERNATIONAL DEPOSITORY|\bIDS\b/,'IDS of Delaware'],[/DELAWARE DEPOSITORY/,'Delaware Depository'],[/DORMAN/,'Dorman'],[/ADVANTAGE/,'Advantage Futures']];
const GLOBAL_BANKS = new Set(['JPMorgan','HSBC','Goldman Sachs','Bank of America','Citigroup','Morgan Stanley','Wells Fargo','Barclays','RBC','Scotiabank','UBS','BNP Paribas','Société Générale','Deutsche Bank','Mizuho','Nomura','Macquarie','Standard Chartered','ICBC','Bank of China','TD','BMO','ABN AMRO']);
function bankName(raw){
  const u = String(raw).toUpperCase();
  for (const [re, n] of BANK_RULES) if (re.test(u)) return n;
  return String(raw).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

/* deliveries: per display bank per day -> {stp, iss, H:[i,s], C:[i,s]} (contracts) */
function deliveriesByBank(){
  const daily = (DATA.deliveries || {}).daily || {}, days = Object.keys(daily).sort(), banks = {};
  days.forEach(d => {
    Object.entries(daily[d] || {}).forEach(([raw, acc]) => {
      const b = bankName(raw), rec = ((banks[b] = banks[b] || {})[d] = banks[b][d] || {iss:0, stp:0, H:[0,0], C:[0,0]});
      Object.entries(acc).forEach(([org, [i, s]]) => { rec.iss += i; rec.stp += s; if (rec[org]){ rec[org][0] += i; rec[org][1] += s; } });
    });
  });
  return {days, banks};
}

function grossByMonth(){
  const g = {};
  Object.values(DATA.countries || {}).forEach(s => {
    for (let i = 1; i < s.length; i++){
      const d = s[i][0], dv = s[i][1] - s[i - 1][1], e = (g[d] = g[d] || {buy:0, sell:0, nb:0, ns:0});
      if (dv > 0){ e.buy += dv; e.nb++; } else if (dv < 0){ e.sell -= dv; e.ns++; }
    }
  });
  return g;
}

function comexGross(){
  const deps = ((DATA.comex || {}).depositories) || {}, g = {};
  Object.values(deps).forEach(s => {
    for (let i = 1; i < s.length; i++){
      const dv = (s[i][1] + s[i][2]) - (s[i - 1][1] + s[i - 1][2]), e = (g[s[i][0]] = g[s[i][0]] || {buy:0, sell:0});
      if (dv > 0) e.buy += dv; else e.sell -= dv;
    }
  });
  return Object.keys(g).length ? g : null;
}

const F13_STATUS = {new:['مركز جديد','st-new'], first:['أول إفصاح','st-new'], up:['زيادة','st-up'], down:['تخفيض','st-down'], closed:['أغلق المركز','st-closed'], same:['دون تغيير','st-same']};

const F13_FUNDS = ['GLD', 'IAU', 'IAUM', 'GLDM', 'SGOL', 'AAAU', 'BAR'];
function f13Name(raw){
  const u = String(raw).toUpperCase();
  for (const [re, n] of BANK_RULES) if (GLOBAL_BANKS.has(n) && re.test(u)) return n;
  return String(raw).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\s+\/[a-z]{2,3}\/?$/i, '')
    .replace(/\b(Llc|Lp|Llp|Plc|Ag|Sa|Nv|Ltd|Lllp|Na|Usa|Us|Uk)\b/g, w => w.toUpperCase()).replace(/[,.\s]+$/, '');
}
const nm = raw => `<bdi>${esc(f13Name(raw))}</bdi>`;

        <p>حيازات المؤسسات في صناديق الذهب المدعومة بذهب فعلي: GLD وIAU وIAUM وGLDM وSGOL وAAAU وBAR. حوّلنا عدد الأسهم إلى أطنان ذهب بضربه في كمية الذهب التي يمثّلها السهم يوم نهاية الربع، فتظهر كل مؤسسة بكمية ذهب قابلة للمقارنة.</p></section>
      <section><h3>حدود التقرير</h3>
        <p>يصدر بعد نهاية الربع بمدة تصل إلى 45 يومًا. يرصد المراكز الطويلة فقط، ولا يشمل العقود الآجلة ولا مشتقات OTC ولا المراكز المكشوفة (Short) ولا الذهب الفعلي في الخزائن، واستبعدنا منه عقود الخيارات Put وCall. وحيازة البنك تشمل ما يديره لعملائه، لا ما يملكه لحسابه فقط.</p></section>
      <section><h3>كيف تقرأ هذا القسم؟</h3>
        <ul class="legend-list">
          <li>${badge('new')} لم تكن تملك شيئًا في الربع السابق ثم فتحت مركزًا.</li>
          <li>${badge('up')} زادت حيازتها، ${badge('down')} خفّضتها.</li>
          <li>${badge('closed')} باعت كل ما تملك وخرجت تمامًا.</li>
          <li>${badge('first')} أول إفصاح 13F لها في السجل، فلا توجد مقارنة.</li>
        </ul>
        <p>تنشر SEC الملفات كل ثلاثة أشهر، فيضيف الـ Dashboard كل ربع جديد تلقائيًا ويحتفظ بكل الأرباع السابقة.</p></section>
    </div></div>`;
}

function f13Brief(P, first){
  const nb = P.n.new + P.n.first + P.n.up, ns = P.n.down + P.n.closed, net = P.buy - P.sell;
  let h = `<div class="brief"><h3>قراءة التقرير: الربع المنتهي في ${fDay.format(toDate(P.p))}</h3>
    <p>أفصحت ${bd(nf0.format(P.holders))} مؤسسة عن حيازة ${TN(P.total)} من الذهب عبر صناديق الذهب المتداولة.`;
  if (first) h += ' هذا أول ربع في السجل، فلا توجد مقارنة بربع سابق.</p>';
  else h += ` ${net >= 0 ? 'زادت المؤسسات حيازتها بصافي' : 'خفّضت المؤسسات حيازتها بصافي'} ${sTN(net)}: اشترت ${bd(nf0.format(nb))} مؤسسة ما مجموعه ${TN(P.buy)}، وباعت ${bd(nf0.format(ns))} مؤسسة ما مجموعه ${TN(P.sell)}.</p>`;
  if (P.buyers.length) h += `<p><b class="up">أكبر المشترين:</b> ${P.buyers.slice(0, 5).map(moveTxt).join('، ')}.</p>`;
  if (P.sellers.length) h += `<p><b class="down">أكبر البائعين:</b> ${P.sellers.slice(0, 5).map(moveTxt).join('، ')}.</p>`;
  if (!first && P.n.new + P.n.first) h += `<p>فتحت ${bd(nf0.format(P.n.new + P.n.first))} مؤسسة مراكز جديدة${P.opened.length ? `، أبرزها ${P.opened.slice(0, 3).map(m => `${nm(m.n)} (${TN(m.b)})`).join('، ')}` : ''}.</p>`;
  if (!first && P.n.closed) h += `<p>أغلقت ${bd(nf0.format(P.n.closed))} مؤسسة مراكزها بالكامل${P.closed.length ? `، أبرزها ${P.closed.slice(0, 3).map(m => `${nm(m.n)} (كانت تملك ${TN(m.a)})`).join('، ')}` : ''}.</p>`;
  if (!P.complete) h += `<p class="note-warn">مهلة الإفصاح عن هذا الربع لم تكتمل في الملفات المنشورة بعد، فقد تتغير الأرقام عند إضافة الإيداعات المتأخرة.</p>`;
  return h + '</div>';
}

function f13List(title, rows, cls){
  if (!rows.length) return `<div class="ranked wide"><h3>${title}</h3><p class="empty">لا توجد مؤسسات في هذه الفئة.</p></div>`;
  const maxAbs = Math.max(1, ...rows.map(m => Math.abs(m.b - m.a)));
  return `<div class="ranked wide"><h3>${title}</h3>${rows.map(m => {
    const d = m.b - m.a, pct = m.a ? d / m.a * 100 : null;
    return `<div class="row"><span>${mgrBtn(m.c, m.n)}</span>
      <span class="track"><span class="bar ${cls}" style="display:block;width:${Math.max(2, Math.abs(d) / maxAbs * 100).toFixed(1)}%"></span></span>
      <span class="val ${cls}">${sTN(d)}</span>
      <span class="det">${badge(m.s)} ${sKG(d)}${pct == null ? '' : ' ' + sPCT(pct)}، من ${TN(m.a)} إلى ${TN(m.b)}</span></div>`;
  }).join('')}</div>`;
}

R.f13 = () => {
  const f = DATA.f13;
  let h = f13Intro() + sourceWarn('f13');
  if (!f || !f.periods || !f.periods.length) return h + '<p class="empty">يُنزَّل أرشيف SEC في أول تشغيل بعد هذا التحديث، وقد يستغرق التشغيل عدة دقائق. أعد تحميل الصفحة بعد انتهائه.</p>';
  const P = f.periods;
  const pts = P.map((q, i) => ({d: q.p, line: q.total, buy: q.buy, sell: q.sell, P: q, idx: i,
    delta: i ? q.total - P[i - 1].total : 0, pct: i && P[i - 1].total ? (q.total - P[i - 1].total) / P[i - 1].total * 100 : null,
    d3: i >= 3 ? q.total - P[i - 3].total : null})).slice(-WINDOW);
  const si = rvSel('f13', pts), Q = pts[si].P, first = pts[si].idx === 0;
  h += reportView('f13', 'حيازة المؤسسات عبر الأرباع (اختر الربع من القائمة)', pts, kgCfg({
    monthly:true, buy:'مشتريات المؤسسات', sell:'مبيعات المؤسسات', line:'إجمالي الحيازة',
    extra: q => `<div><span>عدد المؤسسات</span><b>${bd(nf0.format(q.P.holders))}</b></div>`,
    cells: q => [
      {label:'إجمالي حيازة المؤسسات', v: TN(q.line), sub: `${bd(nf0.format(q.P.holders))} مؤسسة`},
      {label:'اشترت', v: `<span class="up">${TN(q.buy)}</span>`, sub: `${bd(nf0.format(q.P.n.new + q.P.n.first + q.P.n.up))} مؤسسة، منها ${bd(nf0.format(q.P.n.new + q.P.n.first))} مركزًا جديدًا`},
      {label:'باعت', v: `<span class="down">${TN(q.sell)}</span>`, sub: `${bd(nf0.format(q.P.n.down + q.P.n.closed))} مؤسسة، منها ${bd(nf0.format(q.P.n.closed))} أغلقت مركزها`},
    ]}));
  h += f13Brief(Q, first);
  const funds = F13_FUNDS.filter(k => Q.funds[k]).map(k => `<span class="chip">${k}: ${TN(Q.funds[k])}</span>`).join('');
  if (funds) h += `<div class="meta" style="margin-bottom:16px">${funds}</div>`;
  if (!first) h += `<div class="cols">${f13List('أكبر 15 مشتريًا', Q.buyers, 'up')}${f13List('أكبر 15 بائعًا', Q.sellers, 'down')}</div>`;

  // known banks & institutions
  const M = f.managers || {}, pi = P.findIndex(x => x.p === Q.p);
  const majors = Object.entries(M).filter(([, m]) => m.m).map(([cik, m]) => {
    const s = m.s[pi] || [], prev = pi ? (m.s.slice(0, pi).reverse().find(x => x[1] != null) || [])[1] : null;
    return {cik, m, v: s[1], st: s[2], h: s[3] || {}, prev};
  }).filter(x => x.v != null && (x.v > 0 || x.st === 'closed')).sort((a, b) => b.v - a.v);
  if (majors.length) h += `<h3 class="rv-title">البنوك والمؤسسات المعروفة في هذا الربع</h3>
    <div class="tablebox"><table><thead><tr><th>المؤسسة</th><th class="n">الحيازة</th><th class="n">التغير</th><th>الحالة</th><th class="n">GLD (سهم)</th><th class="n">IAU (سهم)</th></tr></thead><tbody>
    ${majors.map(x => { const d = x.prev == null ? null : x.v - x.prev, cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
      return `<tr><td>${mgrBtn(x.cik, x.m.n)}</td><td class="n">${TN(x.v)}</td><td class="n ${cls}">${d == null ? '—' : sTN(d)}</td><td>${badge(x.st)}</td>
        <td class="n">${x.h.GLD ? bd(nf0.format(x.h.GLD)) : '—'}</td><td class="n">${x.h.IAU ? bd(nf0.format(x.h.IAU)) : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>`;

  // drill-down per institution
  const list = Object.entries(M).map(([cik, m]) => ({cik, m, last: (m.s.slice().reverse().find(x => x[1] != null) || [])[1] || 0}))
    .sort((a, b) => b.last - a.last);
  if (list.length){
    if (!state.mgr || !M[state.mgr]) state.mgr = (list.find(x => /GOLDMAN/i.test(x.m.n)) || list[0]).cik;
    const mm = M[state.mgr], ser = mm.s.filter(x => x[1] != null);
    const mpts = ser.map((x, i) => ({d: x[0], line: x[1], st: x[2], h: x[3] || {},
      delta: i ? x[1] - ser[i - 1][1] : 0, pct: i && ser[i - 1][1] ? (x[1] - ser[i - 1][1]) / ser[i - 1][1] * 100 : null,
      d3: i >= 3 ? x[1] - ser[i - 3][1] : null})).map(q => ({...q, buy: Math.max(q.delta, 0), sell: Math.max(-q.delta, 0)})).slice(-WINDOW);
    h += `<div class="picker" id="mgr-anchor"><label for="mgr-pick">مؤسسة بعينها</label><select id="mgr-pick" data-act="mgr-pick">${list.map(x =>
      `<option value="${esc(x.cik)}" ${x.cik === state.mgr ? 'selected' : ''}>${esc(f13Name(x.m.n))}</option>`).join('')}</select></div>`;
    h += reportView('mg-' + state.mgr, `${nm(mm.n)}: حيازتها ربعًا بربع`, mpts, kgCfg({
      monthly:true, buy:'شراء', sell:'بيع', line:'الحيازة',
      extra: q => `<div><span>الحالة</span><b>${q.st ? F13_STATUS[q.st][0] : '—'}</b></div>`,
      cells: q => [
        {label:'أسهم GLD', v: q.h.GLD ? bd(nf0.format(q.h.GLD)) : '—', sub: 'SPDR Gold Shares'},
        {label:'أسهم IAU', v: q.h.IAU ? bd(nf0.format(q.h.IAU)) : '—', sub: Object.keys(q.h).filter(k => k !== 'GLD' && k !== 'IAU').map(k => `${k}: ${nf0.format(q.h[k])}`).join('، ') || 'iShares Gold Trust'},
        {label:'الإجمالي بالذهب', v: TN(q.line), sub: `${KG(q.line)} ${badge(q.st)}`},
      ]}));
  }
  h += `<p class="explain">المصدر: ملفات SEC Form 13F Data Sets. الأسماء كما أودعتها المؤسسات، والكميات محوَّلة إلى ذهب بتاريخ نهاية كل ربع.</p>`;
  return h;
};

/* ---------- shell ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button class="tab" role="tab" data-act="tab" data-v="${t.id}" aria-selected="${t.id === state.tab}">${t.label}</button>`).join('');
}

function renderMast(){
  const cb = DATA.central_banks, l = cb && last(cb.series || []);
  const gld = DATA.etf && last(DATA.etf.GLD || []);
  const com = DATA.comex && last(DATA.comex.total || []);
  const parts = [];
  if (l) parts.push(`<span><b>${bd(nf0.format(l[1] / 1000))}</b>طن لدى البنوك المركزية المُبلِّغة</span>`);
  if (com) parts.push(`<span><b>${bd(nf0.format(com[1] / 1000))}</b>طن في COMEX</span>`);
  if (gld) parts.push(`<span><b>${bd(nf0.format(gld[1] / 1000))}</b>طن في GLD</span>`);
  document.getElementById('assay').innerHTML = parts.join('') || 'لا توجد بيانات بعد';
  document.getElementById('updated').textContent = DATA.generated_utc
    ? `آخر تشغيل للتحديث التلقائي: ${fStamp.format(new Date(DATA.generated_utc))}` : '';
}

function render(){
  renderTabs();
  document.getElementById('view').innerHTML = R[state.tab]();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !DATA || b.tagName === 'SELECT') return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'tab'){ state.tab = v; state.all = false; history.replaceState(null, '', '#' + v); }
  else if (act === 'mode') state.mode[state.tab] = v;
  else if (act === 'period') state.period[state.tab] = v;
  else if (act === 'all') state.all = !state.all;
  else if (act === 'sel' || (b.classList.contains('hit'))) state.sel[b.dataset.rv] = +b.dataset.i;
  else if (act === 'country-go'){ state.country = v; }
  else if (act === 'bankview') state.bankView = v;
  else if (act === 'cotcat') state.cotCat = v;
  else if (act === 'bank'){ state.bank = v; state.bankView = 'deliv'; }
  else if (act === 'vault') state.vault = v;
  else if (act === 'mgr'){ state.mgr = v; }
  const y = window.scrollY;
  render();
  if (act === 'tab') document.getElementById('tabs').scrollIntoView({block:'nearest'});
  else if (act === 'country-go'){ const el = document.getElementById('country-pick'); if (el) el.scrollIntoView({block:'center'}); }
  else if (act === 'mgr'){ const el = document.getElementById('mgr-anchor'); if (el) el.scrollIntoView({block:'start'}); }
  else window.scrollTo(0, y);
});

document.addEventListener('click', e => {
  const r = e.target.closest('rect.hit');
  if (!r || !DATA) return;
  state.sel[r.dataset.rv] = +r.dataset.i;
  const y = window.scrollY; render(); window.scrollTo(0, y);
  showTip(document.querySelector(`rect.hit[data-rv="${CSS.escape(r.dataset.rv)}"][data-i="${r.dataset.i}"]`));
});

document.addEventListener('change', e => {
  if (e.target.dataset.act === 'mgr-pick'){ state.mgr = e.target.value; const y = window.scrollY; render(); window.scrollTo(0, y); }
  if (e.target.dataset.act === 'country'){ state.country = e.target.value; const y = window.scrollY; render(); window.scrollTo(0, y); }
});

function showTip(r){
  if (!r) return;
  const plot = r.closest('.rv-plot'), tt = plot && plot.querySelector('.tt');
  if (!tt) return;
  tt.innerHTML = panelHTML(r.dataset.rv, +r.dataset.i);
  tt.hidden = false;
  const pb = plot.getBoundingClientRect(), rb = r.getBoundingClientRect();
  const cx = rb.left + rb.width / 2 - pb.left, tw = tt.offsetWidth;
  let left = cx + 12;
  if (left + tw > pb.width) left = cx - tw - 12;
  tt.style.left = Math.max(0, left) + 'px';
  plot.querySelectorAll('rect.hover').forEach(x => x.classList.remove('hover'));
  r.classList.add('hover');
}
document.addEventListener('mouseover', e => { const r = e.target.closest && e.target.closest('rect.hit'); if (r) showTip(r); });
document.addEventListener('mouseout', e => {
  const plot = e.target.closest && e.target.closest('.rv-plot');
  if (plot && !plot.contains(e.relatedTarget)){ const tt = plot.querySelector('.tt'); if (tt) tt.hidden = true; }
});

(async () => {
  const fromHash = location.hash.slice(1);
  if (TABS.some(t => t.id === fromHash)) state.tab = fromHash;
  try {
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    renderMast();
    render();
  } catch (err){
    document.getElementById('assay').textContent = 'لم يُعثر على البيانات';
    document.getElementById('view').innerHTML = `<p class="warn">تعذّر قراءة الملف data.json (${esc(err.message)}). إذا كان هذا أول تشغيل، افتح تبويب Actions في GitHub، شغّل «تحديث بيانات الذهب»، وانتظر حتى ينتهي ثم أعد تحميل الصفحة.</p>`;
  }
})();
</script>

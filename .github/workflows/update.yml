name: تحديث بيانات الذهب

on:
  schedule:
    - cron: "7 * * * *"       # كل ساعة: سعر الذهب، ثم يقرر السكربت أي تقرير حان موعده
  workflow_dispatch:          # زر التشغيل اليدوي من تبويب Actions
    inputs:
      ai_force:
        description: "اكتب تقرير الذكاء الاصطناعي الآن (true / false)"
        required: false
        default: "false"
      full_refresh:
        description: "افحص كل المصادر الآن حتى لو لم يحن موعدها (true / false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: gold-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install requests xlrd openpyxl pdfplumber curl_cffi

      - name: جلب البيانات
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_FORCE: ${{ github.event.inputs.ai_force }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
        run: python fetch_gold.py

      - name: حفظ البيانات في المستودع
        run: |
          git config user.name "gold-data-bot"
          git config user.email "gold-data-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "تحديث بيانات الذهب $(date -u +%F)"
          git push

      - name: إبقاء التحديث التلقائي مفعّلًا
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY" || true

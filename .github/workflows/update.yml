name: تحديث بيانات الذهب

on:
  schedule:
    - cron: "15 13 * * 1-5"   # صباح نيويورك: بعد نشر أرشيف SPDR وأسعار لندن وشنغهاي
    - cron: "30 23 * * 1-5"   # بعد إغلاق السوق الأمريكي: CME وCOT يوم الجمعة
    - cron: "0 14 * * 6"      # السبت: التقاط أي تقرير تأخر
  workflow_dispatch:          # زر التشغيل اليدوي من تبويب Actions

permissions:
  contents: write
  actions: write

concurrency:
  group: gold-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install requests xlrd openpyxl pdfplumber curl_cffi

      - name: جلب البيانات
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python fetch_gold.py

      - name: حفظ البيانات في المستودع
        run: |
          git config user.name "gold-data-bot"
          git config user.email "gold-data-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "تحديث بيانات الذهب $(date -u +%F)"
          git push

      - name: إبقاء التحديث التلقائي مفعّلًا
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY" || true

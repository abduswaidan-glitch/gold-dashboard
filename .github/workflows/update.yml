name: تحديث بيانات الذهب

on:
  schedule:
    - cron: "7,37 * * * *"    # GitHub يشغّل منها 4-7 فقط يوميًا، وكل تشغيل يبقى حيًا ~5.5 ساعات ويحدّث كل 30 دقيقة (run_loop.sh)
  workflow_dispatch:          # زر التشغيل اليدوي من تبويب Actions
    inputs:
      ai_force:
        description: "اكتب تقرير الذكاء الاصطناعي الآن (true / false)"
        required: false
        default: "false"
      full_refresh:
        description: "افحص كل المصادر الآن حتى لو لم يحن موعدها (true / false)"
        required: false
        default: "false"
      loop_minutes:
        description: "اختبار: أبقِ التشغيل حيًا هذه الدقائق (0 = تحديث واحد)"
        required: false
        default: "0"
      dry_run:
        description: "اختبار: لا تحفظ شيئًا ولا تكتب تقريرًا ذكيًا (true / false)"
        required: false
        default: "false"
      ignore_weekend:
        description: "اختبار: شغّل حتى في عطلة نهاية الأسبوع (true / false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: gold-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install requests xlrd openpyxl pdfplumber curl_cffi

      - name: جلب البيانات وحفظها (تشغيل حي)
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          ANTHROPIC_API_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          AI_FORCE: ${{ github.event.inputs.ai_force }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '325' || github.event.inputs.loop_minutes || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          IGNORE_WEEKEND: ${{ github.event.inputs.ignore_weekend || 'false' }}
        run: cp run_loop.sh "$RUNNER_TEMP/loop.sh" && bash "$RUNNER_TEMP/loop.sh"   # نسخة: السكربت يسحب الكود أثناء عمله

      - name: إبقاء التحديث التلقائي مفعّلًا
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY" || true
